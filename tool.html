<!DOCTYPE html>

<body class="flex items-center justify-center min-h-screen p-4">

            <form id="broadcastForm" class="space-y-6">

                    <div class="flex gap-6 mb-3">

                    <div id="specificEmailsContainer" class="hidden mt-4">

                        <input type="text" id="specificEmails"
                               class="w-full bg-[#1a1c23] border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500 transition-colors text-sm font-mono"
                               placeholder="ex: tonmail@gmail.com, test@yahoo.fr">

                <!-- SUJET -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Sujet de l'email</label>
                    <input type="text" id="broadcastSubject"

                <!-- MESSAGE -->
                <div>
                    <div class="flex justify-between items-end mb-2">

  <div style="max-width: 650px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.06);">
    
    <!-- Header -->
    <div style="background: linear-gradient(135deg, #111827 0%, #000000 100%); padding: 35px 40px; text-align: center;">
        <span style="color: #ffffff; font-size: 26px; font-weight: 800; letter-spacing: 3px;">LEVELUP</span><span style="color: #ef4444; font-size: 26px; font-weight: 800;">.</span>

    <!-- Body -->

        <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.6; color: #4b5563;">Bonjour <strong>{nom}</strong>,</p>

        </p>

        <!-- Callout Premium -->
        <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin: 32px 0;">
          <h2 style="margin: 0 0 12px; font-size: 17px; color: #0f172a; font-weight: 700; display: flex; align-items: center;">
            <span style="font-size: 20px; margin-right: 10px;">✨</span> Une transparence totale

          <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #64748b;">
            Nous avons lancé un espace dédié exclusif. Vos retours, qu'ils soient élogieux ou constructifs, y sont publiés <strong>directement et publiquement</strong>. Aucune censure, juste la réalité de votre expérience.

        <p style="margin: 0 0 32px; font-size: 16px; line-height: 1.6; color: #4b5563;">

        </p>

        <!-- Bouton CTA Premium -->

          <a href="https://levelup-ecosystem.com/feedback" style="display: inline-block; background-color: #0f172a; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none; padding: 16px 36px; border-radius: 30px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);">

  </div>
</div></textarea>
                    </div>

                    <div id="previewContainer" class="w-full min-h-[400px]"></div>
                </div>

                <button type="submit" id="submitBtn"

                </button>
            </form>

            <div id="statusAlert" class="mt-6 hidden p-4 rounded-lg font-medium text-center border"></div>
        </div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut }
                          from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, collectionGroup, collection, getDocs, query, limit }
                          from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

// ── CONFIG FIREBASE ──
const _cfg = {
    apiKey:            "AIzaSyA3JgvNu5p-43037jvm4WRDaJHI9ES7uGM",
    authDomain:        "levelup-ia.firebaseapp.com",
    projectId:         "levelup-ia",
    storageBucket:     "levelup-ia.firebasestorage.app",
    messagingSenderId: "229420004282",
    appId:             "1:229420004282:web:6735f059a947f0936ae383"
};
const _app  = initializeApp(_cfg);
const _auth = getAuth(_app);
const _db   = getFirestore(_app);
const _gp   = new GoogleAuthProvider();
_gp.setCustomParameters({ prompt: 'select_account' });

const APP_MAIN = 'level-ia-premium';

// ── URL HELPER ──
const getApiUrl = (path) => {
    try {
        const h  = window.location.hostname || '';
        const ok = h.includes('levelup-ecosystem.com') || h.includes('localhost') || h.includes('127.0.0.1');
        if (!ok || window.location.protocol === 'blob:' || window.location.origin === 'null')
            return 'https://levelup-ecosystem.com' + path;
        return path;
    } catch { return 'https://levelup-ecosystem.com' + path; }
};

// ── GESTION AUTH → met à jour le header et le banner ──
const authBlock   = document.getElementById('authBlock');
const loginBanner = document.getElementById('loginBanner');

function renderAuthHeader(user) {
    if (user) {
        // Connecté : affiche nom + bouton déconnexion
        authBlock.innerHTML = `
            <div class="flex items-center gap-3">
                ${user.photoURL
                    ? `<img src="${user.photoURL}" class="w-7 h-7 rounded-full object-cover border-2 border-white/30">`
                    : `<div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold">${(user.displayName||user.email||'?')[0].toUpperCase()}</div>`
                }
                <span class="text-xs font-medium text-white/80 hidden sm:block">${user.displayName || user.email}</span>
                <button id="logoutBtn" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline">Déconnexion</span>
                </button>
            </div>`;
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(_auth));
        loginBanner.classList.add('hidden');
    } else {
        // Non connecté : bouton Google dans le header
        authBlock.innerHTML = `
            <button id="headerLoginBtn" class="flex items-center gap-2 bg-white text-gray-800 font-semibold text-xs py-1.5 px-3 rounded-lg hover:bg-gray-100 transition">
                <svg width="14" height="14" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Se connecter
            </button>`;
        document.getElementById('headerLoginBtn').addEventListener('click', doLogin);
        loginBanner.classList.remove('hidden');
    }
}

async function doLogin() {
    try { await signInWithPopup(_auth, _gp); }
    catch (e) { if (e.code !== 'auth/popup-closed-by-user') await showModal('Erreur : ' + e.message, 'alert'); }
}

// Liaison bouton du banner
document.getElementById('loginBannerBtn').addEventListener('click', doLogin);

onAuthStateChanged(_auth, (user) => { renderAuthHeader(user); });

// ── MODALE CUSTOM ──
function showModal(message, type = 'alert') {
    return new Promise((resolve) => {
        const modal        = document.getElementById('customModal');
        const modalContent = document.getElementById('customModalContent');
        const messageEl    = document.getElementById('customModalMessage');
        const buttonsEl    = document.getElementById('customModalButtons');
        const iconEl       = document.getElementById('modalIcon');

        messageEl.innerHTML = message;
        buttonsEl.innerHTML = '';

        if (type === 'confirm') {
            iconEl.className = "fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-3";
            buttonsEl.innerHTML = `
                <button id="modalBtnCancel"  class="w-full px-4 py-2.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm text-white font-medium transition">Annuler</button>
                <button id="modalBtnConfirm" class="w-full px-4 py-2.5 bg-red-600 hover:bg-red-700 rounded-lg text-sm text-white font-medium transition">Confirmer</button>`;
            document.getElementById('modalBtnCancel').onclick  = () => { closeM(); resolve(false); };
            document.getElementById('modalBtnConfirm').onclick = () => { closeM(); resolve(true);  };
        } else {
            const isErr = message.includes("Erreur") || message.includes("DANGER") || message.includes("⚠️");
            iconEl.className = isErr
                ? "fa-solid fa-circle-xmark text-4xl text-red-500 mb-3"
                : "fa-solid fa-circle-info text-4xl text-blue-500 mb-3";
            buttonsEl.innerHTML = `<button id="modalBtnOk" class="w-full px-6 py-2.5 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm text-white font-bold transition">OK</button>`;
            document.getElementById('modalBtnOk').onclick = () => { closeM(); resolve(true); };
        }

        modal.classList.remove('hidden');
        requestAnimationFrame(() => {
            modalContent.classList.remove('scale-95','opacity-0');
            modalContent.classList.add('scale-100','opacity-100');
        });

        function closeM() {
            modalContent.classList.remove('scale-100','opacity-100');
            modalContent.classList.add('scale-95','opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }
    });
}

// ── APERÇU HTML ──
const tabPreview       = document.getElementById('tabPreview');
const tabCode          = document.getElementById('tabCode');
const editorContainer  = document.getElementById('editorContainer');
const previewContainer = document.getElementById('previewContainer');
const broadcastMessage = document.getElementById('broadcastMessage');

function updatePreview() {
    previewContainer.innerHTML = broadcastMessage.value.replace(/\{nom\}/gi, 'Utilisateur');
}
updatePreview();
broadcastMessage.addEventListener('input', updatePreview);

tabPreview.addEventListener('click', () => {
    tabPreview.className = "px-3 py-1 text-xs font-bold rounded-md bg-gray-700 text-white transition-colors";
    tabCode.className    = "px-3 py-1 text-xs font-medium rounded-md text-gray-400 hover:text-white transition-colors";
    editorContainer.classList.add('hidden');
    previewContainer.classList.remove('hidden');
    updatePreview();
});
tabCode.addEventListener('click', () => {
    tabCode.className    = "px-3 py-1 text-xs font-bold rounded-md bg-gray-700 text-white transition-colors";
    tabPreview.className = "px-3 py-1 text-xs font-medium rounded-md text-gray-400 hover:text-white transition-colors";
    previewContainer.classList.add('hidden');
    editorContainer.classList.remove('hidden');
});

// ── RADIOS CIBLE ──
document.querySelectorAll('input[name="targetAudience"]').forEach(radio => {
    radio.addEventListener('change', function () {
        document.getElementById('specificEmailsContainer')
            .classList.toggle('hidden', this.value !== 'specific');
    });
});

// ── RÉCUPÉRATION UTILISATEURS FIREBASE ──
window.loadedFirebaseUsers = [];

document.getElementById('loadUsersBtn').addEventListener('click', async () => {
    const currentUser = _auth.currentUser;
    if (!currentUser) {
        await showModal("⚠️ Tu dois d'abord te connecter avec Google (bouton en haut à droite).", 'alert');
        return;
    }

    const btn       = document.getElementById('loadUsersBtn');
    const container = document.getElementById('usersListContainer');
    const countEl   = document.getElementById('usersCount');
    const listEl    = document.getElementById('usersList');

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion Firebase…';
    btn.classList.add('opacity-50', 'cursor-not-allowed');

    try {
        const usersMap = {};

        // 1. collectionGroup security → tous les users avec une clé LVL
        const keysSnap = await getDocs(collectionGroup(_db, 'security'));
        keysSnap.docs.forEach(d => {
            const data  = d.data();
            const uid   = data.uid || d.ref.parent?.parent?.id;
            if (!uid) return;
            const email = data.email || data.owner || '';
            const name  = data.displayName || data.name || email.split('@')[0] || 'Utilisateur';
            usersMap[uid] = { uid, email, name };
        });

        // 2. users_status → complète les infos manquantes
        const statusSnap = await getDocs(
            query(collection(_db, 'artifacts', APP_MAIN, 'public', 'data', 'users_status'), limit(2000))
        );
        statusSnap.docs.forEach(d => {
            const u = d.data();
            if (!usersMap[d.id]) {
                usersMap[d.id] = { uid: d.id, email: u.email || '', name: u.displayName || u.name || '' };
            } else {
                if (!usersMap[d.id].email && u.email)                    usersMap[d.id].email = u.email;
                if (!usersMap[d.id].name  && (u.displayName || u.name)) usersMap[d.id].name  = u.displayName || u.name;
            }
        });

        // 3. Garde uniquement ceux avec un vrai email
        const users = Object.values(usersMap).filter(u => u.email && u.email.includes('@'));
        if (users.length === 0) throw new Error('Aucun utilisateur avec email trouvé dans Firebase.');

        window.loadedFirebaseUsers = users;
        container.classList.remove('hidden');
        countEl.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${users.length} utilisateurs réels trouvés`;

        listEl.innerHTML = '';
        users.forEach(u => {
            const li = document.createElement('li');
            li.innerHTML = `<span class="text-white">${u.name || 'Utilisateur'}</span> — <span class="text-gray-500">${u.email}</span>`;
            listEl.appendChild(li);
        });

    } catch (err) {
        console.error(err);
        await showModal('Erreur Firebase : ' + err.message, 'alert');
    } finally {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Rafraîchir la BDD';
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
});

// ── ENVOI DES MAILS ──
document.getElementById('broadcastForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const subject    = document.getElementById('broadcastSubject').value.trim();
    const rawMessage = broadcastMessage.value.trim();
    const btn        = document.getElementById('submitBtn');
    const alertBox   = document.getElementById('statusAlert');

    if (!subject)    { await showModal("Veuillez entrer un sujet d'email.", 'alert'); return; }
    if (!rawMessage) { await showModal("Veuillez entrer un message.", 'alert'); return; }

    const targetType = document.querySelector('input[name="targetAudience"]:checked').value;
    let targetUsers  = [];

    if (targetType === 'specific') {
        const rawEmails = document.getElementById('specificEmails').value;
        targetUsers = rawEmails.split(',')
            .map(e => ({ email: e.trim(), name: 'Administrateur' }))
            .filter(u => u.email);
        if (targetUsers.length === 0) {
            await showModal("Veuillez entrer au moins une adresse email valide.", 'alert');
            return;
        }
        const ok = await showModal(
            `🚀 Envoi de TEST vers :<br><br><span class="text-yellow-500 font-bold">${targetUsers.map(u => u.email).join(', ')}</span> ?`,
            'confirm'
        );
        if (!ok) return;
    } else {
        if (!window.loadedFirebaseUsers?.length) {
            await showModal("⚠️ Clique d'abord sur <b>'Récupérer les vrais utilisateurs'</b>.", 'alert');
            return;
        }
        targetUsers = window.loadedFirebaseUsers;
        const ok = await showModal(
            `🚨 <b>DANGER</b> : Envoi RÉEL à <b>${targetUsers.length} utilisateurs</b>.<br><br>Leur vrai nom sera intégré. Es-tu absolument sûr ?`,
            'confirm'
        );
        if (!ok) return;
    }

    btn.disabled = true;
    alertBox.classList.remove('hidden');
    alertBox.className = 'mt-6 p-4 rounded-lg font-medium text-center border block bg-gray-900 text-gray-300 border-gray-700';

    let successCount = 0, failCount = 0;

    for (let i = 0; i < targetUsers.length; i++) {
        const user            = targetUsers[i];
        const displayName     = user.name || 'Utilisateur';
        const personalizedMsg = rawMessage.replace(/\{nom\}/gi, displayName);

        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Envoi en cours (${i + 1}/${targetUsers.length})…</span>`;
        alertBox.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> Envoi vers <strong>${user.email}</strong>…<br>
            <span class="text-xs text-gray-500">Succès: ${successCount} | Échecs: ${failCount}</span>`;

        try {
            const res = await fetch(getApiUrl('/api/send'), {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email:   user.email,
                    name:    displayName,
                    type:    'CUSTOM_HTML',
                    subject: subject,
                    html:    personalizedMsg
                })
            });
            if (res.ok) successCount++; else failCount++;
        } catch (err) {
            console.error('Erreur pour', user.email, err);
            failCount++;
        }

        await new Promise(r => setTimeout(r, 250));
    }

    alertBox.className = 'mt-6 p-4 rounded-lg font-medium text-center border block bg-green-900/50 text-green-300 border-green-700';
    alertBox.innerHTML = `<i class="fa-solid fa-check-circle mr-2"></i> <strong>Envoi terminé !</strong><br>${successCount} envoyés, ${failCount} échecs.`;
    btn.disabled  = false;
    btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i><span>Déclencher l'envoi réel</span>`;
});
</script>
