<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LevelUp Ecosystem">

  <!-- ============================================================
       DEFS : Dégradés et Filtres
       ============================================================ -->
  <defs>
    <!-- Fond noir profond -->
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050508" />
      <stop offset="100%" stop-color="#020204" />
    </linearGradient>

    <!-- Dégradé étoile centrale -->
    <linearGradient id="grad-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Couleurs icônes -->
    <linearGradient id="grad-movie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="grad-music" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Effet de lueur (Glow) très doux -->
    <filter id="fx-glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================================
       FOND
       ============================================================ -->
  <rect width="1200" height="630" fill="url(#grad-bg)" />

  <!-- ============================================================
       ÉTOILE CENTRALE HAUTE (Vraie étoile 5 branches)
       ============================================================ -->
  <g transform="translate(600, 130) scale(2.2)">
    <path 
      d="M 0 -25 L 5.6 -7.7 L 23.8 -7.7 L 9.1 3 L 14.7 20.2 L 0 9.6 L -14.7 20.2 L -9.1 3 L -23.8 -7.7 L -5.6 -7.7 Z"
      fill="url(#grad-star)"
      filter="url(#fx-glow-soft)"
    />
  </g>

  <!-- ============================================================
       TEXTE PRINCIPAL
       ============================================================ -->
  <!-- Titre -->
  <text
    x="600" y="270"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="110"
    font-weight="900"
    letter-spacing="-1"
    text-anchor="middle"
  >
    <tspan fill="#ffffff">Level</tspan><tspan fill="url(#grad-star)">Up</tspan>
  </text>

  <!-- Sous-titre -->
  <text
    x="600" y="325"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="5"
    text-anchor="middle"
    fill="#9ca3af"
  >
    <tspan fill="#ffffff">ONE ACCOUNT</tspan>  •  EVERY APP  •  100% FREE
  </text>

  <!-- ============================================================
       ICÔNES APPS (Sans fond/carré, design épuré)
       y aligné à 480 pour les textes, 420 pour les icônes
       ============================================================ -->

  <!-- === LevelMovie (Gauche - x: 400) === -->
  <g transform="translate(365, 390)">
    <!-- Icône L + Play -->
    <path 
      d="M10 10 L10 50 C10 55.5228 14.4772 60 20 60 L60 60" 
      stroke="url(#grad-movie)" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />
    <polygon 
      points="25,20 45,35 25,50" 
      fill="url(#grad-movie)" 
    />
  </g>
  <text x="400" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">LevelMovie</text>


  <!-- === LevelMusic (Centre - x: 600) === -->
  <g transform="translate(565, 390)">
    <!-- Icône Note de Musique (Sans barre milieu) -->
    <path 
      d="M15 50 V15 C15 12 17 10 20 10 H55 C58 10 60 12 60 15 V40" 
      stroke="url(#grad-music)" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none"
    />
    <circle cx="15" cy="50" r="10" fill="url(#grad-music)" />
    <circle cx="60" cy="40" r="10" fill="url(#grad-music)" />
  </g>
  <text x="600" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">LevelMusic</text>


  <!-- === Level IA (Droite - x: 800) === -->
  <g transform="translate(765, 390)">
    <!-- Icône Étoile IA (Sparkle) -->
    <path 
      d="M35 5 C35 22.5 22.5 35 5 35 C22.5 35 35 47.5 35 65 C35 47.5 47.5 35 65 35 C47.5 35 35 22.5 35 5 Z" 
      fill="url(#grad-star)" 
      filter="url(#fx-glow-soft)"
    />
  </g>
  <text x="800" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle">Level IA</text>


  <!-- ============================================================
       URL BAS DE PAGE
       ============================================================ -->
  <text
    x="600" y="580"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="700"
    letter-spacing="6"
    text-anchor="middle"
    fill="#4b5563"
  >LEVELUP-ECOSYSTEM.COM</text>

</svg>
