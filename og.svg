xml
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LevelUp Ecosystem — One Account, Every App, 100% Free">

  <!-- ============================================================
       LevelUp Ecosystem — Open Graph Image
       Size: 1200 × 630px (OG standard)
       Palette: #15092a › #060608 › #0a0a0f | Accent: #a855f7
       ============================================================ -->

  <defs>

    <!-- ── Fond dégradé diagonal premium ── -->
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#15092a" />
      <stop offset="48%"  stop-color="#060608" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>

    <!-- ── Halo violet central (fond ambiance) ── -->
    <radialGradient id="grad-halo" cx="50%" cy="38%" r="42%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="60%"  stop-color="#a855f7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"    />
    </radialGradient>

    <!-- ── Halo secondaire bas-gauche (profondeur) ── -->
    <radialGradient id="grad-halo2" cx="12%" cy="82%" r="30%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"    />
    </radialGradient>

    <!-- ── Dégradé étoile ── -->
    <linearGradient id="grad-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- ── Dégradé bouton ── -->
    <linearGradient id="grad-btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e1030" />
      <stop offset="100%" stop-color="#0d0a18" />
    </linearGradient>

    <!-- ── Glow doux — boutons ── -->
    <filter id="fx-glow-soft" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ── Glow étoile ── -->
    <filter id="fx-glow-star" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ── Drop shadow texte titre ── -->
    <filter id="fx-text-shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.45" />
    </filter>

  </defs>

  <!-- ============================================================
       COUCHE 1 — FOND
       ============================================================ -->

  <rect width="1200" height="630" fill="url(#grad-bg)" />
  <rect width="1200" height="630" fill="url(#grad-halo)" />
  <rect width="1200" height="630" fill="url(#grad-halo2)" />

  <!-- Grille subtile horizontale -->
  <g stroke="#ffffff" stroke-opacity="0.022" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
  </g>
  
  <!-- Grille subtile verticale -->
  <g stroke="#ffffff" stroke-opacity="0.022" stroke-width="1">
    <line x1="200"  y1="0" x2="200"  y2="630" />
    <line x1="400"  y1="0" x2="400"  y2="630" />
    <line x1="600"  y1="0" x2="600"  y2="630" />
    <line x1="800"  y1="0" x2="800"  y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Bordures accent violet haut / bas -->
  <rect x="0" y="0"   width="1200" height="2" fill="#a855f7" opacity="0.5"  />
  <rect x="0" y="628" width="1200" height="2" fill="#a855f7" opacity="0.25" />

  <!-- ============================================================
       COUCHE 2 — ÉTOILE 5 BRANCHES (CORRIGÉE)
       Centrée : cx=600 cy=158
       Proportions géométriques parfaites (Golden Ratio)
       ============================================================ -->

  <polygon
    points="
      600.00,86.00
      616.16,135.75
      668.48,135.75
      626.15,166.50
      642.32,216.25
      600.00,185.50
      557.68,216.25
      573.85,166.50
      531.52,135.75
      583.84,135.75
    "
    fill="url(#grad-star)"
    filter="url(#fx-glow-star)"
    stroke="url(#grad-star)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- ============================================================
       COUCHE 3 — TYPOGRAPHIE CENTRALE
       ============================================================ -->

  <!-- Titre : LevelUp -->
  <text
    x="600" y="316"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="1"
    text-anchor="middle"
    fill="#ffffff"
    filter="url(#fx-text-shadow)"
  >Level<tspan fill="#a855f7">Up</tspan></text>

  <!-- Séparateur décoratif -->
  <line x1="480" y1="336" x2="548" y2="336" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="600" cy="336" r="3" fill="#a855f7" opacity="0.65" />
  <line x1="652" y1="336" x2="720" y2="336" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Sous-titre -->
  <text
    x="600" y="378"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="21"
    font-weight="500"
    letter-spacing="4"
    text-anchor="middle"
    fill="#8b8b9e"
  >ONE ACCOUNT  •  EVERY APP  •  100% FREE</text>

  <!-- ============================================================
       COUCHE 4 — BOUTONS APPS
       w=162 h=50 rx=25 | gap=16
       ============================================================ -->

  <!-- · LevelMovie · -->
  <g filter="url(#fx-glow-soft)">
    <rect x="252" y="436" width="162" height="50" rx="25"
      fill="url(#grad-btn)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.55" />
    <text x="333" y="467"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="16" font-weight="700" letter-spacing="0.3"
      text-anchor="middle" fill="#ffffff"
    >LevelMovie</text>
  </g>

  <!-- · LevelMusic · -->
  <g filter="url(#fx-glow-soft)">
    <rect x="430" y="436" width="162" height="50" rx="25"
      fill="url(#grad-btn)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.55" />
    <text x="511" y="467"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="16" font-weight="700" letter-spacing="0.3"
      text-anchor="middle" fill="#ffffff"
    >LevelMusic</text>
  </g>

  <!-- · Level IA · -->
  <g filter="url(#fx-glow-soft)">
    <rect x="608" y="436" width="162" height="50" rx="25"
      fill="url(#grad-btn)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.55" />
    <text x="689" y="467"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="16" font-weight="700" letter-spacing="0.3"
      text-anchor="middle" fill="#ffffff"
    >Level IA</text>
  </g>

  <!-- · LevelTools · -->
  <g filter="url(#fx-glow-soft)">
    <rect x="786" y="436" width="162" height="50" rx="25"
      fill="url(#grad-btn)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.55" />
    <text x="867" y="467"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="16" font-weight="700" letter-spacing="0.3"
      text-anchor="middle" fill="#ffffff"
    >LevelTools</text>
  </g>

  <!-- ============================================================
       COUCHE 5 — URL BAS DE PAGE
       ============================================================ -->

  <text
    x="600" y="568"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="4"
    text-anchor="middle"
    fill="#3a3a4e"
  >LEVELUP-ECOSYSTEM.COM</text>

</svg>
