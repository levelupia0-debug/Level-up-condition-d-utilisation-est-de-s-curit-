<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Connexion — LevelUp Ecosystem</title>
<link rel="icon" href="/icon-eco.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a855f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;
  --surf:rgba(255,255,255,.04);
  --bdr:rgba(255,255,255,.08);
  --bdr-hi:rgba(168,85,247,.35);
  --txt:#f4f4f5;
  --muted:rgba(255,255,255,.45);
  --purple:#a855f7;
  --purple-lo:rgba(168,85,247,.12);
  --green:#22c55e;
  --red:#ef4444;
  --sans:'Inter',sans-serif;
  --display:'Syne',sans-serif;
  --r12:12px;
  --r16:16px;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(168,85,247,.12) 0%,transparent 70%);pointer-events:none;z-index:0}
.login-wrap{width:100%;max-width:400px;position:relative;z-index:1}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:36px}
.brand-logo{display:flex;align-items:center;justify-content:center}
.brand-logo svg{width:46px;height:46px;filter:drop-shadow(0 4px 12px rgba(168,85,247,.3))}
.brand-name{font-family:var(--display);font-size:1.4rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 60%,rgba(168,85,247,.8));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-sub{font-size:.75rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.login-card{background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:24px;padding:32px 28px;backdrop-filter:blur(12px)}
.login-title{font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:-.025em;margin-bottom:6px;text-align:center}
.login-desc{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.6}
.login-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;border-radius:14px;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid;font-family:var(--sans);letter-spacing:.01em;text-decoration:none;margin-bottom:10px;position:relative;overflow:hidden}
.login-btn:last-child{margin-bottom:0}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-btn:active:not(:disabled){transform:scale(.98)}
.btn-google{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--txt)}
.btn-google:hover:not(:disabled){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}
.btn-discord{background:rgba(88,101,242,.1);border-color:rgba(88,101,242,.3);color:#7289da}
.btn-discord:hover:not(:disabled){background:rgba(88,101,242,.18);border-color:rgba(88,101,242,.55);color:#fff}
.btn-twitch{background:rgba(145,70,255,.1);border-color:rgba(145,70,255,.3);color:#bf94ff}
.btn-twitch:hover:not(:disabled){background:rgba(145,70,255,.18);border-color:rgba(145,70,255,.55);color:#fff}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0}
.divider-line{flex:1;height:1px;background:var(--bdr)}
.divider span{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.login-alert{padding:12px 16px;border-radius:12px;font-size:.8rem;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px;line-height:1.4}
.alert-error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
.alert-success{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#86efac}
.alert-info{background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.2);color:#d8b4fe}
.login-btn .btn-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.login-footer{text-align:center;margin-top:24px;font-size:.78rem;color:var(--muted)}
.login-footer a{color:var(--purple);text-decoration:none;font-weight:600;transition:color .15s}
.login-footer a:hover{color:#c084fc}
#pageLoader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
#pageLoader.out{opacity:0;pointer-events:none}
.loader-dot{width:8px;height:8px;border-radius:50%;background:var(--purple);animation:ldot .8s ease-in-out infinite;margin:0 4px}
.loader-dot:nth-child(2){animation-delay:.16s}
.loader-dot:nth-child(3){animation-delay:.32s}
@keyframes ldot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.prov-badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;padding:3px 10px;border-radius:100px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#4ade80;font-weight:700;margin-bottom:16px}
</style>
</head>
<body>

<div id="pageLoader">
  <div style="display:flex"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
</div>

<div class="login-wrap">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 576 512" fill="#a855f7" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 4px 12px rgba(168,85,247,.3))">
        <path d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"/>
      </svg>
    </div>
    <span class="brand-name">LevelUp</span>
    <span class="brand-sub">Ecosystem</span>
  </div>

  <div class="login-card">
    <h1 class="login-title">Connexion</h1>
    <p class="login-desc" id="loginDesc">Accédez à votre tableau de bord LevelUp Ecosystem.</p>

    <div id="loginAlert" style="display:none" class="login-alert"></div>

    <div id="provBadge" class="prov-badge" style="display:none">
      <div class="btn-spinner" style="width:10px;height:10px"></div>
      <span id="provBadgeTxt">Connexion en cours…</span>
    </div>

    <button class="login-btn btn-google" id="btnGoogle" onclick="signInGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span id="btnGoogleTxt">Continuer avec Google</span>
    </button>

    <div class="divider"><div class="divider-line"></div><span>ou</span><div class="divider-line"></div></div>

    <button class="login-btn btn-discord" id="btnDiscord" onclick="signInDiscord()">
      <svg width="20" height="20" viewBox="0 0 71 55" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M60.1 4.9A58.5 58.5 0 0 0 45.4.6a.2.2 0 0 0-.2.1 40.7 40.7 0 0 0-1.8 3.7 54 54 0 0 0-16.2 0A37.7 37.7 0 0 0 25.3.7a.2.2 0 0 0-.2-.1A58.4 58.4 0 0 0 10.4 4.9a.2.2 0 0 0-.1.1C1.5 18.1-.9 31 .3 43.7a.2.2 0 0 0 .1.2 58.8 58.8 0 0 0 17.7 8.9.2.2 0 0 0 .2-.1 42 42 0 0 0 3.6-5.9.2.2 0 0 0-.1-.3 38.7 38.7 0 0 1-5.5-2.6.2.2 0 0 1 0-.4l1.1-.9a.2.2 0 0 1 .2 0c11.5 5.3 24 5.3 35.4 0a.2.2 0 0 1 .2 0l1.1.9a.2.2 0 0 1 0 .4 36.2 36.2 0 0 1-5.5 2.6.2.2 0 0 0-.1.3 47.1 47.1 0 0 0 3.6 5.9.2.2 0 0 0 .2.1 58.6 58.6 0 0 0 17.7-8.9.2.2 0 0 0 .1-.2c1.5-15.3-2.5-28.1-10.5-39.7a.2.2 0 0 0-.1-.1zM23.7 36c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.2 6.4 7.2 0 3.9-2.8 7.2-6.4 7.2zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.2 6.4 7.2 0 3.9-2.8 7.2-6.4 7.2z"/>
      </svg>
      <span>Continuer avec Discord</span>
    </button>

    <button class="login-btn btn-twitch" id="btnTwitch" onclick="signInTwitch()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
      </svg>
      <span>Continuer avec Twitch</span>
    </button>
  </div>

  <div class="login-footer">
    <a href="/"><i class="fa-solid fa-arrow-left" style="font-size:.65rem;margin-right:4px"></i>Retour à l'accueil</a>
    &nbsp;·&nbsp;
    <a href="https://levelup-ecosystem.com/terms" target="_blank">Conditions</a>
    &nbsp;·&nbsp;
    <a href="mailto:support@levelup-ecosystem.com">Support</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, browserLocalPersistence, setPersistence } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';

const cfg = {
  apiKey: 'AIzaSyA3JgvNu5p-43037jvm4WRDaJHI9ES7uGM',
  authDomain: 'levelup-ecosystem.com',
  projectId: 'levelup-ia',
  storageBucket: 'levelup-ia.firebasestorage.app',
  messagingSenderId: '229420004282',
  appId: '1:229420004282:web:6735f059a947f0936ae383'
};

const app = initializeApp(cfg);
const auth = getAuth(app);
const gProv = new GoogleAuthProvider();
gProv.setCustomParameters({ prompt: 'select_account' });

try { await setPersistence(auth, browserLocalPersistence); } catch(_) {}

// Gérer le retour de redirection (mobile/PWA)
try {
  const result = await getRedirectResult(auth);
  // Si redirection réussie, onAuthStateChanged va déclencher le redirect vers /dashboard
} catch(e) {
  if (e.code !== 'auth/popup-closed-by-user') {
    showAlert('Erreur de connexion. Réessayez.', 'error');
  }
}

const loader = document.getElementById('pageLoader');
const alertEl = document.getElementById('loginAlert');

function showAlert(msg, type = 'error') {
  alertEl.className = 'login-alert alert-' + type;
  alertEl.innerHTML = `<i class="fa-solid fa-${type === 'error' ? 'circle-xmark' : type === 'success' ? 'circle-check' : 'circle-info'}"></i><span>${msg}</span>`;
  alertEl.style.display = 'flex';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (btnId === 'btnGoogle') {
    document.getElementById('btnGoogleTxt').textContent = loading ? 'Connexion en cours…' : 'Continuer avec Google';
  }
}

// Si déjà connecté (session Firebase valide), rediriger vers le dashboard
// UNE SEULE écoute onAuthStateChanged — vérifie !isAnonymous
onAuthStateChanged(auth, (user) => {
  if (user && !user.isAnonymous) {
    // Utilisateur réel déjà connecté → dashboard
    window.location.replace('/dashboard');
    return;
  }
  // Pas de session → afficher la page de login
  loader.classList.add('out');
});

// Connexion Google
window.signInGoogle = async function() {
  setLoading('btnGoogle', true);
  alertEl.style.display = 'none';
  try {
    const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isMobile || isPWA) {
      await signInWithRedirect(auth, gProv);
      return;
    }
    await signInWithPopup(auth, gProv);
    // onAuthStateChanged va rediriger vers /dashboard
  } catch (err) {
    setLoading('btnGoogle', false);
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    showAlert('Connexion Google échouée. Vérifiez votre connexion et réessayez.', 'error');
  }
};

// Discord sign-in
window.signInDiscord = function() {
  const btn = document.getElementById('btnDiscord');
  btn.disabled = true;
  btn.innerHTML = '<div class="btn-spinner"></div><span>Redirection vers Discord…</span>';
  window.location.href = '/api/auth/discord';
};

// Twitch sign-in
window.signInTwitch = function() {
  const btn = document.getElementById('btnTwitch');
  btn.disabled = true;
  btn.innerHTML = '<div class="btn-spinner"></div><span>Redirection vers Twitch…</span>';
  window.location.href = '/api/auth/twitch';
};
</script>
</body>
</html>
