<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LevelDay - Weather Pro</title>

    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Import Maps : Permet au navigateur de comprendre les imports React et Firebase -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"
        }
    }
    </script>

    <!-- Babel : Traduit le JSX en Javascript lisible par le navigateur -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap');

        body { margin: 0; padding: 0; background-color: #020610; font-family: 'DM Sans', sans-serif; }
        *{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none}
        ::-webkit-scrollbar{display:none;width:0;height:0}
        input,button{font-family:inherit}
        input::placeholder{color:rgba(255,255,255,0.28)}
        input:focus{outline:none}
        button:focus{outline:none}

        /* Animations */
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes rainFall{0%{transform:rotate(12deg) translateY(-4%);opacity:0}8%{opacity:1}92%{opacity:.5}100%{transform:rotate(12deg) translateY(105vh);opacity:0}}
        @keyframes snowFall{0%{transform:translateY(-4%) translateX(0);opacity:0}10%{opacity:.9}90%{opacity:.6}100%{transform:translateY(105vh) translateX(30px);opacity:0}}
        @keyframes twinkle{0%,100%{opacity:.04;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
        @keyframes lightning{0%,93%,100%{opacity:0}94%,97%{opacity:1}95%,96%{opacity:.4}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

        /* Utilities */
        .fu{animation:fadeUp .5s ease both}
        .fu1{animation:fadeUp .5s .08s ease both}
        .fu2{animation:fadeUp .5s .16s ease both}
        .fu3{animation:fadeUp .5s .22s ease both}
        .fu4{animation:fadeUp .5s .28s ease both}
        .fu5{animation:fadeUp .5s .34s ease both}
        .fu6{animation:fadeUp .5s .40s ease both}
        .fu7{animation:fadeUp .5s .46s ease both}
        .g{background:rgba(255,255,255,0.05);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.08)}
        .hov{transition:background .18s,transform .18s,border-color .18s;cursor:pointer}
        .hov:hover{background:rgba(255,255,255,0.09)!important;transform:translateY(-2px)}
        .hov-txt{transition:opacity .2s;opacity:.5;text-decoration:none;color:white}
        .hov-txt:hover{opacity:1}
        .icon-img{animation:float 4s ease-in-out infinite}
        .spin{animation:spin .8s linear infinite}
        .blink{animation:pulse 1.5s ease infinite}

        /* RESPONSIVE DESIGN CLASSES */
        .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .forecast-detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .bottom-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .hero-temps { display: inline-flex; gap: 18px; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 40px; padding: 7px 22px; font-size: 13px; }
        .sun-arc-row { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .aqi-main-score { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .forecast-detail-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .bottom-panels { grid-template-columns: 1fr; gap: 14px; }
            .hero-temps { flex-wrap: wrap; justify-content: center; padding: 10px 20px; gap: 12px; border-radius: 20px; }
        }

        @media (max-width: 500px) {
            .header-container { flex-direction: column; align-items: stretch; gap: 16px; margin-bottom: 20px; }
            .header-actions { justify-content: space-between; width: 100%; }
            .hide-mobile { display: none; }
            .search-btn { padding: 8px 12px !important; }
            .hero-temps { gap: 10px; padding: 10px 16px; }
            .sun-arc-row { flex-direction: column; gap: 20px; }
            .sun-arc-row > div:nth-child(2) { order: -1; }
            .sun-arc-row .text-right { text-align: left !important; }
            .aqi-main-score { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>
<body class="bg-[#020610] text-white overflow-x-hidden">
    <!-- C'est ici que l'application React va s'injecter -->
    <div id="root"></div>

    <!-- Script de l'Application -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously } from 'firebase/auth';

        const firebaseConfig = {
            apiKey: "AIzaSyA3JgvNu5p-43037jvm4WRDaJHI9ES7uGM",
            authDomain: "levelup-ecosystem.com",
            databaseURL: "https://levelup-ia-default-rtdb.firebaseio.com",
            projectId: "levelup-ia",
            storageBucket: "levelup-ia.firebasestorage.app",
            messagingSenderId: "229420004282",
            appId: "1:229420004282:web:6735f059a947f0936ae383",
            measurementId: "G-MSRDY2574K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        const MAX_REQUESTS = 5; 

        const AQI_MAP = {
            1:{l:"Excellent",c:"#34d399",bg:"rgba(52,211,153,0.12)"},
            2:{l:"Good",c:"#a3e635",bg:"rgba(163,230,53,0.12)"},
            3:{l:"Moderate",c:"#fbbf24",bg:"rgba(251,191,36,0.12)"},
            4:{l:"Poor",c:"#fb923c",bg:"rgba(251,146,60,0.12)"},
            5:{l:"Very Poor",c:"#f87171",bg:"rgba(248,113,113,0.12)"},
            6:{l:"Hazardous",c:"#e879f9",bg:"rgba(232,121,249,0.12)"},
        };

        const getBg = (code, isDay) => {
            if (!isDay) return { a:"#020408",b:"#050c1c",c:"#0b1635", type:"night" };
            if (code===1000) return { a:"#051535",b:"#0a2872",c:"#1040b8", type:"sunny" };
            if (code<=1009) return { a:"#090f1c",b:"#111e35",c:"#1c2f52", type:"cloudy" };
            if (code<=1030) return { a:"#0b1018",b:"#14202e",c:"#1e3040", type:"fog" };
            if (code===1087||code>=1273) return { a:"#030407",b:"#060810",c:"#0c1020", type:"storm" };
            if (code>=1135&&code<=1147) return { a:"#0c1118",b:"#141d2a",c:"#1e2c3e", type:"fog" };
            if ((code>=1150&&code<=1201)||(code>=1240&&code<=1264)) return { a:"#050c18",b:"#0c1830",c:"#142244", type:"rain" };
            if (code>=1204&&code<=1237) return { a:"#08101e",b:"#101e38",c:"#182e52", type:"snow" };
            return { a:"#050c18",b:"#0c1830",c:"#142244", type:"rain" };
        };

        const Ico = ({ n, s=16, c="currentColor", op=1 }) => {
            const p = { width:s,height:s,viewBox:"0 0 24 24",fill:"none",stroke:c,strokeWidth:"1.8",strokeLinecap:"round",strokeLinejoin:"round",style:{opacity:op,flexShrink:0} };
            const f = { ...p, fill:c, stroke:"none" };
            const icons = {
                search: <svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>,
                loc: <svg {...f}><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>,
                wind: <svg {...p}><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>,
                drop: <svg {...p}><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>,
                eye: <svg {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
                gauge: <svg {...p}><path d="M12 2v4M4.93 4.93l2.83 2.83M2 12h4M4.93 19.07l2.83-2.83M19.07 4.93l-2.83 2.83M22 12h-4"/><circle cx="12" cy="12" r="3"/></svg>,
                thermo: <svg {...p}><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>,
                uv: <svg {...p}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
                sunrise: <svg {...p}><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8 6 12 2 16 6"/></svg>,
                sunset: <svg {...p}><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="16 5 12 9 8 5"/></svg>,
                moon: <svg {...f}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
                cloud: <svg {...p}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>,
                alert: <svg {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
                dew: <svg {...p}><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>,
                snow: <svg {...p}><line x1="12" y1="2" x2="12" y2="22"/><path d="m20 10-8-8-8 8"/><path d="m20 14-8 8-8-8"/><line x1="2" y1="12" x2="22" y2="12"/></svg>,
                close: <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                reload: <svg {...p}><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-8.36"/></svg>,
                precip: <svg {...p}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>,
                bell: <svg {...p}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
                lock: <svg {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
                user: <svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
                logout: <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            };
            return icons[n] || null;
        };

        const MoonPhase = ({ phase, illumination, size = 32 }) => {
            const r = size / 2 - 2;
            const cx = size / 2, cy = size / 2;
            const isNew = phase === "New Moon";
            const isFull = phase === "Full Moon";
            const isFirstQ = phase === "First Quarter";
            const isLastQ = phase === "Last Quarter";
            const isWaxing = phase?.includes("Waxing");

            if (isNew) return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" strokeWidth="1"/></svg>;
            if (isFull) return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={cx} cy={cy} r={r} fill="rgba(255,235,170,0.9)"/><circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,220,100,0.6)" strokeWidth="1"/></svg>;
            if (isFirstQ) return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/><path d={`M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} Z`} fill="rgba(255,235,170,0.9)"/></svg>;
            if (isLastQ) return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/><path d={`M ${cx} ${cy-r} A ${r} ${r} 0 0 0 ${cx} ${cy+r} Z`} fill="rgba(255,235,170,0.9)"/></svg>;
            const ellRx = Math.abs(r * (1 - (illumination||50)/50));
            if (isWaxing) return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/><clipPath id="mc1"><circle cx={cx} cy={cy} r={r}/></clipPath><g clipPath="url(#mc1)"><ellipse cx={cx} cy={cy} rx={r} ry={r} fill="rgba(255,235,170,0.9)"/><ellipse cx={cx} cy={cy} rx={ellRx||4} ry={r} fill="rgba(255,255,255,0.04)"/></g></svg>;
            return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}><circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/><clipPath id="mc2"><circle cx={cx} cy={cy} r={r}/></clipPath><g clipPath="url(#mc2)"><ellipse cx={cx} cy={cy} rx={r} ry={r} fill="rgba(255,235,170,0.9)"/><ellipse cx={cx} cy={cy} rx={ellRx||4} ry={r} fill="rgba(5,15,40,0.95)"/></g></svg>;
        };

        const Particles = ({ type }) => {
            const count = type==="rain"||type==="storm" ? 55 : type==="snow" ? 40 : type==="night" ? 90 : 0;
            if (!count) return null;
            return (
            <div style={{position:"fixed",inset:0,pointerEvents:"none",overflow:"hidden",zIndex:0}}>
            {Array.from({length:count}).map((_,i)=>{
            const x = Math.random()*100, delay = Math.random()*4, dur = 0.4+Math.random()*0.8;
            const size = type==="snow" ? 2+Math.random()*5 : type==="night" ? 1+Math.random()*2 : null;
            if (type==="rain"||type==="storm") return <div key={i} style={{position:"absolute",left:`${x}%`,top:"-4%",width:1.5,height:14+Math.random()*18,background:"rgba(147,197,253,0.22)",borderRadius:1,animation:`rainFall ${dur}s linear infinite`,animationDelay:`${delay}s`}}/>;
            if (type==="snow") return <div key={i} style={{position:"absolute",left:`${x}%`,top:"-4%",width:size,height:size,borderRadius:"50%",background:"rgba(255,255,255,0.7)",animation:`snowFall ${3+Math.random()*5}s ease-in infinite`,animationDelay:`${delay}s`}}/>;
            return <div key={i} style={{position:"absolute",left:`${x}%`,top:`${Math.random()*100}%`,width:size,height:size,borderRadius:"50%",background:"white",animation:`twinkle ${2+Math.random()*4}s ease-in-out infinite`,animationDelay:`${delay}s`}}/>;
            })}
            {type==="storm" && <div style={{position:"fixed",inset:0,background:"rgba(120,140,255,0.04)",animation:"lightning 10s infinite",animationDelay:"2s"}}/>}
            </div>
            );
        };

        const Bar = ({ val, max, color="#D4A043", h=4 }) => (
            <div style={{height:h,borderRadius:h,background:"rgba(255,255,255,0.07)",overflow:"hidden"}}>
            <div style={{height:"100%",width:`${Math.min(100,(val/max)*100)}%`,background:color,borderRadius:h,transition:"width 1s ease"}}/>
            </div>
        );

        const checkRateLimit = () => {
            const stored = localStorage.getItem('levelday_usage');
            let usage = stored ? JSON.parse(stored) : null;
            const now = Date.now();
            const resetDate = new Date();
            resetDate.setHours(24, 0, 0, 0); 

            if (!usage || now > usage.resetAt) {
                usage = { count: 0, resetAt: resetDate.getTime() };
            }

            if (usage.count >= MAX_REQUESTS) {
                const resetTime = new Date(usage.resetAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                return { allowed: false, message: `Daily limit reached. We value our quality of service. Please come back tomorrow at ${resetTime} to refresh your daily quota.`, usage };
            }

            return { allowed: true, usage };
        };

        const incrementUsage = (usage) => {
            usage.count += 1;
            localStorage.setItem('levelday_usage', JSON.stringify(usage));
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [accessKey, setAccessKey] = useState("");
            const [userName, setUserName] = useState("Utilisateur");
            const [showProfile, setShowProfile] = useState(false);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [authError, setAuthError] = useState("");
            const [isTrial, setIsTrial] = useState(false);

            const [q, setQ] = useState("");
            const [sugg, setSugg] = useState([]);
            const [showSearch, setShowSearch] = useState(false);
            const [showNotifs, setShowNotifs] = useState(false);
            const [data, setData] = useState(null);
            const [astro, setAstro] = useState(null);
            const [loading, setLoading] = useState(true);
            const [err, setErr] = useState(null);
            const [unit, setUnit] = useState("C");
            const [activeDay, setActiveDay] = useState(0);
            const [lastCity, setLastCity] = useState("Paris");
            const [rateLimitErr, setRateLimitErr] = useState(null);
            const [showLocPrompt, setShowLocPrompt] = useState(false);
            const [showTopLocBanner, setShowTopLocBanner] = useState(false);
            const inputRef = useRef(null);

            useEffect(() => {
                signInAnonymously(auth).catch(e => console.error("Auth Error", e));
                
                // --- CAPTURE DU LIEN D'INVITATION ET SSO (DEPUIS L'URL) ---
                if (typeof window !== 'undefined') {
                    const urlParams = new URLSearchParams(window.location.search);
                    const ssoKey = urlParams.get('lvl_key');
                    
                    if (ssoKey) {
                        const ssoName = urlParams.get('lvl_name') || "Utilisateur";
                        
                        // Sauvegarde persistante
                        localStorage.setItem('levelday_access_key', ssoKey);
                        localStorage.setItem('levelday_user_name', ssoName);
                        
                        // Nettoyage de l'URL pour sécuriser la clé et garder l'interface propre
                        window.history.replaceState({}, document.title, window.location.pathname);
                        
                        // Mise à jour de l'état
                        setAccessKey(ssoKey);
                        setUserName(ssoName);
                        setIsAuthenticated(true);
                    } else {
                        // Récupération de la session existante depuis le Local Storage
                        const savedKey = localStorage.getItem('levelday_access_key');
                        const savedName = localStorage.getItem('levelday_user_name');
                        if (savedKey) {
                            setAccessKey(savedKey);
                            setUserName(savedName || "Utilisateur");
                            setIsAuthenticated(true);
                            if (savedKey === "TRIAL-MODE") setIsTrial(true);
                        }
                    }
                }
            }, []);

            const handleLogin = async () => {
                const cleanKey = accessKey.trim();
                
                // Validation du format côté client avant l'appel
                if (!/^LVL-[A-Z0-9]{5}-[A-Z0-9]{5}$/i.test(cleanKey)) {
                    setAuthError("Format de clé invalide. Attendu: LVL-XXXXX-XXXXX");
                    return;
                }
                
                setAuthError("");
                setIsLoggingIn(true);
                
                // --- MODE TEST POUR L'APERÇU (Silencieux) ---
                if (cleanKey === "LVL-00000-00000") {
                    setTimeout(() => {
                        const name = "Testeur Beta";

                            <div style={{width:12,height:12,border:"1.5px solid rgba(255,255,255,.2)",borderTop:"1.5px solid #D4A043",borderRadius:"50%"}} className="spin"/>
                            Mise à jour...
                        </div>
                        )}

                        {data && cur && (<>
                        <div className="fu1" style={{textAlign:"center",padding:"30px 0 26px"}}>
                            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginBottom:10}}>
                                <Ico n="loc" s={13} c="rgba(212,160,67,.65)"/>
                                <span style={{fontSize:12,fontWeight:700,letterSpacing:".16em",
                                opacity:.65,textTransform:"uppercase"}}>{loc.name}, {loc.country}</span>
                            </div>
                            <div style={{display:"flex",justifyContent:"center",marginBottom:6}} className="icon-img">
                                <img src={`https:${cur.condition.icon.replace("64x64","128x128")}`}
                                alt={cur.condition.text} style={{width:100,height:100,filter:"drop-shadow(0 0 24px rgba(255,255,255,.18))"}}
                                onError={e=>e.target.style.display="none"}/>
                            </div>
                            <div style={{fontWeight:800,lineHeight:.85,
                            fontSize:"clamp(90px,15vw,128px)",letterSpacing:"-.04em",marginBottom:8}}>
                                {T(cur.temp_c)}<span style={{fontSize:".35em",opacity:.45,verticalAlign:"super",fontWeight:700}}>{TU}</span>
                            </div>
                            <p style={{fontSize:17,fontWeight:300,fontStyle:"italic",opacity:.6,marginBottom:8,letterSpacing:".02em"}}>
                                {cur.condition.text}
                            </p>
                            <p style={{fontSize:11,opacity:.28,letterSpacing:".12em",textTransform:"uppercase",marginBottom:18}}>
                                {dateStr} &nbsp;·&nbsp; {loc.localtime?.split(" ")[1]}
                            </p>
                            <div className="hero-temps">
                                <span style={{opacity:.5}}>
                                    <span style={{fontSize:9,fontWeight:700,letterSpacing:".08em",opacity:.6,marginRight:4}}>MAX</span>
                                    {T(fcast[0]?.day.maxtemp_c)}{TS}
                                </span>
                                <span className="hide-mobile" style={{opacity:.18}}>|</span>
                                <span style={{opacity:.5}}>
                                    <span style={{fontSize:9,fontWeight:700,letterSpacing:".08em",opacity:.6,marginRight:4}}>MIN</span>
                                    {T(fcast[0]?.day.mintemp_c)}{TS}
                                </span>
                                <span className="hide-mobile" style={{opacity:.18}}>|</span>
                                <span style={{opacity:.5,display:"flex",alignItems:"center",gap:5}}>
                                    <Ico n="thermo" s={12} c="rgba(255,255,255,.5)"/>
                                    Ressenti {T(cur.feelslike_c)}{TS}
                                </span>
                            </div>
                        </div>

                        <div className="fu2 stats-grid" style={{marginBottom:10}}>
                            {[
                            {l:"Humidité", v:`${cur.humidity}%`, sub:null, i:"drop"},
                            {l:"Vent", v:`${Math.round(cur.wind_kph)} km/h`, sub:cur.wind_dir, i:"wind"},
                            {l:"Visibilité",v:`${cur.vis_km} km`, sub:null, i:"eye"},
                            {l:"Index UV", v:cur.uv, sub:cur.uv<=2?"Faible":cur.uv<=5?"Modéré":cur.uv<=7?"Élevé":"Très Élevé", i:"uv"},
                            ].map((s,i)=>(
                            <div key={i} className="g hov" style={{borderRadius:14,padding:"14px 12px",textAlign:"center"}}>
                                <div style={{display:"flex",justifyContent:"center",marginBottom:8,opacity:.3}}><Ico n={s.i} s={14}/></div>
                                <div style={{fontWeight:700,fontSize:"clamp(17px,3.2vw,22px)",letterSpacing:"-.02em",marginBottom:3}}>{s.v}</div>
                                {s.sub && <div style={{fontSize:10,opacity:.35,letterSpacing:".07em",textTransform:"uppercase",marginBottom:2}}>{s.sub}</div>}
                                <div style={{fontSize:10,opacity:.28,letterSpacing:".08em",textTransform:"uppercase"}}>{s.l}</div>
                            </div>
                            ))}
                        </div>

                        <div className="fu3 g" style={{borderRadius:18,padding:"18px 20px",marginBottom:18}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                                <span style={{fontSize:10,fontWeight:700,letterSpacing:".14em",opacity:.3,textTransform:"uppercase"}}>Prévision 24h</span>
                                <span style={{fontSize:10,opacity:.2}}>Défiler →</span>
                            </div>
                            <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>
                                {hourly24.map((h,i)=>{
                                const hr = new Date(h.time).getHours();
                                const isNow = i===0;
                                const rain = h.chance_of_rain > 0;
                                const snow = h.chance_of_snow > 0;
                                return (
                                <div key={i} style={{flexShrink:0,borderRadius:12,padding:"11px 11px",textAlign:"center",minWidth:64,
                                background:isNow?"rgba(212,160,67,.12)":"rgba(255,255,255,0.04)",
                                border:`1px solid ${isNow?"rgba(212,160,67,.28)":"rgba(255,255,255,0.06)"}`,
                                transition:"transform .2s"}}
                                onMouseEnter={e=>e.currentTarget.style.transform="translateY(-3px)"}
                                onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
                                    <div style={{fontSize:11,fontWeight:600,
                                    color:isNow?"#D4A043":"rgba(255,255,255,.4)",marginBottom:6}}>
                                    {isNow?"Maint.":`${hr}h`}
                                    </div>
                                    <img src={`https:${h.condition.icon}`} alt="" style={{width:34,height:34,marginBottom:5}}
                                    onError={e=>e.target.style.display="none"}/>
                                    <div style={{fontWeight:700,fontSize:14,marginBottom:3}}>{T(h.temp_c)}{TS}</div>
                                    {(rain||snow) && (
                                    <div style={{fontSize:10,color:snow?"#a5d8ff":"#93c5fd",opacity:.8,display:"flex",alignItems:"center",justifyContent:"center",gap:2}}>
                                        <Ico n={snow?"snow":"drop"} s={9} c={snow?"#a5d8ff":"#93c5fd"}/>
                                        {rain?h.chance_of_rain:h.chance_of_snow}%
                                    </div>
                                    )}
                                </div>
                                );
                                })}
                            </div>
                        </div>

                        <div className="fu4 g" style={{borderRadius:18,padding:"18px 20px",marginBottom:18}}>
                            <span style={{fontSize:10,fontWeight:700,letterSpacing:".14em",opacity:.3,textTransform:"uppercase",display:"block",marginBottom:14}}>
                                Prévision 3 Jours
                            </span>
                            <div style={{display:"flex",gap:10,marginBottom:14}}>
                                {fcast.map((day,i)=>{
                                const d = new Date(day.date);
                                const lbl = i===0?"Auj.":i===1?"Demain":DAYS[d.getDay()];
                                const active = activeDay===i;
                                const rain = day.day.daily_chance_of_rain;
                                const snow = day.day.daily_chance_of_snow;
                                return (
                                <div key={i} onClick={()=>setActiveDay(i)} className="hov"
                                style={{flex:1,borderRadius:14,padding:"16px 10px",textAlign:"center",
                                background:active?"rgba(212,160,67,.12)":"rgba(255,255,255,0.04)",
                                border:`1px solid ${active?"rgba(212,160,67,.28)":"rgba(255,255,255,0.06)"}`}}>
                                    <div style={{fontSize:11,fontWeight:700,letterSpacing:".07em",textTransform:"uppercase",
                                    color:active?"#D4A043":"rgba(255,255,255,.45)",marginBottom:8}}>{lbl}</div>
                                    <img src={`https:${day.day.condition.icon}`} alt="" style={{width:42,height:42,marginBottom:5}}
                                    onError={e=>e.target.style.display="none"}/>
                                    <div style={{fontWeight:700,fontSize:17,marginBottom:2}}>{T(day.day.maxtemp_c)}{TS}</div>
                                    <div style={{fontSize:12,opacity:.3}}>{T(day.day.mintemp_c)}{TS}</div>
                                </div>
                                );
                                })}
                            </div>
                        </div>

                        <div className="fu5 g" style={{borderRadius:18,padding:"24px",marginBottom:18,position:"relative",overflow:"hidden"}}>
                            <span style={{fontSize:11,fontWeight:800,letterSpacing:".15em",opacity:.4,textTransform:"uppercase",display:"block",marginBottom:20}}>
                                {isNight ? "Arc Nocturne" : "Arc Solaire"}
                            </span>
                            <div className="sun-arc-row">
                                <div style={{display:"flex",alignItems:"center",gap:10}}>
                                    <div style={{width:32,height:32,borderRadius:10,background:isNight?"rgba(129,140,248,0.1)":"rgba(253,184,19,0.1)",display:"flex",alignItems:"center",justifyContent:"center",border:`1px solid ${arcColorSec}30`}}>
                                    <Ico n={arcIconStart} s={16} c={arcColorSec}/>
                                    </div>
                                    <div>
                                    <div style={{fontWeight:800,fontSize:16,color:arcColorSec}}>{arcStart||"--"}</div>
                                    <div style={{fontSize:10,opacity:.4,textTransform:"uppercase",letterSpacing:".08em",marginTop:2}}>{arcStartLbl}</div>
                                    </div>
                                </div>
                                <div style={{textAlign:"center",padding:"8px 20px",background:"rgba(255,255,255,0.03)",borderRadius:12,border:"1px solid rgba(255,255,255,0.08)"}}>
                                    <div style={{fontWeight:800,fontSize:18,marginBottom:2}}>{phaseH}<span style={{fontSize:12,opacity:.5}}>h</span> {phaseM}<span style={{fontSize:12,opacity:.5}}>m</span></div>
                                    <div style={{fontSize:10,opacity:.3,textTransform:"uppercase",letterSpacing:".1em"}}>{isNight ? "Nuit" : "Jour"}</div>
                                </div>
                                <div style={{display:"flex",alignItems:"center",gap:10}}>
                                    <div className="text-right" style={{textAlign:"right"}}>
                                    <div style={{fontWeight:800,fontSize:16,color:arcColorMain}}>{arcEnd||"--"}</div>
                                    <div style={{fontSize:10,opacity:.4,textTransform:"uppercase",letterSpacing:".08em",marginTop:2}}>{arcEndLbl}</div>
                                    </div>
                                    <div style={{width:32,height:32,borderRadius:10,background:isNight?"rgba(56,189,248,0.1)":"rgba(255,124,92,0.1)",display:"flex",alignItems:"center",justifyContent:"center",border:`1px solid ${arcColorMain}30`}}>
                                    <Ico n={arcIconEnd} s={16} c={arcColorMain}/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        </>)}
                    </div>

                    {/* MODAL PROFIL */}
                    {showProfile && (
                    <div style={{position:"fixed",inset:0,zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(2,6,16,0.85)",backdropFilter:"blur(24px)",padding:20}}>
                        <div className="g" style={{maxWidth:480,width:"100%",borderRadius:24,padding:"30px",position:"relative",background:"linear-gradient(135deg, rgba(30,20,45,0.8) 0%, rgba(10,10,15,0.95) 100%)",boxShadow:"0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(168,85,247,0.2)"}}>
                            <button onClick={() => setShowProfile(false)} className="hov" style={{position:"absolute",top:20,right:20,width:36,height:36,borderRadius:"50%",border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",cursor:"pointer"}}>
                                <Ico n="close" s={16}/>
                            </button>

                            <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:30}}>
                                <div style={{width:80,height:80,borderRadius:"50%",background:"#151520",border:"2px solid rgba(192,132,252,0.5)",boxShadow:"0 0 20px rgba(192,132,252,0.3)",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16}}>
                                    <span style={{fontSize:32,fontWeight:900,color:"#c084fc"}}>{userName.charAt(0).toUpperCase()}</span>
                                </div>
                                <h2 style={{fontSize:24,fontWeight:800,color:"white",margin:0,textTransform:"uppercase",letterSpacing:".05em"}}>{userName}</h2>
                                <div style={{fontSize:11,opacity:0.5,fontFamily:"monospace",marginTop:6,background:"rgba(255,255,255,0.05)",padding:"4px 10px",borderRadius:6}}>
                                    ID: {accessKey.substring(0, 8)}...
                                </div>
                            </div>

                            <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:30}}>
                                <div style={{fontSize:10,fontWeight:800,color:"#c084fc",textTransform:"uppercase",letterSpacing:".15em",borderLeft:"2px solid #c084fc",paddingLeft:10,marginBottom:4}}>Préférences Générales</div>
                                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.05)",padding:"16px",borderRadius:16}}>
                                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                                        <Ico n={isTrial ? "user" : "lock"} s={16} c="#c084fc"/>
                                        <span style={{fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em"}}>{isTrial ? "Mode Essai" : "Compte Premium"}</span>
                                    </div>
                                    {isTrial ? (
                                        <button onClick={handleLogout} className="hov" style={{fontSize:10,fontWeight:800,color:"#020610",background:"#c084fc",border:"none",padding:"6px 12px",borderRadius:8,textTransform:"uppercase",letterSpacing:".1em",cursor:"pointer"}}>S'inscrire</button>
                                    ) : (
                                        <span style={{fontSize:10,fontWeight:800,color:"#34d399",background:"rgba(52,211,153,0.1)",padding:"6px 12px",borderRadius:8,textTransform:"uppercase",letterSpacing:".1em"}}>Actif</span>
                                    )}
                                </div>
                            </div>

                            <button onClick={handleLogout} className="hov" style={{width:"100%",background:"rgba(239,68,68,0.1)",color:"#f87171",border:"1px solid rgba(239,68,68,0.2)",padding:"16px",borderRadius:16,fontWeight:800,fontSize:12,textTransform:"uppercase",letterSpacing:".1em",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all .2s"}}>
                                <Ico n="logout" s={16}/> {isTrial ? "Quitter l'essai" : "Déconnexion de l'appareil"}
                            </button>
                            
                            <div style={{textAlign:"center",marginTop:20,fontSize:10,opacity:0.3,textTransform:"uppercase",letterSpacing:".1em"}}>
                                Écosystème LevelIA • v1.0
                            </div>
                        </div>
                    </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
