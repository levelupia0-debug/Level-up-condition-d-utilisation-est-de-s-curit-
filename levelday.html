<body>

    <!-- Script de l'Application -->
    <script type="text/babel" data-presets="my-react">
        // Utilisation des variables globales React (Plus besoin des imports qui faisaient planter l'app)
        const { useState, useEffect, useCallback, useRef } = React;

        // ==========================================
        // CONFIGURATION FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA3JgvNu5p-43037jvm4WRDaJHI9ES7uGM",
            authDomain: "levelup-ecosystem.com",
            databaseURL: "https://levelup-ia-default-rtdb.firebaseio.com",
            projectId: "levelup-ia",
            storageBucket: "levelup-ia.firebasestorage.app",
            messagingSenderId: "229420004282",
            appId: "1:229420004282:web:6735f059a947f0936ae383",
            measurementId: "G-MSRDY2574K"
        };

        // Initialisation avec l'API Compat de Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==========================================
        // CONSTANTES METEO
        // ==========================================
        const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

        const AQI_MAP = {
            1:{l:"Excellent",c:"#34d399",bg:"rgba(52,211,153,0.12)"},
            2:{l:"Good",c:"#a3e635",bg:"rgba(163,230,53,0.12)"},
            3:{l:"Moderate",c:"#fbbf24",bg:"rgba(251,191,36,0.12)"},
            4:{l:"Poor",c:"#fb923c",bg:"rgba(251,146,60,0.12)"},
            5:{l:"Very Poor",c:"#f87171",bg:"rgba(248,113,113,0.12)"},
            6:{l:"Hazardous",c:"#e879f9",bg:"rgba(232,121,249,0.12)"},
        };

        const getBg = (code, isDay) => {
            if (!isDay) return { a:"#020408",b:"#050c1c",c:"#0b1635", type:"night" };
            if (code===1000) return { a:"#051535",b:"#0a2872",c:"#1040b8", type:"sunny" };
            if (code<=1009) return { a:"#090f1c",b:"#111e35",c:"#1c2f52", type:"cloudy" };
            if (code<=1030) return { a:"#0b1018",b:"#14202e",c:"#1e3040", type:"fog" };
            if (code===1087||code>=1273) return { a:"#030407",b:"#060810",c:"#0c1020", type:"storm" };
            if (code>=1135&&code<=1147) return { a:"#0c1118",b:"#141d2a",c:"#1e2c3e", type:"fog" };
            if ((code>=1150&&code<=1201)||(code>=1240&&code<=1264)) return { a:"#050c18",b:"#0c1830",c:"#142244", type:"rain" };
            if (code>=1204&&code<=1237) return { a:"#08101e",b:"#101e38",c:"#182e52", type:"snow" };
            return { a:"#050c18",b:"#0c1830",c:"#142244", type:"rain" };
        };

        // ── SVG ICON LIBRARY ──────────────────────────────────────────────────────────
        const Ico = ({ n, s=16, c="currentColor", op=1 }) => {
            const p = { width:s,height:s,viewBox:"0 0 24 24",fill:"none",stroke:c,strokeWidth:"1.8",strokeLinecap:"round",strokeLinejoin:"round",style:{opacity:op,flexShrink:0} };
            const f = { ...p, fill:c, stroke:"none" };
            const icons = {
                search: <svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>,
                loc: <svg {...f}><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>,
                wind: <svg {...p}><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>,
                drop: <svg {...p}><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>,
                eye: <svg {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
                gauge: <svg {...p}><path d="M12 2v4M4.93 4.93l2.83 2.83M2 12h4M4.93 19.07l2.83-2.83M19.07 4.93l-2.83 2.83M22 12h-4"/><circle cx="12" cy="12" r="3"/></svg>,
                thermo: <svg {...p}><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>,
                uv: <svg {...p}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
                sunrise: <svg {...p}><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8 6 12 2 16 6"/></svg>,
                sunset: <svg {...p}><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="16 5 12 9 8 5"/></svg>,
                moon: <svg {...f}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
                cloud: <svg {...p}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>,
                alert: <svg {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
                dew: <svg {...p}><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>,
                snow: <svg {...p}><line x1="12" y1="2" x2="12" y2="22"/><path d="m20 10-8-8-8 8"/><path d="m20 14-8 8-8-8"/><line x1="2" y1="12" x2="22" y2="12"/></svg>,
                close: <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                reload: <svg {...p}><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-8.36"/></svg>,
                precip: <svg {...p}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>,
                bell: <svg {...p}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
                lock: <svg {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
                user: <svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
                logout: <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            };
            return icons[n] || null;
        };

        // ── MOON PHASE SVG ────────────────────────────────────────────────────────────
        const MoonPhase = ({ phase, illumination, size = 32 }) => {
            const r = size / 2 - 2;
            const cx = size / 2, cy = size / 2;
            const isNew = phase === "New Moon";
            const isFull = phase === "Full Moon";
            const isFirstQ = phase === "First Quarter";
            const isLastQ = phase === "Last Quarter";
            const isWaxing = phase?.includes("Waxing");

            if (isNew) return (
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" strokeWidth="1"/>
            </svg>
            );
            if (isFull) return (
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={cx} cy={cy} r={r} fill="rgba(255,235,170,0.9)"/>
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,220,100,0.6)" strokeWidth="1"/>
            </svg>
            );
            if (isFirstQ) return (
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/>
            <path d={`M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} Z`} fill="rgba(255,235,170,0.9)"/>
            </svg>
            );
            if (isLastQ) return (
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/>
            <path d={`M ${cx} ${cy-r} A ${r} ${r} 0 0 0 ${cx} ${cy+r} Z`} fill="rgba(255,235,170,0.9)"/>
            </svg>
            );
            const ellRx = Math.abs(r * (1 - (illumination||50)/50));
            if (isWaxing) return (
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/>
            <clipPath id="mc1"><circle cx={cx} cy={cy} r={r}/></clipPath>
            <g clipPath="url(#mc1)">
            <ellipse cx={cx} cy={cy} rx={r} ry={r} fill="rgba(255,235,170,0.9)"/>
            <ellipse cx={cx} cy={cy} rx={ellRx||4} ry={r} fill="rgba(255,255,255,0.04)"/>
            </g>
            </svg>
            );
            return (
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={cx} cy={cy} r={r} fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5"/>
            <clipPath id="mc2"><circle cx={cx} cy={cy} r={r}/></clipPath>
            <g clipPath="url(#mc2)">
            <ellipse cx={cx} cy={cy} rx={r} ry={r} fill="rgba(255,235,170,0.9)"/>
            <ellipse cx={cx} cy={cy} rx={ellRx||4} ry={r} fill="rgba(5,15,40,0.95)"/>
            </g>
            </svg>
            );
        };

        // ── BACKGROUND PARTICLES ─────────────────────────────────────────────────────
        const Particles = ({ type }) => {
            const count = type==="rain"||type==="storm" ? 55 : type==="snow" ? 40 : type==="night" ? 90 : 0;
            if (!count) return null;
            return (
            <div style={{position:"fixed",inset:0,pointerEvents:"none",overflow:"hidden",zIndex:0}}>
            {Array.from({length:count}).map((_,i)=>{
            const x = Math.random()*100, delay = Math.random()*4, dur = 0.4+Math.random()*0.8;
            const size = type==="snow" ? 2+Math.random()*5 : type==="night" ? 1+Math.random()*2 : null;
            if (type==="rain"||type==="storm") return (
            <div key={i} style={{position:"absolute",left:`${x}%`,top:"-4%",width:1.5,height:14+Math.random()*18,
            background:"rgba(147,197,253,0.22)",borderRadius:1,
            animation:`rainFall ${dur}s linear infinite`,animationDelay:`${delay}s`}}/>
            );
            if (type==="snow") return (
            <div key={i} style={{position:"absolute",left:`${x}%`,top:"-4%",width:size,height:size,borderRadius:"50%",
            background:"rgba(255,255,255,0.7)",
            animation:`snowFall ${3+Math.random()*5}s ease-in infinite`,animationDelay:`${delay}s`}}/>
            );
            return (
            <div key={i} style={{position:"absolute",left:`${x}%`,top:`${Math.random()*100}%`,width:size,height:size,
            borderRadius:"50%",background:"white",
            animation:`twinkle ${2+Math.random()*4}s ease-in-out infinite`,animationDelay:`${delay}s`}}/>
            );
            })}
            {type==="storm" && (
            <div style={{position:"fixed",inset:0,background:"rgba(120,140,255,0.04)",animation:"lightning 10s infinite",animationDelay:"2s"}}/>
            )}
            </div>
            );
        };

        // ── PROGRESS BAR ─────────────────────────────────────────────────────────────
        const Bar = ({ val, max, color="#D4A043", h=4 }) => (
            <div style={{height:h,borderRadius:h,background:"rgba(255,255,255,0.07)",overflow:"hidden"}}>
            <div style={{height:"100%",width:`${Math.min(100,(val/max)*100)}%`,background:color,borderRadius:h,transition:"width 1s ease"}}/>
            </div>
        );

        // ── STYLES RESPONSIVES ───────────────────────────────────────────────────────
        const CSS = `
            *{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none}
            ::-webkit-scrollbar{display:none;width:0;height:0}
            input,button{font-family:inherit}
            input::placeholder{color:rgba(255,255,255,0.28)}
            input:focus{outline:none}
            button:focus{outline:none}

            /* Animations */
            @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
            @keyframes rainFall{0%{transform:rotate(12deg) translateY(-4%);opacity:0}8%{opacity:1}92%{opacity:.5}100%{transform:rotate(12deg) translateY(105vh);opacity:0}}
            @keyframes snowFall{0%{transform:translateY(-4%) translateX(0);opacity:0}10%{opacity:.9}90%{opacity:.6}100%{transform:translateY(105vh) translateX(30px);opacity:0}}
            @keyframes twinkle{0%,100%{opacity:.04;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
            @keyframes lightning{0%,93%,100%{opacity:0}94%,97%{opacity:1}95%,96%{opacity:.4}}
            @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
            @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
            @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

            /* Utilities */
            .fu{animation:fadeUp .5s ease both}
            .fu1{animation:fadeUp .5s .08s ease both}
            .fu2{animation:fadeUp .5s .16s ease both}
            .fu3{animation:fadeUp .5s .22s ease both}
            .fu4{animation:fadeUp .5s .28s ease both}
            .fu5{animation:fadeUp .5s .34s ease both}
            .fu6{animation:fadeUp .5s .40s ease both}
            .fu7{animation:fadeUp .5s .46s ease both}
            .g{background:rgba(255,255,255,0.05);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.08)}
            .hov{transition:background .18s,transform .18s,border-color .18s;cursor:pointer}
            .hov:hover{background:rgba(255,255,255,0.09)!important;transform:translateY(-2px)}
            .hov-txt{transition:opacity .2s;opacity:.5;text-decoration:none;color:white}
            .hov-txt:hover{opacity:1}
            .icon-img{animation:float 4s ease-in-out infinite}
            .spin{animation:spin .8s linear infinite}
            .blink{animation:pulse 1.5s ease infinite}

            /* RESPONSIVE DESIGN CLASSES */
            .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
            .header-actions { display: flex; gap: 8px; align-items: center; }
            .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .forecast-detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .bottom-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
            .hero-temps { display: inline-flex; gap: 18px; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 40px; padding: 7px 22px; font-size: 13px; }
            .sun-arc-row { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
            .aqi-main-score { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

            /* Tablettes & Petits écrans */
            @media (max-width: 768px) {
                .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
                .forecast-detail-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
                .bottom-panels { grid-template-columns: 1fr; gap: 14px; }
                .hero-temps { flex-wrap: wrap; justify-content: center; padding: 10px 20px; gap: 12px; border-radius: 20px; }
            }

            /* Mobiles (Smartphones) */
            @media (max-width: 500px) {
                .header-container { flex-direction: column; align-items: stretch; gap: 16px; margin-bottom: 20px; }
                .header-actions { justify-content: space-between; width: 100%; }
                .hide-mobile { display: none; }
                .search-btn { padding: 8px 12px !important; }
                .hero-temps { gap: 10px; padding: 10px 16px; }
                .sun-arc-row { flex-direction: column; gap: 20px; }
                .sun-arc-row > div:nth-child(2) { order: -1; }
                .sun-arc-row .text-right { text-align: left !important; }
                .aqi-main-score { flex-direction: column; align-items: flex-start; gap: 4px; }
            }
        `;

        // ── RATE LIMIT LOGIC ──────────────────────────────────────────────────────────
        const checkRateLimit = (isPremium) => {
            const stored = localStorage.getItem('levelday_usage');
            let usage = stored ? JSON.parse(stored) : null;
            const now = Date.now();
            const resetDate = new Date();
            resetDate.setHours(24, 0, 0, 0); 

            if (!usage || now > usage.resetAt) {
                usage = { count: 0, resetAt: resetDate.getTime() };
            }

            // Limite intelligente : 50 pour les Premium, 5 pour les essais/invités
            const limit = isPremium ? 50 : 5;

            if (usage.count >= limit) {
                const resetTime = new Date(usage.resetAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                
                let message = "";
                if (isPremium) {
                    message = `Premium Fair Use: You have reached the optimal daily refresh limit (${limit} requests). To guarantee peak performance across the Level Up Ecosystem, your radar will reactivate tomorrow at ${resetTime}.`;
                } else {
                    message = `Daily limit reached. We value our quality of service. Please log in with a Premium Key or come back tomorrow at ${resetTime}.`;
                }
                
                return { allowed: false, message, usage };
            }

            return { allowed: true, usage };
        };

        const incrementUsage = (usage) => {
            usage.count += 1;
            localStorage.setItem('levelday_usage', JSON.stringify(usage));
        };

        // ── MAIN APP ──────────────────────────────────────────────────────────────────
        function LevelDay() {
            const [q, setQ] = useState("");
            const [sugg, setSugg] = useState([]);
            const [showSearch, setShowSearch] = useState(false);
            const [showNotifs, setShowNotifs] = useState(false);
            const [data, setData] = useState(null);
            const [astro, setAstro] = useState(null);
            const [loading, setLoading] = useState(true);
            const [err, setErr] = useState(null);
            const [unit, setUnit] = useState("C");
            const [activeDay, setActiveDay] = useState(0);
            const [lastCity, setLastCity] = useState("Paris");
            const [rateLimitErr, setRateLimitErr] = useState(null);
            const [showLocPrompt, setShowLocPrompt] = useState(false);
            const [showTopLocBanner, setShowTopLocBanner] = useState(false);
            const inputRef = useRef(null);

            // STATE DE COMPTE ET AUTHENTIFICATION
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [accessKey, setAccessKey] = useState("");
            const [userName, setUserName] = useState("Utilisateur");
            const [isAdmin, setIsAdmin] = useState(false);
            const [showProfile, setShowProfile] = useState(false);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [authError, setAuthError] = useState("");
            const [isTrial, setIsTrial] = useState(false);

            // ── SYSTÈME DE NOTIFICATIONS PUSH (POUR L'ÉCOSYSTÈME) ──
            const sendPushNotification = useCallback(async (title, body, typeId) => {
                if (!auth.currentUser) return;
                try {
                    const ssoUrl = `https://levelup-ecosystem.com/levelday?lvl_key=${encodeURIComponent(accessKey)}&lvl_name=${encodeURIComponent(userName)}`;
                    const iconUri = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'%3E%3Ccircle cx='42' cy='18' r='12' fill='%23FFC107' /%3E%3Cg fill='%234A8BFF'%3E%3Ccircle cx='19' cy='36' r='10' /%3E%3Ccircle cx='31' cy='30' r='16' /%3E%3Ccircle cx='45' cy='36' r='10' /%3E%3Crect x='19' y='30' width='26' height='16' /%3E%3C/g%3E%3C/svg%3E";
                    
                    // Utilisation de Firebase Compat pour envoyer vers Firestore
                    await db.collection('artifacts').doc('levelup-ecosystem')
                            .collection('push_inbox').doc(auth.currentUser.uid)
                            .collection('items').add({
                        title,
                        body,
                        icon: iconUri,
                        url: ssoUrl,
                        ts: new Date().toISOString(),
                        read: false,
                        fromApp: 'levelday'
                    });
                } catch (err) {
                    console.error("Erreur lors de l'envoi de la notification push à l'écosystème :", err);
                }
            }, [accessKey, userName]);

            // Fonction pour le bouton Admin
            const handleSendTestNotification = async () => {
                await sendPushNotification("Notification Test 🚀", "Ceci est un test envoyé par l'administrateur depuis LevelDay.", "admin_test");
                alert("Notification envoyée avec succès à votre boîte de réception Push !");
            };

            // Analyse automatique des alertes météo
            useEffect(() => {
                if (!data || !isAuthenticated || isTrial || !auth.currentUser) return;

                const processWeatherAlerts = async () => {
                    const today = new Date().toISOString().split('T')[0];

                    const notifyOnce = async (title, body, typeId) => {
                        const notifKey = `levelday_push_${typeId}_${today}`;
                        if (!localStorage.getItem(notifKey)) {
                            await sendPushNotification(title, body, typeId);
                            localStorage.setItem(notifKey, '1');
                        }
                    };

                    // ANALYSE 1 : Alerte météo sévère (Gouvernementale)
                    const alerts = data.alerts?.alert || [];
                    if (alerts.length > 0) {
                        const mainAlert = alerts[0];
                        await notifyOnce(
                            "Alerte Météo : " + mainAlert.event,
                            `Alerte active dans votre zone (${data.location.name}). Cliquez pour voir les détails de sécurité.`,
                            `alert_${mainAlert.event.replace(/\s+/g, '')}`
                        );
                    }

                    // ANALYSE 2 : Pluie prévue le lendemain
                    const tomorrow = data.forecast?.forecastday?.[1];
                    if (tomorrow && tomorrow.day.daily_chance_of_rain > 60) {
                        await notifyOnce(
                            "Pluie prévue demain 🌧️",
                            `${tomorrow.day.daily_chance_of_rain}% de chances de précipitations demain à ${data.location.name}. Pensez à votre parapluie !`,
                            "rain_tomorrow"
                        );
                    }
                    
                    // ANALYSE 3 : Danger UV Extrême aujourd'hui
                    const todayUV = data.current?.uv;
                    if (todayUV >= 8) {
                        await notifyOnce(
                            "Danger UV Élevé ☀️",
                            `L'indice UV est de ${todayUV} aujourd'hui. Protégez-vous si vous sortez !`,
                            "high_uv"
                        );
                    }
                };

                processWeatherAlerts();
            }, [data, isAuthenticated, isTrial, sendPushNotification]);
            // ────────────────────────────────────────────────────────

            useEffect(() => {
                auth.signInAnonymously().catch(e => console.error("Auth Error", e));
                
                // --- CAPTURE DU LIEN D'INVITATION ET SSO (DEPUIS L'URL) ---
                if (typeof window !== 'undefined') {
                    const urlParams = new URLSearchParams(window.location.search);
                    const ssoKey = urlParams.get('lvl_key');
                    
                    if (ssoKey) {
                        const ssoName = urlParams.get('lvl_name') || "Utilisateur";
                        const ssoAdmin = ssoName.toLowerCase().includes('admin');
                        
                        localStorage.setItem('levelday_access_key', ssoKey);
                        localStorage.setItem('levelday_user_name', ssoName);
                        localStorage.setItem('levelday_is_admin', ssoAdmin ? "true" : "false");
                        window.history.replaceState({}, document.title, window.location.pathname);
                        
                        setAccessKey(ssoKey);
                        setUserName(ssoName);
                        setIsAdmin(ssoAdmin);
                        setIsAuthenticated(true);
                    } else {
                        // Récupération de la session existante
                        const savedKey = localStorage.getItem('levelday_access_key');
                        const savedName = localStorage.getItem('levelday_user_name');
                        const savedAdmin = localStorage.getItem('levelday_is_admin') === "true";
                        
                        if (savedKey) {
                            setAccessKey(savedKey);
                            setUserName(savedName || "Utilisateur");
                            setIsAdmin(savedAdmin || (savedName && savedName.toLowerCase().includes('admin')));
                            setIsAuthenticated(true);
                            if (savedKey === "TRIAL-MODE") setIsTrial(true);
                        }
                    }
                }
            }, []);

            // GESTION CONNEXION
            const handleLogin = async () => {
                const cleanKey = accessKey.trim();
                
                if (!/^LVL-[A-Z0-9]{5}-[A-Z0-9]{5}$/i.test(cleanKey)) {
                    setAuthError("Format de clé invalide. Attendu: LVL-XXXXX-XXXXX");
                    return;
                }
                
                setAuthError("");
                setIsLoggingIn(true);
                
                if (cleanKey === "LVL-00000-00000") {
                    setTimeout(() => {
                        const name = "Admin Beta";
                        localStorage.setItem('levelday_access_key', cleanKey);
                        localStorage.setItem('levelday_user_name', name);
                        localStorage.setItem('levelday_is_admin', "true");
                        setUserName(name);
                        setIsAdmin(true);
                        setIsAuthenticated(true);
                        setIsLoggingIn(false);
                    }, 1000);
                    return;
                }
                
                try {
                    const backendUrl = 'https://levelup-ecosystem.com/api/validate-key'; 
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: cleanKey, appId: 'levelday' })
                    });
                    
                    const result = await response.json();
                    
                    if (result.valid) {
                        const name = result.name || "Utilisateur";
                        // On récupère le statut admin depuis TON backend (result.isAdmin ou result.role)
                        const adminFlag = result.isAdmin === true || result.role === 'admin' || name.toLowerCase().includes('admin');
                        
                        localStorage.setItem('levelday_access_key', cleanKey);
                        localStorage.setItem('levelday_user_name', name);
                        localStorage.setItem('levelday_is_admin', adminFlag ? "true" : "false");
                        
                        setUserName(name);
                        setIsAdmin(adminFlag);
                        setIsAuthenticated(true);
                    } else {
                        setAuthError(result.error || "Clé d'accès refusée par le serveur.");
                    }
                } catch (error) {
                    console.error("API Error", error);
                    setAuthError("Échec de l'authentification. Veuillez vérifier votre clé d'accès.");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleTrial = () => {
                setAuthError("");
                setIsLoggingIn(true);
                setTimeout(() => {
                    localStorage.setItem('levelday_access_key', "TRIAL-MODE");
                    localStorage.setItem('levelday_user_name', "Invité");
                    localStorage.setItem('levelday_is_admin', "false");
                    setAccessKey("TRIAL-MODE");
                    setUserName("Invité");
                    setIsAdmin(false);
                    setIsTrial(true);
                    setIsAuthenticated(true);
                    setIsLoggingIn(false);
                }, 1200);
            };

            const handleLogout = () => {
                localStorage.removeItem('levelday_access_key');
                localStorage.removeItem('levelday_user_name');
                localStorage.removeItem('levelday_is_admin');
                setIsAuthenticated(false);
                setAccessKey("");
                setShowProfile(false);
                setIsTrial(false);
                setIsAdmin(false);
            };

            // FONCTIONS METEO
            const T = c => unit==="C" ? Math.round(c) : Math.round(c*9/5+32);
            const TU = unit==="C" ? "°C" : "°F";
            const TS = unit==="C" ? "°" : "°F";

            const load = useCallback(async (city, isSearch = false) => {
                const premiumActive = isAuthenticated && !isTrial;
                const rateStatus = checkRateLimit(premiumActive);
                
                if (!rateStatus.allowed) {
                    setRateLimitErr(rateStatus.message);
                    setLoading(false);
                    return;
                }

                setRateLimitErr(null);
                setLoading(true); setErr(null);

                try {
                    if (!city || city === "undefined,undefined" || city === "null,null") {
                        city = "auto:ip";
                    }

                    const enc = encodeURIComponent(city);
                    const origin = typeof window !== 'undefined' && window.location.origin !== "null" ? window.location.origin : "https://levelup-ecosystem.com";
                    
                    let res = await fetch(`${origin}/api/weather?q=${enc}`);
                    
                    if (!res.ok && city === "auto:ip") {
                        res = await fetch(`${origin}/api/weather?q=Paris`);
                    }

                    if (!res.ok) {
                        const errData = await res.json().catch(()=>({}));
                        const apiMsg = (errData?.error || "").toLowerCase();
                        
                        let displayMsg = "Impossible de récupérer les données météo.";
                        if (apiMsg.includes("configuration") || res.status === 500) {
                            displayMsg = "Service météo temporairement en maintenance. Notre équipe est sur le coup !";
                        } else if (apiMsg.includes("not found") || apiMsg.includes("invalid") || res.status === 400 || res.status === 404) {
                            displayMsg = "Localisation introuvable. Veuillez vérifier l'orthographe de la ville.";
                        } else {
                            displayMsg = "Service momentanément indisponible. Veuillez réessayer dans quelques instants.";
                        }
                        throw new Error(displayMsg);
                    }
                    
                    const backendData = await res.json();
                    const forecastData = backendData.forecast;
                    const astroData = backendData.astronomy || forecastData.forecast.forecastday[0].astro;
                    
                    setData(forecastData);
                    setAstro(astroData);
                    setLastCity(forecastData.location.name);

                    if (forecastData.location?.lat) {
                        const locString = `${forecastData.location.lat},${forecastData.location.lon}`;
                        localStorage.setItem('levelday_last_loc', locString);
                    }

                    if (isSearch) incrementUsage(rateStatus.usage);

                } catch(e) { 
                    if (e.message.includes("Failed to parse URL") || e.message.includes("fetch")) {
                        setErr("Mode Sécurité Actif 🛡️ : L'API locale n'est pas accessible depuis cet aperçu.");
                    } else {
                        setErr(e.message || "Erreur réseau."); 
                    }
                } finally { 
                    setLoading(false); 
                }
            }, []);

            // INIT LOCALISATION AVEC FIRESTORE
            useEffect(() => {
                if (!isAuthenticated) return; // Seulement si connecté

                const initLoc = async () => {
                    let savedLoc = localStorage.getItem('levelday_last_loc');

                    // Récupération depuis le profil global Firestore
                    const savedKey = localStorage.getItem('levelday_access_key');
                    if (savedKey && savedKey !== 'TRIAL-MODE' && auth.currentUser) {
                        try {
                            const docRef = db.doc(`artifacts/level-ia-premium/users/${auth.currentUser.uid}/profile/data`);
                            const docSnap = await docRef.get();
                            if (docSnap.exists && docSnap.data().exactLocation) {
                                const loc = docSnap.data().exactLocation;
                                savedLoc = `${loc.lat},${loc.lng}`;
                            }
                        } catch (e) {
                            console.error("Erreur de récupération Firestore:", e);
                        }
                    }

                    let hasGranted = false;
                    if (navigator.permissions && navigator.permissions.query) {
                        try {
                            const perm = await navigator.permissions.query({ name: 'geolocation' });
                            hasGranted = (perm.state === 'granted');
                        } catch(e){}
                    }

                    if (hasGranted && navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (pos) => {
                                setShowTopLocBanner(false);
                                
                                // SAUVEGARDE GPS FIRESTORE
                                if (savedKey && savedKey !== 'TRIAL-MODE' && auth.currentUser) {
                                    const docRef = db.doc(`artifacts/level-ia-premium/users/${auth.currentUser.uid}/profile/data`);
                                    docRef.set({ 
                                        exactLocation: {
                                            lat: pos.coords.latitude,
                                            lng: pos.coords.longitude,
                                            accuracy: pos.coords.accuracy,
                                            timestamp: new Date().toISOString()
                                        }
                                    }, { merge: true }).catch(()=>{});
                                }

                                load(`${pos.coords.latitude},${pos.coords.longitude}`, true);
                            },
                            () => load(savedLoc || "auto:ip", true),
                            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                        );
                    } else {
                        load(savedLoc || "auto:ip", true);
                        const seen = localStorage.getItem("levelday_loc_prompt");
                        if (!seen) {
                            setTimeout(() => setShowLocPrompt(true), 3000);
                        } else {
                            setShowTopLocBanner(true);
                        }
                    }
                };
                initLoc();
            }, [load, isAuthenticated]);

            const handleEnableLoc = () => {
                setShowLocPrompt(false);
                localStorage.setItem("levelday_loc_prompt", "1");
                setLoading(true);
                setErr(null);
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            setShowTopLocBanner(false);
                            
                            // SAUVEGARDE GPS FIRESTORE MANUELLE
                            const savedKey = localStorage.getItem('levelday_access_key');
                            if (savedKey && savedKey !== 'TRIAL-MODE' && auth.currentUser) {
                                const docRef = db.doc(`artifacts/level-ia-premium/users/${auth.currentUser.uid}/profile/data`);
                                docRef.set({ 
                                    exactLocation: {
                                        lat: pos.coords.latitude,
                                        lng: pos.coords.longitude,
                                        accuracy: pos.coords.accuracy,
                                        timestamp: new Date().toISOString()
                                    }
                                }, { merge: true }).catch(()=>{});
                            }

                            load(`${pos.coords.latitude},${pos.coords.longitude}`, true);
                        },
                        () => {
                            setErr("Accès refusé. Utilisation de la position approximative.");
                            load("auto:ip", true);
                            setShowTopLocBanner(true);
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    setLoading(false);
                    setErr("La géolocalisation n'est pas supportée.");
                }
            };

            const handleDismissLoc = () => {
                setShowLocPrompt(false);
                localStorage.setItem("levelday_loc_prompt", "1");
                setShowTopLocBanner(true);
            };

            useEffect(() => {
                if (q.length < 2) { setSugg([]); return; }
                const t = setTimeout(async () => {
                    try {
                        const origin = typeof window !== 'undefined' && window.location.origin !== "null" ? window.location.origin : "https://levelup-ecosystem.com";
                        const r = await fetch(`${origin}/api/weather-search?q=${encodeURIComponent(q)}`);
                        const d = await r.json();
                        setSugg(Array.isArray(d) ? d : []);
                    } catch { setSugg([]); }
                }, 280);
                return () => clearTimeout(t);
            }, [q]);

            const pick = (name) => {
                setShowSearch(false); setShowNotifs(false); setSugg([]); setQ(""); setActiveDay(0); load(name, true);
            };
            const openSearch = () => {
                setShowSearch(true);
                setShowNotifs(false);
                setTimeout(() => inputRef.current?.focus(), 50);
            };

            // ── Derived data ─────────────────────────────────────────────────────────
            const cur = data?.current;
            const loc = data?.location;
            const fcast = data?.forecast?.forecastday || [];
            const alerts= data?.alerts?.alert || [];
            const code = cur?.condition?.code || 1000;
            const isDay = cur?.is_day ?? 1;
            const bgC = getBg(code, isDay);
            const aqiI = cur?.air_quality?.["us-epa-index"];

            const now = new Date();
            const dateStr = `${DAYS[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

            const nowH = now.getHours();
            const todayH = fcast[0]?.hour || [];
            const tomorrowH = fcast[1]?.hour || [];
            const hourly24 = [
                ...todayH.filter(h => new Date(h.time).getHours() >= nowH),
                ...tomorrowH.filter(h => new Date(h.time).getHours() < nowH)
            ].slice(0, 24);

            const parse12 = (str) => {
                if (!str) return 0;
                const [time, ap] = str.split(" ");
                if (!time) return 0;
                let [h, m] = time.split(":").map(Number);
                if (ap?.toLowerCase()==="pm" && h!==12) h+=12;
                if (ap?.toLowerCase()==="am" && h===12) h=0;
                return h*60+(m||0);
            };

            const srMin = parse12(astro?.sunrise);
            const ssMin = parse12(astro?.sunset);
            const nowMin = now.getHours()*60+now.getMinutes();

            let isNight = false;
            let arcPct = 0;
            let phaseLen = 0;

            if (srMin < ssMin && nowMin >= srMin && nowMin < ssMin) {
                isNight = false;
                arcPct = (nowMin - srMin) / (ssMin - srMin);
                phaseLen = ssMin - srMin;
            } else {
                isNight = true;
                const nightLen = (24 * 60 - ssMin) + srMin;
                if (nowMin >= ssMin) {
                    arcPct = (nowMin - ssMin) / nightLen; 
                } else {
                    arcPct = ((24 * 60 - ssMin) + nowMin) / nightLen;
                }
                phaseLen = nightLen;
            }

            const arcStart = isNight ? astro?.sunset : astro?.sunrise;
            const arcEnd = isNight ? astro?.sunrise : astro?.sunset;
            const arcStartLbl = isNight ? "Sunset" : "Sunrise";
            const arcEndLbl = isNight ? "Sunrise" : "Sunset";
            const arcIconStart = isNight ? "sunset" : "sunrise";
            const arcIconEnd = isNight ? "sunrise" : "sunset";
            const arcColorMain = isNight ? "#818CF8" : "#FDB813";
            const arcColorSec = isNight ? "#38BDF8" : "#FF7C5C";
            const arcGlow = isNight ? "rgba(129,140,248,0.15)" : "rgba(253,184,19,0.15)";
            const phaseH = Math.floor(phaseLen / 60);
            const phaseM = phaseLen % 60;

            // ── RATE LIMIT UI ──────────────────────────────────────────────────────────
            if (rateLimitErr) {
                return (
                    <div style={{minHeight:"100vh",background:"#020610",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"white",fontFamily:"'Syne',sans-serif",padding:20}}>
                        <style>{CSS}</style>
                        <div className="g fu" style={{maxWidth:480,width:"100%",borderRadius:24,padding:"40px",textAlign:"center",border:"1px solid rgba(255,255,255,0.1)",background:"rgba(10,15,30,0.8)",boxShadow:"0 30px 60px rgba(0,0,0,0.5)"}}>
                            <div style={{width:80,height:80,borderRadius:"50%",background:"rgba(192,132,252,0.15)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px",border:"1px solid rgba(192,132,252,0.3)"}}>
                                <Ico n="lock" s={36} c="#c084fc"/>
                            </div>
                            <h2 style={{fontSize:28,fontWeight:800,marginBottom:12,letterSpacing:"-.02em"}}>Access Limited</h2>
                            <p style={{fontSize:16,opacity:0.6,fontFamily:"'DM Sans',sans-serif",lineHeight:1.6,marginBottom:30}}>
                                {rateLimitErr}
                            </p>
                            <div style={{fontSize:11,opacity:.4,letterSpacing:".1em",textTransform:"uppercase",fontFamily:"Syne",fontWeight:700}}>
                                POWERED BY LEVEL UP ECOSYSTEM
                            </div>
                        </div>
                    </div>
                );
            }

            // ── ECRAN DE CONNEXION ──
            if (!isAuthenticated) {
                return (
                    <div style={{minHeight:"100dvh",background:"#020610",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"white",padding:"20px", paddingBottom:"calc(20px + env(safe-area-inset-bottom))", position: "relative", overflow: "hidden"}}>
                        <style>{CSS}</style>
                        <div style={{position:"fixed",inset:0,pointerEvents:"none",overflow:"hidden",zIndex:0}}>
                            <div style={{position:"absolute",top:"-10%",right:"-10%",width:500,height:500,borderRadius:"50%",background:"radial-gradient(circle, rgba(212,160,67,0.15) 0%, transparent 70%)",filter:"blur(60px)"}}/>
                            <div style={{position:"absolute",bottom:"-10%",left:"-10%",width:600,height:600,borderRadius:"50%",background:"radial-gradient(circle, rgba(192,132,252,0.15) 0%, transparent 70%)",filter:"blur(80px)"}}/>
                        </div>
                        
                        {isLoggingIn ? (
                            <div className="fu" style={{display:"flex",flexDirection:"column",alignItems:"center", zIndex: 1}}>
                                <div style={{width:50,height:50,border:"3px solid rgba(255,255,255,0.1)",borderTop:"3px solid #c084fc",borderRadius:"50%",marginBottom:20}} className="spin"/>
                                <div style={{fontFamily:"Syne",fontSize:24,fontWeight:800,letterSpacing:".05em"}}>
                                    <span style={{color:"#c084fc"}}>LEVEL</span><span style={{color:"white"}}>DAY</span>
                                </div>
                                <div style={{fontFamily:"Syne",fontSize:12,opacity:.5,marginTop:10,letterSpacing:".1em",textTransform:"uppercase"}}>Connexion en cours...</div>
                            </div>
                        ) : (
                            <div className="g fu" style={{maxWidth:400,width:"100%",borderRadius:24,padding:"40px",textAlign:"center",border:"1px solid rgba(255,255,255,0.1)",background:"rgba(10,15,30,0.6)",backdropFilter:"blur(20px)",boxShadow:"0 30px 60px rgba(0,0,0,0.5)", zIndex: 1}}>
                                <div style={{fontFamily:"Syne",fontWeight:800,fontSize:32,letterSpacing:".05em",marginBottom:30}}>
                                    <span style={{color:"#c084fc"}}>LEVEL</span><span style={{color:"white"}}>DAY</span>
                                </div>
                                
                                <div style={{marginBottom:24, textAlign: "left"}}>
                                    <label style={{display:"flex", alignItems:"center", gap:8, fontSize:11, fontFamily:"Syne", fontWeight:700, opacity:.6, textTransform:"uppercase", letterSpacing:".1em", marginBottom:10}}>
                                        <Ico n="lock" s={14}/> Clé d'accès requise
                                    </label>
                                    <input 
                                        type="password"
                                        value={accessKey}
                                        onChange={(e) => setAccessKey(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleLogin()}
                                        placeholder="LVL-XXXXX-XXXXX"
                                        style={{width:"100%", background:"rgba(0,0,0,0.4)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:12, padding:"14px 16px", color:"white", fontSize:14, letterSpacing:".1em", textAlign:"center", fontFamily:"monospace", outline:"none", transition:"border .2s"}}
                                        onFocus={(e) => e.target.style.border = "1px solid #c084fc"}
                                        onBlur={(e) => e.target.style.border = "1px solid rgba(255,255,255,0.1)"}
                                    />
                                </div>

                                {authError && <div style={{color:"#fca5a5", fontSize:12, marginBottom:20, background:"rgba(239,68,68,0.1)", padding:"8px", borderRadius:8, border:"1px solid rgba(239,68,68,0.2)"}}>{authError}</div>}

                                const p = arcPct;

                                        <stop offset="100%" stopColor={arcColorSec} />

                                        </filter>

                                        </clipPath>

                                        <path d="M 40 110 Q 200 -30 360 110" stroke="url(#arc-stroke)" strokeWidth="4" fill="none" filter="url(#glow-path)" />
                                        <path d="M 40 110 Q 200 -30 360 110" stroke="#FFFFFF" strokeWidth="1.5" fill="none" opacity="0.8" />

                                        <circle cx="0" cy={110 - sy} r="2.5" fill={arcColorMain} opacity="0.8" />

                                        </g>
                                        </g>
                                    )}
                                </svg>
                                );
                                })()}

                        <div style={{position:"absolute",bottom:0,left:0,width:12,height:12,borderBottom:"2px solid #c084fc",borderLeft:"2px solid #c084fc"}}/>
                        <div style={{position:"absolute",bottom:0,right:0,width:12,height:12,borderBottom:"2px solid #c084fc",borderRight:"2px solid #c084fc"}}/>

                        <div style={{width:56,height:56,borderRadius:0,background:"rgba(192,132,252,0.1)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px",border:"1px solid rgba(192,132,252,0.5)"}}>
                        <Ico n="loc" s={24} c="#c084fc"/>
                        </div>
                        
                        <h2 style={{fontFamily:"Syne",fontSize:22,fontWeight:800,marginBottom:14,letterSpacing:".08em",textTransform:"uppercase",color:"#c084fc"}}>Enhance Precision</h2>
                        
                        <p style={{fontSize:13,opacity:0.7,fontFamily:"'DM Sans',sans-serif",lineHeight:1.7,marginBottom:32}}>
                        You are currently seeing the weather based on your internet provider's general location. For highly accurate local weather, please enable location access.
                        </p>
                        
                        <div style={{display:"flex",flexDirection:"column",gap:12}}>
                        <button onClick={handleEnableLoc} className="hov" style={{padding:"16px",borderRadius:0,background:"#c084fc",color:"#020610",border:"none",fontFamily:"Syne",fontWeight:800,fontSize:12,letterSpacing:".1em",textTransform:"uppercase",cursor:"pointer",transition:"all 0.2s"}}>
                            Enable Location
                        </button>
                        <button onClick={handleDismissLoc} className="hov" style={{padding:"16px",borderRadius:0,background:"transparent",color:"white",border:"1px solid rgba(255,255,255,0.2)",fontFamily:"Syne",fontWeight:600,fontSize:12,letterSpacing:".1em",textTransform:"uppercase",cursor:"pointer",transition:"all 0.2s"}}>
                            Maybe Later
                        </button>
                        </div>
                    </div>
                    </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LevelDay />);
    </script>
</body>
