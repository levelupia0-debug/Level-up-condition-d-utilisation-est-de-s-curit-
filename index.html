<style>
/* ═══════════════════════════════════════
DESIGN SYSTEM — LEVELUP ECOSYSTEM
═══════════════════════════════════════ */
:root{
--bg:#030303;--surf:#0a0a0a;--elev:#111111;--elev2:#181818;
--bdr:rgba(255,255,255,.06);--bdr-hi:rgba(255,255,255,.12);--bdr-s:rgba(255,255,255,.2);
--txt:#ffffff;--muted:#a1a1aa;--dim:#52525b;--xdim:#3f3f46;
--purple:#a855f7;--purple-d:#7c3aed;--purple-g:rgba(168,85,247,.14);--purple-gl:rgba(168,85,247,.06);
--blue:#3b82f6;--blue-g:rgba(59,130,246,.12);
--green:#22c55e;--green-g:rgba(34,197,94,.1);
--pink:#ec4899;--pink-g:rgba(236,72,153,.12);
--red:#ef4444;--orange:#f97316;--yellow:#eab308;
--sans:'Inter',system-ui,sans-serif;--display:'Syne',sans-serif;
--r4:4px;--r8:8px;--r12:12px;--r16:16px;--r20:20px;--r24:24px;--r-full:100px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
.hidden{display:none!important}
h1,h2,h3,h4,h5{letter-spacing:-0.03em;font-weight:700;line-height:1.1;font-family:var(--display)}
p{color:var(--muted)}
a{text-decoration:none;color:inherit}
img{max-width:100%;height:auto}
button{font-family:var(--sans)}

/* Masquage agressif des barres de défilement partout */
* { -ms-overflow-style: none !important; scrollbar-width: none !important; }
::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; background: transparent !important; }
::selection{background:rgba(168,85,247,.3);color:#fff}

/* ── TOAST ── */
#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top, 10px));right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--elev);border:1px solid var(--bdr-hi);border-radius:var(--r12);padding:12px 16px;font-size:.84rem;font-weight:500;display:flex;align-items:center;gap:9px;pointer-events:auto[...]
.toast.ok{border-color:rgba(34,197,94,.3);color:var(--green)}
.toast.err{border-color:rgba(239,68,68,.3);color:var(--red)}
.toast.info{border-color:rgba(168,85,247,.3);color:var(--purple)}
.toast.warn{border-color:rgba(234,179,8,.3);color:var(--yellow)}
@keyframes tIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* ── NAV INVISIBLE ── */
nav{position:fixed;top:0;width:100%;z-index:800;display:flex;align-items:center;justify-content:space-between;padding:15px 5%;background:transparent;border-bottom:none;transition:all .3s;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:1.25rem;font-weight:800;letter-spacing:-0.06em;cursor:pointer;flex-shrink:0;user-select:none}
.brand svg{filter:drop-shadow(0 0 9px rgba(168,85,247,.6))}
.nav-links{display:flex;gap:22px}
.nav-links a{color:var(--muted);font-size:.84rem;font-weight:500;transition:color .2s;cursor:pointer;white-space:nowrap}
.nav-links a:hover{color:var(--txt)}
.nav-right{display:flex;gap:8px;align-items:center;flex-shrink:1;min-width:0}
.nav-user{display:flex;align-items:center;gap:7px;background:transparent;border:none;padding:4px 0;cursor:pointer;transition:opacity .2s;font-size:.85rem;font-weight:600}
.nav-user:hover{opacity:0.8}
.nav-avatar-img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.nav-avatar-txt{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--purple-d),var(--purple));display:flex;align-items:center;justify-content:center;font-size:.72rem;f[...]

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;border-radius:var(--r12);font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid transparent;t[...]
.btn-p{background:linear-gradient(135deg,var(--purple-d),var(--purple));color:#fff;box-shadow:0 4px 14px rgba(168,85,247,.3)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(168,85,247,.45)}
.btn-g{background:rgba(255,255,255,.04);color:var(--txt);border-color:var(--bdr)}
.btn-g:hover{background:rgba(255,255,255,.08);border-color:var(--bdr-hi)}
.btn-sm{padding:8px 16px;font-size:.8rem;border-radius:var(--r8)}
.btn-xs{padding:5px 10px;font-size:.74rem;border-radius:var(--r8)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;pointer-events:none}
.btn-lock{background:rgba(255,255,255,.03);color:var(--dim);border-color:var(--bdr);cursor:pointer;width:100%;}
.btn-lock:hover{background:rgba(168,85,247,.06);border-color:rgba(168,85,247,.2);color:var(--purple)}
.btn-wip{background:rgba(234,179,8,.06);color:var(--yellow);border-color:rgba(234,179,8,.2);cursor:default;pointer-events:none;width:100%;}
</style>

<nav id="nav">

    LEVELUP
  </div>

  <div class="nav-links">
    <a onclick="document.getElementById('apps-sec').scrollIntoView({behavior: 'smooth'})" data-i18n="nav.applications">Applications</a>
    <a onclick="document.getElementById('how-sec').scrollIntoView({behavior: 'smooth'})" data-i18n="nav.howItWorks">How It Works</a>
    <a onclick="document.getElementById('features-sec').scrollIntoView({behavior: 'smooth'})" data-i18n="nav.features">Features</a>
    <a onclick="document.getElementById('faq-sec').scrollIntoView({behavior: 'smooth'})" data-i18n="nav.faq">FAQ</a>
    <a href="https://levelup-ecosystem.com/terms" target="_blank" rel="noopener">Terms</a>
  </div>

  <div class="nav-right" id="navRight">
    
    <div id="loggedOutZone">
      <button class="btn btn-g btn-sm" onclick="window.location.href='/login'" data-i18n="nav.login">Sign In</button>
      <button class="btn btn-p btn-sm hidden sm:inline-flex" onclick="window.location.href='/login'" data-i18n="nav.createAccount">Create Account</button>
    </div>

    <div id="loggedInZone" style="display: none; align-items: center; gap: 15px;">
      <button class="notif-bell-btn" id="navBellBtn" onclick="window._navBellClick()" aria-label="Notifications" style="flex-shrink:0;">
        <i class="fa-solid fa-bell"></i>
        <span class="notif-bell-dot" id="navBellDot"></span>
      </button>
      <button class="btn btn-g btn-sm" id="logoutBtn">Déconnexion</button>
    </div>

  </div>
</nav>

<!-- Auth Router (gère login/dashboard) -->
