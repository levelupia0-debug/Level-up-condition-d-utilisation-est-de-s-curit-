<script type="text/babel" data-type="module">
// --- CAPTURE DU LIEN D'INVITATION (SSO ÉCOSYSTÈME) ---
const urlParams = new URLSearchParams(window.location.search);
let shouldUpdateUrl = false;

const ssoKey = urlParams.get('lvl_key');
if (ssoKey) {
    localStorage.setItem('levelanime_vip_key', ssoKey);
    const ssoUid = urlParams.get('lvl_uid');
    if (ssoUid) localStorage.setItem('levelanime_user_uid', ssoUid);
    const ssoName = urlParams.get('lvl_name');
    if (ssoName) localStorage.setItem('levelanime_user_name', ssoName);
    const ssoEmail = urlParams.get('lvl_email');
    if (ssoEmail) localStorage.setItem('levelanime_user_email', ssoEmail);
    const ssoPhoto = urlParams.get('lvl_photo');
    if (ssoPhoto) localStorage.setItem('la_photo', ssoPhoto);
    
    urlParams.delete('lvl_key');
    urlParams.delete('lvl_uid');
    urlParams.delete('lvl_name');
    urlParams.delete('lvl_photo');
    urlParams.delete('lvl_email');
    shouldUpdateUrl = true;
}

if (shouldUpdateUrl) {
    let newUrl = window.location.pathname;
    if (urlParams.toString()) newUrl += '?' + urlParams.toString();
    window.history.replaceState({}, document.title, newUrl);
}

import React, { useState, useEffect, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { 
  Play, Info, Search, X, Star, ChevronLeft, ChevronRight, 
  Bookmark, Home, Tv, Clapperboard, Users, Flame, Calendar, 
  Plus, CheckCircle, Bell, TrendingUp, Award, Compass, 
  Loader2, Eye, Trophy, Heart, AlignLeft, Filter, Sparkles, LayoutGrid, 
  BellRing, Mic2, Settings, User, PlayCircle, Subtitles, HardDrive, LogOut, ShieldCheck, KeyRound, EyeOff
} from 'lucide-react';

// --- FIREBASE SETUP ---
import { initializeApp } from "firebase/app";
import { getAuth, signInAnonymously } from "firebase/auth";
import { getFirestore, doc, setDoc, getDoc } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyA3JgvNu5p-43037jvm4WRDaJHI9ES7uGM",
  authDomain: "levelup-ia.firebaseapp.com",
  databaseURL: "https://levelup-ia-default-rtdb.firebaseio.com",
  projectId: "levelup-ia",
  storageBucket: "levelup-ia.firebasestorage.app",
  messagingSenderId: "229420004282",
  appId: "1:229420004282:web:6735f059a947f0936ae383",
  measurementId: "G-MSRDY2574K"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// --- CHEMINS DE L'ÉCOSYSTÈME ---
const APP_ID = "levelanime"; // Base Isolée pour cette app
const VALIDATION_API_URL = "https://levelup-ecosystem.com/api/validate-key"; // Ton Serveur de Validation Node.js

const LevelAnimeLogo = ({ className = "w-6 h-6", color = "currentColor" }) => (
  <svg viewBox="0 0 24 24" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M5 4V17C5 19.2091 6.79086 21 9 21H20" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M10 8.35824C10 7.42436 11.0185 6.8488 11.8153 7.33235L17.5855 10.8242C18.3571 11.2915 18.3571 12.4137 17.5855 12.881L11.8153 16.3728C11.0185 16.8564 10 16.2808 10 15.347V8.35824Z" fill={color}/>
  </svg>
);

const formatMetric = (num) => {
  if (!num) return 'N/A';
  if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num;
};

const ANIME_GENRES = [
  { id: 1, name: 'Action', icon: '🔥' },
  { id: 2, name: 'Aventure', icon: '🗺️' },
  { id: 4, name: 'Comédie', icon: '😂' },
  { id: 8, name: 'Drame', icon: '🎭' },
  { id: 10, name: 'Fantasy', icon: '✨' },
  { id: 14, name: 'Horreur', icon: '🩸' },
  { id: 22, name: 'Romance', icon: '❤️' },
  { id: 24, name: 'Sci-Fi', icon: '🚀' },
  { id: 30, name: 'Sport', icon: '🏅' },
  { id: 36, name: 'Tranche de vie', icon: '☕' },
  { id: 37, name: 'Surnaturel', icon: '👻' },
  { id: 7, name: 'Mystère', icon: '🔍' },
];

const FALLBACK_HERO = {
  mal_id: 52299,
  title: "Ore dake Level Up na Ken",
  title_english: "Solo Leveling",
  images: { webp: { large_image_url: "https://cdn.myanimelist.net/images/anime/1100/138338l.webp" } },
  trailer: { youtube_id: "euwZ9jI_Xp8", images: { maximum_image_url: "https://img.youtube.com/vi/euwZ9jI_Xp8/maxresdefault.jpg" } },
  synopsis: "Ils disent que tout ce qui ne vous tue pas vous rend plus fort. Ce n'est pourtant pas le cas pour Sung Jinwoo, le chasseur le plus faible du monde. Après avoir miraculeusement survécu à un double donjon mortel, il se réveille avec une étrange interface l'invitant à devenir le seul joueur capable de monter de niveau...",
  score: 8.35, year: 2024, episodes: 12, members: 850000, status: "Terminé", rating: "R - 17+", duration: "24 min par ep", type: "TV"
};

function App() {
  // --- AUTH STATES ---
  const [userName, setUserName] = useState('Utilisateur');
  const [userEmail, setUserEmail] = useState('');
  const [userPhoto, setUserPhoto] = useState(null);
  
  const [hasValidKey, setHasValidKey] = useState(false);
  const [isVerifying, setIsVerifying] = useState(true);
  const [accessKey, setAccessKey] = useState('');
  const [showKey, setShowKey] = useState(false);
  const [checking, setChecking] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');
  const [isLoadingAuth, setIsLoadingAuth] = useState(false);
  const [isLoggingIn, setIsLoggingIn] = useState(false);
  const [isLoggingOut, setIsLoggingOut] = useState(false);

  // --- SPLASH SCREEN ---
  const [showSplash, setShowSplash] = useState(true);
  const [splashStep, setSplashStep] = useState(0);
  
  // --- APP STATES ---
  const [currentCategory, setCurrentCategory] = useState('home');
  const [isScrolled, setIsScrolled] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  
  // Data States
  const [heroAnime, setHeroAnime] = useState(null);
  const [trending, setTrending] = useState([]);
  const [popular, setPopular] = useState([]);
  const [actionAnime, setActionAnime] = useState([]);
  const [romanceAnime, setRomanceAnime] = useState([]);
  const [topRated, setTopRated] = useState([]);
  const [searchResults, setSearchResults] = useState([]);
  
  // User Data States (Synced with Firestore)
  const [history, setHistory] = useState([]);
  const [watchlist, setWatchlist] = useState([]);
  const [reminders, setReminders] = useState([]);
  
  // UI & Modals
  const [loading, setLoading] = useState(true);
  const [selectedAnime, setSelectedAnime] = useState(null);
  const [playerAnime, setPlayerAnime] = useState(null);
  const [showNotifications, setShowNotifications] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showAccountModal, setShowAccountModal] = useState(false);
  const [showSurprise, setShowSurprise] = useState(false);
  const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
  const [inAppNotifications, setInAppNotifications] = useState([
    { id: 1, title: 'Système Connecté', desc: "L'écosystème LevelAnime est synchronisé.", time: 'Maintenant', unread: true }
  ]);
  const [toasts, setToasts] = useState([]);
  const [genreCounts, setGenreCounts] = useState({});
  const [surpriseAnime, setSurpriseAnime] = useState([]);
  const [loadingSurprise, setLoadingSurprise] = useState(false);

  // Explore
  const [exploreAnime, setExploreAnime] = useState([]);
  const [explorePage, setExplorePage] = useState(1);
  const [loadingExplore, setLoadingExplore] = useState(false);
  const [hasMoreExplore, setHasMoreExplore] = useState(true);
  const observerTarget = useRef(null);
  const [selectedGenre, setSelectedGenre] = useState(null);
  const isFetchingRef = useRef(false);

  // Animation de démarrage
  useEffect(() => {
    const t1 = setTimeout(() => setSplashStep(1), 100);
    const t2 = setTimeout(() => setSplashStep(2), 800);
    const t3 = setTimeout(() => setSplashStep(3), 1600);
    const t4 = setTimeout(() => {
        setSplashStep(4);
        setShowSplash(false);
    }, 2000);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); }
  }, []);

  // VÉRIFICATION SILENCIEUSE VIA L'API DE L'ÉCOSYSTÈME
  useEffect(() => {
    const initSilentAuth = async () => {
      try {
        if (!auth.currentUser) await signInAnonymously(auth);
        
        const savedKey = localStorage.getItem('levelanime_vip_key');
        const savedUid = localStorage.getItem('levelanime_user_uid');
        
        if (savedKey && savedUid) {
            try {
                // On ping ton API Server pour vérifier que la clé n'a pas été désactivée entre temps
                const response = await fetch(VALIDATION_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: savedKey, appId: APP_ID })
                });

                const data = await response.json();

                if (response.ok && data.valid) {
                    setUserName(data.name || localStorage.getItem('levelanime_user_name') || 'Utilisateur');
                    setUserEmail(data.email || localStorage.getItem('levelanime_user_email') || '');
                    setHasValidKey(true);
                    loadUserData(data.uid || savedUid);
                } else {
                    // La clé a été bannie ou supprimée côté serveur
                    localStorage.removeItem('levelanime_vip_key');
                    setHasValidKey(false);
                }
            } catch (err) {
                console.error("[AUTH] Erreur API en silencieux. Mode Hors-ligne/Tolérance :", err);
                // Si l'API est temporairement down (Vercel cold start), on accepte la session locale pour ne pas bloquer l'UX
                setHasValidKey(true);
                loadUserData(savedUid);
            }
        } else {
            setHasValidKey(false);
        }
      } catch (e) {
          console.error("Erreur globale d'init :", e);
      } finally {
          setIsVerifying(false);
      }
    };

    initSilentAuth();
  }, []);

  // --- LOGIN VIA TON SERVEUR NODE.JS (API) ---
  const handleLogin = async (e) => {
    e?.preventDefault();
    const finalKey = accessKey.trim().toUpperCase();
    if (!finalKey) return;
    setIsLoadingAuth(true);
    setErrorMsg('');

    console.log(`[AUTH] Envoi de la clé au serveur : ${finalKey}`);

    try {
      if (!auth.currentUser) await signInAnonymously(auth);

      // APPEL DE TON SERVEUR BACKEND POUR VALIDER LA CLÉ
      const response = await fetch(VALIDATION_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: finalKey, appId: APP_ID })
      });

      const data = await response.json();

      if (response.ok && data.valid) {
          console.log("[AUTH] Serveur : Clé valide autorisée !", data);
          
          const uid = data.uid || finalKey;
          const name = data.name || "Utilisateur VIP";
          const email = data.email || "email@inconnu.com";
          const photo = localStorage.getItem('la_photo') || null;

          setUserName(name);
          setUserEmail(email);
          if (photo) setUserPhoto(photo);
          
          // Sauvegarde de session
          localStorage.setItem('levelanime_vip_key', finalKey);
          localStorage.setItem('levelanime_user_name', name);
          localStorage.setItem('levelanime_user_email', email);
          localStorage.setItem('levelanime_user_uid', uid);
          
          setHasValidKey(true);
          loadUserData(uid); // On charge les données isolées (Watchlist LevelAnime)
          
          setAccessKey(''); 
          showToast("Connexion à l'Écosystème réussie", <CheckCircle className="w-5 h-5 text-green-400" />);
          
          setIsLoadingAuth(false);
          setIsLoggingIn(true);
          setTimeout(() => { setIsLoggingIn(false); }, 2000);

      } else {
          console.error("🔥 [AUTH] Refus du Serveur :", data.error);
          setErrorMsg(data.error || "Clé d'accès invalide.");
          setIsLoadingAuth(false);
      }
    } catch (error) {
        console.error("🔥 [AUTH] ERREUR RÉSEAU / API DOWN :", error);
        setErrorMsg("Erreur réseau. Le serveur d'authentification est injoignable.");
        setIsLoadingAuth(false);
    }
  };

  const handleLogout = () => {
    setShowSettings(false);
    setShowAccountModal(false);
    setShowLogoutConfirm(false);
    setIsLoggingOut(true);
    
    setTimeout(() => {
        localStorage.removeItem('levelanime_vip_key');
        localStorage.removeItem('levelanime_user_uid');
        setHasValidKey(false);
        setAccessKey('');
        setIsLoggingOut(false);
        showToast("Déconnexion réussie.", <LogOut className="w-5 h-5 text-white/50" />);
    }, 2500); 
  };

  // --- SAVE / LOAD ISOLATED DATA (APP_ID = levelanime) ---
  const loadUserData = async (uid) => {
    try {
      const wlRef = doc(db, 'artifacts', APP_ID, 'users', uid, 'watchlist', 'data');
      const wlSnap = await getDoc(wlRef);
      if(wlSnap.exists()) setWatchlist(wlSnap.data().items || []);

      const histRef = doc(db, 'artifacts', APP_ID, 'users', uid, 'history', 'recent');
      const histSnap = await getDoc(histRef);
      if(histSnap.exists()) setHistory(histSnap.data().items || []);

      const prefRef = doc(db, 'artifacts', APP_ID, 'users', uid, 'preferences', 'settings');
      const prefSnap = await getDoc(prefRef);
      if(prefSnap.exists()) setReminders(prefSnap.data().reminders || []);
    } catch (error) {
      console.error("Error loading user data. Note: Firebase Rules must allow read for this UID.", error);
    }
  };

  const saveUserData = async (newWatchlist, newReminders, newHistory) => {
    const uid = localStorage.getItem('levelanime_user_uid');
    if (!uid) return;
    try {
      if (newWatchlist) await setDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'watchlist', 'data'), { items: newWatchlist }, { merge: true });
      if (newReminders) await setDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'preferences', 'settings'), { reminders: newReminders }, { merge: true });
      if (newHistory) await setDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'history', 'recent'), { items: newHistory }, { merge: true });
    } catch (error) {
      console.error("Error saving user data", error);
    }
  };

  const showToast = (message, icon = <CheckCircle className="w-5 h-5 text-green-400" />) => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, message, icon }]);
    setTimeout(() => { setToasts(prev => prev.filter(t => t.id !== id)); }, 4000);
  };

  useEffect(() => {
    if (selectedAnime || showSurprise || showNotifications || showSettings || showAccountModal || showLogoutConfirm || playerAnime || isLoggingOut) {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = 'auto';
    }
    return () => { document.body.style.overflow = 'auto'; };
  }, [selectedAnime, showSurprise, showNotifications, showSettings, showAccountModal, showLogoutConfirm, playerAnime, isLoggingOut]);

  // ==========================================
  // 4. API DATA FETCHING (JIKAN)
  // ==========================================
  useEffect(() => {
    if (!hasValidKey) return; 

    const fetchInitialData = async () => {
      try {
        setLoading(true);
        const delay = (ms) => new Promise(res => setTimeout(res, ms));

        fetch('https://api.jikan.moe/v4/genres/anime')
          .then(res => res.json())
          .then(data => {
            if(data.data) {
              const counts = {};
              data.data.forEach(g => { counts[g.mal_id] = g.count; });
              setGenreCounts(counts);
            }
          }).catch(e => console.error(e));

        const trendingRes = await fetch('https://api.jikan.moe/v4/seasons/now?limit=25');
        const trendingData = await trendingRes.json();
        
        if (trendingData.data) {
          const validTrending = trendingData.data.filter(a => a.images?.webp?.large_image_url);
          setTrending(validTrending);
          const heroCandidate = validTrending.find(a => a.trailer?.images?.maximum_image_url) || validTrending[0];
          setHeroAnime(heroCandidate || FALLBACK_HERO);
        } else {
          setHeroAnime(FALLBACK_HERO); 
        }

        setLoading(false); 
        await delay(1200); 

        const popularRes = await fetch('https://api.jikan.moe/v4/top/anime?filter=airing&limit=10');
        const popularData = await popularRes.json();
        if(popularData.data) setPopular(popularData.data);
        await delay(1200);

        const topRes = await fetch('https://api.jikan.moe/v4/top/anime?limit=15');
        const topData = await topRes.json();
        if(topData.data) setTopRated(topData.data);
        await delay(1200);

        const actionRes = await fetch('https://api.jikan.moe/v4/anime?genres=1&order_by=popularity&sort=asc&limit=15');
        const actionData = await actionRes.json();
        if(actionData.data) setActionAnime(actionData.data);
        await delay(1200);

        const romanceRes = await fetch('https://api.jikan.moe/v4/anime?genres=22&order_by=popularity&sort=asc&limit=15');
        const romanceData = await romanceRes.json();
        if(romanceData.data) setRomanceAnime(romanceData.data);

      } catch (error) {
        console.error("Erreur de chargement API:", error);
        if(!heroAnime) setHeroAnime(FALLBACK_HERO);
        setLoading(false);
      }
    };

    fetchInitialData();
    const handleScroll = () => setIsScrolled(window.scrollY > 30);
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, [hasValidKey]);

  // SEARCH
  useEffect(() => {
    if (searchQuery.length < 3 || !hasValidKey) {
      setSearchResults([]);
      return;
    }
    const timeoutId = setTimeout(async () => {
      try {
        const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(searchQuery)}&limit=20`);
        const data = await res.json();
        setSearchResults(data.data || []);
      } catch (error) { console.error(error); }
    }, 800);
    return () => clearTimeout(timeoutId);
  }, [searchQuery, hasValidKey]);

  // EXPLORER
  const fetchExploreAnime = useCallback(async (pageToLoad, genreId = selectedGenre) => {
    if (isFetchingRef.current || (!hasMoreExplore && pageToLoad !== 1) || !hasValidKey) return;
    isFetchingRef.current = true;
    setLoadingExplore(true);
    try {
      const genreQuery = genreId ? `&genres=${genreId}` : '';
      const res = await fetch(`https://api.jikan.moe/v4/anime?page=${pageToLoad}&limit=24&order_by=popularity&sort=asc${genreQuery}`);
      const data = await res.json();
      
      if (data.data && data.data.length > 0) {
        setExploreAnime(prev => {
          if (pageToLoad === 1) return data.data;
          const newAnimes = data.data.filter((newAnime) => !prev.some((existingAnime) => existingAnime.mal_id === newAnime.mal_id));
          return [...prev, ...newAnimes];
        });
        setExplorePage(pageToLoad);
        setHasMoreExplore(data.pagination.has_next_page);
      } else {
        setHasMoreExplore(false);
        if (pageToLoad === 1) setExploreAnime([]);
      }
    } catch (error) { console.error(error); } 
    finally {
      isFetchingRef.current = false;
      setLoadingExplore(false);
    }
  }, [loadingExplore, hasMoreExplore, selectedGenre, hasValidKey]);

  useEffect(() => {
    if (currentCategory === 'explore' && hasValidKey) {
      setExploreAnime([]);
      setHasMoreExplore(true);
      fetchExploreAnime(1, selectedGenre);
    }
  }, [currentCategory, selectedGenre, hasValidKey]);

  useEffect(() => {
    const observer = new IntersectionObserver(
      entries => {
        if (entries[0].isIntersecting && hasMoreExplore && !loadingExplore && currentCategory === 'explore') {
          fetchExploreAnime(explorePage + 1, selectedGenre);

  };

  // --- PANNEAU PARAMÈTRES (SETTINGS) ---
  const SettingsPanel = () => {
    if(!showSettings) return null;
    return (
        <div className="fixed inset-0 z-[9000] flex justify-end">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowSettings(false)}></div>
          <div className="relative w-full max-w-sm bg-[#0a0a0f] border-l border-white/5 shadow-[-20px_0_50px_rgba(0,0,0,0.8)] h-full flex flex-col animate-in slide-in-from-right duration-300">
            <div className="flex items-center justify-between p-6 border-b border-white/5 shrink-0 bg-[#060608]">
              <h3 className="text-white font-black uppercase tracking-widest text-lg flex items-center gap-2">
                <Settings className="w-5 h-5 text-primary" /> Paramètres
              </h3>
              <button onClick={() => setShowSettings(false)} className="text-white/50 hover:text-white transition-colors outline-none bg-white/5 p-2 rounded-full hover:bg-white/10">
                <X className="w-4 h-4" />
              </button>
            </div>
            
            <div className="flex-1 overflow-y-auto no-scrollbar p-6 space-y-8">
              
              {/* Profil */}
              <div>
                <div className="flex items-center gap-4 mb-4">
                  <div className="w-14 h-14 rounded-full bg-gradient-to-r from-primary to-orange-500 flex items-center justify-center shadow-[0_0_15px_rgba(239,68,68,0.4)] overflow-hidden border-2 border-primary/50 shrink-0">
                    {userPhoto ? <img src={userPhoto} className="w-full h-full object-cover" alt="Profile" /> : <User className="w-6 h-6 text-white" />}
                  </div>
                  <div className="flex flex-col items-start overflow-hidden w-full">
                    <h4 className="font-black text-white text-lg truncate w-full">{userName}</h4>
                    <p className="text-[10px] text-white/50 font-mono mb-1.5 truncate w-full">{userEmail}</p>
                  </div>
                </div>
                <button onClick={() => setShowAccountModal(true)} className="w-full py-2 bg-white/5 hover:bg-white/10 rounded-lg text-xs font-bold uppercase tracking-widest transition-colors">Gérer mon compte</button>
              </div>

              {/* Qualité & Lecture */}
              <div>
                <h4 className="text-white/40 text-[10px] font-bold uppercase tracking-widest mb-3 flex items-center gap-2"><PlayCircle className="w-4 h-4 text-white/40"/> Lecture & Vidéo</h4>
                <div className="bg-white/5 rounded-xl border border-white/5 px-4">
                  <div className="flex items-center justify-between py-4 border-b border-white/5">
                    <span className="text-xs font-bold text-white/80">Qualité par défaut</span>
                    <span className="text-xs font-black text-primary">1080p Ultra HD</span>
                  </div>
                  <ToggleSwitch label="Lecture Automatique" id="autoplay" defaultChecked={true} />
                </div>
              </div>

              {/* Sous-titres & Audio */}
              <div>
                <h4 className="text-white/40 text-[10px] font-bold uppercase tracking-widest mb-3 flex items-center gap-2"><Subtitles className="w-4 h-4 text-white/40"/> Langue & Sous-titres</h4>
                <div className="bg-white/5 rounded-xl border border-white/5 px-4">
                  <div className="flex items-center justify-between py-4 border-b border-white/5">
                    <span className="text-xs font-bold text-white/80">Langue Audio préférée</span>
                    <span className="text-xs font-black text-white">Japonais (VO)</span>
                  </div>
                  <div className="flex items-center justify-between py-4 border-b border-white/5">
                    <span className="text-xs font-bold text-white/80">Sous-titres préférés</span>
                    <span className="text-xs font-black text-white">Français</span>
                  </div>
                  <div className="flex items-center justify-between py-4 cursor-pointer group" onClick={() => { setShowSettings(false); setCurrentCategory('watchlist'); window.scrollTo(0,0); }}>
                    <span className="text-xs font-bold text-white/80 group-hover:text-primary transition-colors flex items-center gap-2"><Bookmark className="w-3.5 h-3.5"/> Mes Favoris</span>
                    <span className="text-xs font-black text-white bg-white/10 px-2 py-0.5 rounded">{watchlist.length}</span>
                  </div>
                </div>
              </div>

              {/* Données & Cache */}
              <div>
                <h4 className="text-white/40 text-[10px] font-bold uppercase tracking-widest mb-3 flex items-center gap-2"><HardDrive className="w-4 h-4 text-white/40"/> Stockage & Données</h4>
                <div className="bg-white/5 rounded-xl border border-white/5 px-4">
                  <ToggleSwitch label="Tél. via Wi-Fi uniquement" id="wifi" defaultChecked={true} />
                  <div className="flex items-center justify-between py-4 cursor-pointer hover:text-primary transition-colors group">
                    <span className="text-xs font-bold text-white/80 group-hover:text-primary">Vider le cache mémoire</span>
                    <span className="text-[10px] font-black text-white/40">124 MB</span>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
    );
  };

  // --- RENDER MAIN ---
  return (
    <div className="min-h-screen bg-[#060608] text-white">
      <Header />

      {searchQuery.length >= 3 ? (
         <div className="pt-24 px-4 md:px-14 pb-24 relative z-30 min-h-screen">
          <h2 className="text-xl md:text-2xl font-black text-white uppercase tracking-widest border-l-4 border-primary pl-3 mb-6">Résultats pour "{searchQuery}"</h2>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
            {searchResults.map(anime => (
               <div key={anime.mal_id} className="relative cursor-pointer rounded-xl overflow-hidden shadow-lg border border-white/5 bg-[#151520] hover:scale-105 transition-transform aspect-[2/3] group" onClick={() => handleAnimeSelect(anime)}>
                 <img className="object-cover w-full h-full" src={anime.images.webp.large_image_url} loading="lazy" alt="" />
                 <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3">
                   <h3 className="text-white font-black text-[10px] md:text-sm uppercase tracking-wider line-clamp-2 drop-shadow-md">{anime.title}</h3>
                 </div>
               </div>
            ))}
            {searchResults.length === 0 && <p className="text-white/50 col-span-full py-10 text-center uppercase tracking-widest text-sm font-bold">Aucun résultat trouvé.</p>}
          </div>
        </div>
      ) : currentCategory === 'watchlist' ? (
        <div className="pt-24 px-4 md:px-14 pb-24 min-h-screen">
          <h2 className="text-xl md:text-2xl font-black text-white uppercase tracking-widest pl-3 border-l-4 border-primary mb-8">Ma Liste</h2>
          {watchlist.length === 0 ? (
            <div className="flex flex-col items-center justify-center py-32 opacity-50">
              <Bookmark className="w-16 h-16 mb-4 text-primary" />
              <p className="text-sm uppercase tracking-widest font-bold">Votre liste est vide.</p>
            </div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
              {watchlist.map((anime, idx) => (
                <div key={`${anime.mal_id}-${idx}`} className="relative cursor-pointer rounded-xl overflow-hidden shadow-lg border border-white/5 bg-[#151520] hover:scale-105 transition-transform aspect-[2/3] group" onClick={() => handleAnimeSelect(anime)}>
                  <img className="object-cover w-full h-full" src={anime.images.webp.large_image_url} loading="lazy" alt="" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#060608] via-transparent to-transparent flex flex-col justify-end p-3">
                    <h3 className="text-white font-black text-[10px] md:text-sm uppercase tracking-wider line-clamp-2">{anime.title_english || anime.title}</h3>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      ) : currentCategory === 'explore' ? (
        <div className="pt-24 px-4 md:px-14 pb-32 min-h-screen">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-primary/20 rounded-xl flex items-center justify-center border border-primary/40 shadow-inner shrink-0">
                <Compass className="w-6 h-6 text-primary" />
              </div>
              <div>
                <h2 className="text-xl md:text-2xl font-black text-white uppercase tracking-widest leading-tight">Explorer</h2>
                <p className="text-white/50 text-xs font-bold uppercase tracking-widest">Base de données globale</p>
              </div>
            </div>

            <div className="flex overflow-x-auto no-scrollbar gap-2 py-2">
              <button 
                onClick={() => setSelectedGenre(null)} 
                className={`px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap outline-none border ${!selectedGenre ? 'bg-primary text-white border-primary shadow-[0_0_15px_rgba(239,68,68,0.4)]' : 'bg-white/5 border-white/10 text-white/60 hover:text-white hover:bg-white/10'}`}
              >
                Tous les animes
              </button>
              {ANIME_GENRES.map(g => (
                <button 
                  key={g.id}
                  onClick={() => setSelectedGenre(g.id)} 
                  className={`px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap outline-none border flex items-center gap-1.5 ${selectedGenre === g.id ? 'bg-primary text-white border-primary shadow-[0_0_15px_rgba(239,68,68,0.4)]' : 'bg-white/5 border-white/10 text-white/60 hover:text-white hover:bg-white/10'}`}
                >
                  <span>{g.icon}</span> {g.name}
                </button>
              ))}
            </div>
          </div>
          
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
            {exploreAnime.map((anime, idx) => (
              <div key={`${anime.mal_id}-${idx}`} className="relative cursor-pointer rounded-xl overflow-hidden shadow-lg border border-white/5 bg-[#151520] hover:scale-105 transition-transform aspect-[2/3] group" onClick={() => handleAnimeSelect(anime)}>
                <img className="object-cover w-full h-full" src={anime.images.webp.large_image_url} loading="lazy" alt="" />
                <div className="absolute inset-0 bg-gradient-to-t from-[#060608] via-transparent to-transparent flex flex-col justify-end p-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10">
                  <h3 className="text-white font-black text-[10px] md:text-sm uppercase tracking-wider line-clamp-2 drop-shadow-md">{anime.title_english || anime.title}</h3>
                  <div className="mt-1 flex gap-2">
                    <span className="text-primary font-bold text-[9px] bg-primary/20 px-2 py-0.5 rounded border border-primary/30">
                      <Star className="w-3 h-3 inline mb-0.5" /> {anime.score || 'N/A'}
                    </span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div ref={observerTarget} className="h-20 w-full flex items-center justify-center mt-10">
            {loadingExplore && <Loader2 className="w-8 h-8 animate-spin text-primary" />}
          </div>
        </div>
      ) : (
        <>
          {currentCategory === 'home' && <HeroBanner />}
          
          <main className={`pb-24 relative z-20 ${currentCategory === 'home' ? 'mt-6 md:-mt-10' : 'pt-24'}`}>
            {loading && currentCategory !== 'home' ? (
              <div className="flex justify-center items-center py-32"><div className="animate-spin rounded-full h-12 w-12 border-t-2 border-primary"></div></div>
            ) : (
              <>
                {history.length > 0 && currentCategory === 'home' && (
                  <AnimeRow title="Reprendre la lecture" animes={history} icon={PlayCircle} />
                )}

                {currentCategory === 'trending' && <MassiveTrendingGrid animes={trending} />}
                
                {currentCategory === 'home' && (
                  <>
                    <Top10Row title="Top 10 de la Semaine" animes={popular} />
                    
                    <AnimeRow title="Action & Aventure" animes={actionAnime} icon={Flame} />
                    <AnimeRow title="Chefs-d'œuvre Mieux Notés" animes={topRated} icon={Award} />
                    <AnimeRow title="Romance & Drame" animes={romanceAnime} icon={Users} />
                    
                    <div className="group relative ml-4 md:ml-12 mb-10 md:mb-16 mt-16 pt-8 border-t border-white/5">
                      <h2 className="text-white/90 text-[13px] md:text-lg font-black mb-6 uppercase tracking-[0.2em] border-l-4 border-primary pl-3 md:pl-4 drop-shadow-sm flex items-center gap-3">
                        Parcourir par genre <Filter className="w-4 h-4 text-primary" />
                      </h2>
                      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 md:gap-4 pr-4 md:pr-12">
                         {ANIME_GENRES.map(g => (
                            <button 
                              key={g.id}
                              onClick={() => { setSelectedGenre(g.id); setCurrentCategory('explore'); window.scrollTo(0,0); }} 
                              className="bg-[#151520] hover:bg-primary/20 border border-white/5 hover:border-primary/50 rounded-2xl p-4 md:p-6 flex flex-col items-center justify-center gap-2 md:gap-3 transition-all duration-300 group outline-none shadow-sm hover:shadow-[0_0_30px_rgba(239,68,68,0.2)]"
                            >
                               <span className="text-2xl md:text-4xl group-hover:scale-110 transition-transform duration-300 drop-shadow-md">{g.icon}</span>
                               <h3 className="text-[10px] md:text-xs font-black uppercase tracking-widest text-white/70 group-hover:text-white transition-colors">{g.name}</h3>
                               <p className="text-[8px] md:text-[9px] text-white/40 uppercase tracking-widest mt-1">
                                 {genreCounts[g.id] ? `${genreCounts[g.id].toLocaleString()} Titres` : '...'}
                               </p>
                            </button>
                         ))}
                      </div>
                    </div>
                  </>
                )}
              </>
            )}
          </main>
        </>
      )}

      {/* LECTEUR VIDÉO */}
      <PlayerModal />

      {/* MODAL SURPRISE ME */}
      {showSurprise && (
        <div className="fixed inset-0 z-[9000] flex justify-center items-center p-4 sm:p-8 bg-[#060608]/95 backdrop-blur-3xl overflow-hidden">
          <div className="relative w-full max-w-5xl bg-[#0a0a0f] rounded-[2rem] p-6 md:p-10 flex flex-col animate-in zoom-in duration-300 z-10 shadow-[0_0_80px_rgba(239,68,68,0.3)] border border-primary/30 max-h-[95vh]">
            <button onClick={() => setShowSurprise(false)} className="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/50 hover:text-white transition-colors shadow-sm z-20 outline-none">
              <X className="w-5 h-5" />
            </button>
            <div className="flex flex-col items-center mb-8 text-center shrink-0">
              <div className="w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-[0_0_30px_rgba(239,68,68,0.5)] mb-4">
                <Star className="w-8 h-8 text-white fill-white" />
              </div>
              <h2 className="text-2xl md:text-4xl font-black text-white uppercase tracking-widest mb-3 drop-shadow-md">
                Sélection <span className="text-primary">LEVELANIME</span>
              </h2>
              <p className="text-sm md:text-base text-white/70 max-w-2xl leading-relaxed italic">
                "Nous avons analysé des milliers d'œuvres. Voici le <strong>Top absolu</strong> sélectionné par notre algorithme. Des chefs-d'œuvre incontournables à voir au moins une fois dans sa vie."
              </p>
            </div>
            <div className="flex-1 overflow-y-auto no-scrollbar pb-6">
              {loadingSurprise ? (
                <div className="flex justify-center items-center py-20"><Loader2 className="w-12 h-12 text-primary animate-spin" /></div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-6">
                  {surpriseAnime.map((anime, idx) => (
                    <div key={`${anime.mal_id}-${idx}`} className="relative cursor-pointer rounded-xl overflow-hidden shadow-lg border border-white/10 hover:border-primary bg-[#151520] hover:scale-105 transition-all duration-300 aspect-[2/3] group" onClick={() => { setSelectedAnime(anime); setShowSurprise(false); }}>
                      <div className="absolute top-2 left-2 w-8 h-8 bg-primary rounded-full flex items-center justify-center font-black text-white z-20 shadow-md border border-[#060608]">
                        {idx + 1}
                      </div>
                      <img className="object-cover w-full h-full transition-opacity duration-500" src={anime.images.webp.large_image_url} loading="lazy" alt="" />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3 z-10">
                        <h3 className="text-white font-black text-[10px] md:text-sm uppercase tracking-wider line-clamp-2 drop-shadow-md">{anime.title_english || anime.title}</h3>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="pt-6 border-t border-white/10 shrink-0 text-center">
               <button onClick={() => setShowSurprise(false)} className="px-8 py-4 bg-white/5 hover:bg-white/10 text-white/50 hover:text-white rounded-xl text-[11px] font-bold uppercase tracking-widest transition-colors outline-none">
                 Fermer la sélection
               </button>
            </div>
          </div>
        </div>
      )}

      {/* PARAMETRES */}
      <SettingsPanel />

      {/* MODALS COMPTE & DÉCONNEXION */}
      <AccountModal />
      <LogoutConfirmModal />

      {/* PANNEAU NOTIFICATIONS */}
      {showNotifications && (
        <div className="fixed inset-0 z-[9000] flex justify-end">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowNotifications(false)}></div>
          <div className="relative w-full max-w-sm bg-[#0a0a0f] border-l border-white/5 shadow-[-20px_0_50px_rgba(0,0,0,0.8)] h-full flex flex-col animate-in slide-in-from-right duration-300">
            <div className="flex items-center justify-between p-6 border-b border-white/5 shrink-0">
              <h3 className="text-white font-black uppercase tracking-widest text-lg flex items-center gap-2">
                <Bell className="w-5 h-5 text-primary" /> Notifications
              </h3>
              <button onClick={() => setShowNotifications(false)} className="text-white/50 hover:text-white transition-colors outline-none bg-white/5 p-2 rounded-full hover:bg-white/10">
                <X className="w-4 h-4" />
              </button>
            </div>
            <div className="flex-1 overflow-y-auto no-scrollbar p-4 flex flex-col gap-3">
              {inAppNotifications.map(notif => (
                <div key={notif.id} className="bg-white/5 border border-white/10 hover:bg-white/10 transition-colors rounded-xl p-4 cursor-pointer group relative overflow-hidden">
                  {notif.unread && <div className="absolute top-0 left-0 w-1 h-full bg-primary"></div>}
                  <div className="flex justify-between items-start mb-1">
                    <h4 className={`text-xs font-black uppercase tracking-widest ${notif.unread ? 'text-white' : 'text-white/60'}`}>{notif.title}</h4>
                    <span className="text-[9px] text-primary font-bold">{notif.time}</span>
                  </div>
                  <p className="text-white/70 text-[11px] leading-relaxed mt-2">{notif.desc}</p>
                </div>
              ))}
              <div className="mt-4 p-4 border border-dashed border-white/10 rounded-xl text-center opacity-50 flex flex-col items-center justify-center py-10">
                <CheckCircle className="w-8 h-8 mb-2" />
                <span className="text-[10px] uppercase font-bold tracking-widest">Vous êtes à jour</span>
              </div>
            </div>
            <div className="p-4 border-t border-white/5 shrink-0 bg-black/20">
              <button onClick={() => {
                setInAppNotifications(inAppNotifications.map(n => ({...n, unread: false})));
              }} className="w-full py-3 bg-white/5 hover:bg-white/10 text-white/50 hover:text-white rounded-xl text-[10px] font-bold uppercase tracking-widest transition-colors outline-none">
                Tout marquer comme lu
              </button>
            </div>
          </div>
        </div>
      )}

      {/* TOAST SYSTEM */}
      <div className="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none items-center w-full px-4">
        {toasts.map(toast => (
          <div key={toast.id} className="toast-enter flex items-center gap-3 px-6 py-3 md:py-4 bg-[#151520]/95 backdrop-blur-md border border-white/10 rounded-full shadow-2xl">
            {toast.icon} <span className="text-[11px] md:text-xs font-bold uppercase tracking-widest text-white">{toast.message}</span>
          </div>
        ))}
      </div>

      <AnimeModal />
      <MobileNav />
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
