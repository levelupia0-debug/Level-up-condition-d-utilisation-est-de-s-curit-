const copyToClipboardFallback = (text) => {
const textArea = document.createElement("textarea");
textArea.value = text;
textArea.style.position = "fixed";

document.body.appendChild(textArea);
textArea.focus();
textArea.select();

};

const getBrowserData = () => {
    const ua = navigator.userAgent;
    if (/Brave/i.test(ua) || (navigator.brave && navigator.brave.isBrave)) return { name: 'Brave', id: 'brave' };
    if (/Edg/i.test(ua)) return { name: 'Edge', id: 'edge' };
    if (/Firefox|FxiOS/i.test(ua)) return { name: 'Firefox', id: 'firefox' };
    if (/GSA/i.test(ua)) return { name: 'Google', id: 'google' };
    if (/Chrome|CriOS/i.test(ua)) return { name: 'Chrome', id: 'chrome' };
    if (/Safari/i.test(ua)) return { name: 'Safari', id: 'safari' };
    return { name: null, id: null };
};

// --- SYSTÈME DE CENSURE ---
const BAD_WORDS = ['putain', 'merde', 'connard', 'connasse', 'salope', 'fdp', 'ntm', 'tg', 'encule', 'enculé', 'bite', 'couille', 'chier', 'fuck', 'shit', 'bitch', 'asshole', 'cunt', 'dick', 'pussy', 'slut', 'whore', 'nigger', 'nigga', 'faggot', 'pédé'];
const censorText = (text) => {
    if (!text) return text;
    let censored = text;
    BAD_WORDS.forEach(word => {
        const regex = new RegExp(`\\b${word}\\b`, 'gi');
        censored = censored.replace(regex, (match) => '*'.repeat(match.length));
    });
    return censored;
};

// --- FILTRE PARENTAL RÉEL ---
// Genres TMDB considérés comme explicites/matures : Horreur (27), Guerre (10752), Crime (80).
const MATURE_GENRE_IDS = [27, 10752, 80];
const filterMatureContent = (items, parentalFilterActive) => {
    if (!parentalFilterActive || !Array.isArray(items)) return items;
    return items.filter(item => {
        const genreIds = item.genre_ids || (item.genres ? item.genres.map(g => g.id) : []);
        return !genreIds.some(id => MATURE_GENRE_IDS.includes(id));
    });
};

function SalonRoom({ movie, mode, onClose, onSelectSimilar, t, lang, user, userPhoto, defaultUserName, watchlist, toggleWatchlist, showToast, handleCreateParty, partyId, partyData, handleSendPartyMessage, sendSystemAction, handlePartySyncAction, handleLeaveParty, db, APP_ID, isPartyCategory, addToHistory, isMinimized, setIsMinimized, isGuest, onGoogleLogin, accessKey, setAccessKey, showKey, setShowKey, authError, isLoadingAuth, handleLogin }) {
const [details, setDetails] = useState(null);
const [loading, setLoading] = useState(true);
const [error, setError] = useState(false);
const [modalMode, setModalMode] = useState(mode);

const [showDisclaimer, setShowDisclaimer] = useState(false);
const [disclaimerAccepted, setDisclaimerAccepted] = useState(false);
const [selectedServer, setSelectedServer] = useState(() => {
    try {
        const saved = JSON.parse(localStorage.getItem('lm_now_playing') || 'null');
        if (saved && saved.id === movie.id && saved.server) return saved.server;
    } catch(e) {}
    return 'vidsrc_me';
});
const [pendingServer, setPendingServer] = useState('vidsrc_me');
const [iframeLoading, setIframeLoading] = useState(true);

const isTV = movie.first_air_date !== undefined;
const typeStr = isTV ? 'tv' : 'movie';
const isAddedToWatchlist = watchlist.includes(movie.id);
const iAmHost = !!(partyId && partyData && user?.uid === partyData.hostUid);
const iAmMod = !!(partyId && partyData && partyData.mods?.includes(user?.uid));

// Saison/épisode en cours : priorité à un "reprendre" explicite (venant de "Récemment consultés"),
// sinon à la session sauvegardée localement (survit à un refresh), sinon S1E1 par défaut.
const [selectedSeason, setSelectedSeason] = useState(() => {
    if (movie.resumeSeason) return movie.resumeSeason;
    try {
        const saved = JSON.parse(localStorage.getItem('lm_now_playing') || 'null');
        if (saved && saved.id === movie.id && saved.mediaType === typeStr && saved.season) return saved.season;
    } catch(e) {}
    return 1;
});
const [selectedEpisode, setSelectedEpisode] = useState(() => {
    if (movie.resumeEpisode) return movie.resumeEpisode;
    try {
        const saved = JSON.parse(localStorage.getItem('lm_now_playing') || 'null');
        if (saved && saved.id === movie.id && saved.mediaType === typeStr && saved.episode) return saved.episode;
    } catch(e) {}
    return 1;
});
const [seasonEpisodes, setSeasonEpisodes] = useState([]);
const [loadingEpisodes, setLoadingEpisodes] = useState(false);
const [episodesError, setEpisodesError] = useState(false);
const [showEpisodesModal, setShowEpisodesModal] = useState(false);

const AVAILABLE_SERVERS = [
    { id: 'vidsrc_me', name: '1. GLOBAL' },
    { id: 'superembed', name: '2. MULTI' },
    { id: 'vidlink', name: '3. ALPHA' },
    { id: 'vidsrc_to', name: '4. BETA' },
    { id: 'vidsrc_pro', name: '5. GAMMA' },
    { id: 'smashy', name: '6. DELTA' }
];

const [chatInput, setChatInput] = useState('');
const [replyingTo, setReplyingTo] = useState(null);
const chatEndRef = useRef(null);

const [syncCountdown, setSyncCountdown] = useState(0);
const [localPauseState, setLocalPauseState] = useState({ show: false, estimatedTime: 0 });
const [showLeavePartyConfirm, setShowLeavePartyConfirm] = useState(false);
const [showHostLeaveWarning, setShowHostLeaveWarning] = useState(false);
const [showModForceCloseConfirm, setShowModForceCloseConfirm] = useState(false);

const [showUserSearch, setShowUserSearch] = useState(false);
const [friendSearchQuery, setFriendSearchQuery] = useState('');
const [friendResults, setFriendResults] = useState([]);

const [memberMenu, setMemberMenu] = useState(null);

// --- NOUVELLE NAVIGATION STYLE TIKTOK/INSTA : un seul panneau actif à la fois ---
// null | 'members' | 'comments' | 'share' | 'manage'
const [activeSheet, setActiveSheet] = useState(null);
const [unreadComments, setUnreadComments] = useState(0);
const [hasNewDM, setHasNewDM] = useState(false);
const lastSeenDmRef = useRef({}); // { convoKey: timestamp du dernier message vu }
const lastMsgCountRef = useRef(0);

// Compte les nouveaux commentaires reçus tant que le panneau Commentaires n'est pas ouvert
useEffect(() => {
    const count = partyData?.messages?.length || 0;
    if (activeSheet === 'comments') {
        lastMsgCountRef.current = count;
        setUnreadComments(0);
        return;
    }
    if (count > lastMsgCountRef.current) {
        const newOnes = partyData.messages.slice(lastMsgCountRef.current).filter(m => !m.isSystem && m.uid !== user?.uid);
        if (newOnes.length > 0) setUnreadComments(prev => prev + newOnes.length);
    }
    lastMsgCountRef.current = count;
}, [partyData?.messages?.length, activeSheet]);

// Détecte un nouveau message privé (PV) tant que le panneau Membres n'est pas ouvert
useEffect(() => {
    if (!partyData?.dms || !user) return;
    let found = false;
    Object.entries(partyData.dms).forEach(([key, msgs]) => {
        if (!key.includes(user.uid) || !msgs?.length) return;
        const last = msgs[msgs.length - 1];
        if (last.from === user.uid) return;
        const seen = lastSeenDmRef.current[key] || 0;
        if (last.time > seen) found = true;
    });
    if (found && activeSheet !== 'members') setHasNewDM(true);
}, [partyData?.dms, activeSheet, user?.uid]);

useEffect(() => {
    if (activeSheet === 'members') {
        setHasNewDM(false);
        if (dmKey) lastSeenDmRef.current[dmKey] = Date.now();
    }
}, [activeSheet]);

// --- INDICATEUR "EST EN TRAIN D'ÉCRIRE..." (commentaires) ---
const typingThrottleRef = useRef(0);
const notifyTyping = () => {
    if (isGuest || !partyId || !db) return;
    const now = Date.now();
    if (now - typingThrottleRef.current < 1200) return;
    typingThrottleRef.current = now;
    updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), {
        [`typing.${user.uid}`]: { name: defaultUserName, time: now }
    }).catch(() => {});
};
// Une entrée n'est considérée "active" que pendant 3.5s après la dernière frappe (auto-expire, pas besoin d'écrire pour l'effacer)
const [, forceTick] = useState(0);
useEffect(() => {
    if (!partyData?.typing || Object.keys(partyData.typing).length === 0) return;
    const iv = setInterval(() => forceTick(x => x + 1), 1000);
    return () => clearInterval(iv);
}, [partyData?.typing]);
const typingUsers = Object.entries(partyData?.typing || {})
    .filter(([uid, info]) => uid !== user?.uid && info?.time && (Date.now() - info.time) < 3500)
    .map(([uid, info]) => info.name);


// --- MESSAGES PRIVÉS (PV) ENTRE MEMBRES DU SALON ---
const [dmWith, setDmWith] = useState(null); // membre { uid, name, photo }
const [dmInput, setDmInput] = useState('');
const dmEndRef = useRef(null);
const dmKey = dmWith ? [user?.uid, dmWith.uid].sort().join('__') : null;
const dmMessages = (dmKey && partyData?.dms?.[dmKey]) || [];

// --- CONNEXION INVITÉ (Google ou clé) DEPUIS LE CHAT ---
const [showGuestKeyLogin, setShowGuestKeyLogin] = useState(false);

// --- CORRECTIF SAFARI : empêche le lecteur vidéo de "monter" quand le clavier
// s'ouvre pour écrire un message. On pilote la hauteur réelle du salon avec
// window.visualViewport (qui reflète la zone VRAIMENT visible, clavier exclu)
// au lieu de se fier uniquement à 100dvh, et on ré-ancre la page en (0,0) car
// Safari a tendance à faire défiler le body "fixed" quand un input à l'intérieur
// prend le focus, ce qui donne l'impression que la vidéo "monte".
const salonRootRef = useRef(null);
useEffect(() => {
    if (isMinimized) return;
    const vv = window.visualViewport;
    if (!vv) return;
    const applyViewportHeight = () => {
        if (salonRootRef.current) {
            salonRootRef.current.style.height = `${vv.height}px`;
        }
        if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
    };
    applyViewportHeight();
    vv.addEventListener('resize', applyViewportHeight);
    vv.addEventListener('scroll', applyViewportHeight);
    window.addEventListener('scroll', applyViewportHeight, { passive: true });
    return () => {
        vv.removeEventListener('resize', applyViewportHeight);
        vv.removeEventListener('scroll', applyViewportHeight);
        window.removeEventListener('scroll', applyViewportHeight);
    };
}, [isMinimized]);

const handleInviteUser = async (friend) => {
    const inviteDataStr = localStorage.getItem(`lm_invites_${user.uid}`);
    let inviteData = inviteDataStr ? JSON.parse(inviteDataStr) : { count: 0, emails: [], weekStart: Date.now() };

    if (Date.now() - inviteData.weekStart > 7 * 24 * 60 * 60 * 1000) {
        inviteData = { count: 0, emails: [], weekStart: Date.now() };
    }

    if (inviteData.count >= 5) {
        showToast(t.inviteLimitReached, "error");
        return;
    }

    if (inviteData.emails.includes(friend.email)) {
        showToast(t.inviteAlreadySent, "error");
        return;
    }

    try {
        // Récupérer l'endpoint Resend depuis Firebase (avec fallback)
        let emailEndpoint = 'https://levelup-ecosystem.com/api/send';
        try {
            const keyDoc = await getDoc(doc(db, "artifacts", APP_ID, "system", "keys"));
            if (keyDoc.exists() && keyDoc.data().email_endpoint) {
                emailEndpoint = keyDoc.data().email_endpoint;
            }
        } catch(_) {}

        // Envoi via Resend — type WATCH_PARTY
        const partyLink = `${window.location.origin}/movie/${partyId}`;
        await fetch(emailEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: friend.email,
                type: 'WATCH_PARTY',
                name: friend.name,
                inviterName: defaultUserName,
                partyCode: partyId,
                partyLink: partyLink,
                movieTitle: partyData?.title || partyData?.roomName || 'Watch Party'
            })
        });

        inviteData.count += 1;
        inviteData.emails.push(friend.email);
        localStorage.setItem(`lm_invites_${user.uid}`, JSON.stringify(inviteData));

        showToast(`${t.inviteSent.replace('!', '')} à ${friend.name}`, 'success');
        setShowUserSearch(false);
        setFriendSearchQuery('');
    } catch (error) {
        console.error("Erreur invitation Resend", error);
        showToast("Erreur lors de l'envoi de l'invitation.", "error");
    }
};

const getProviders = () => {
const region = lang === 'fr-FR' ? 'FR' : 'US';
const providerData = details?.['watch/providers']?.results?.[region];
if (!providerData) return null;

const allProviders = [...(providerData.flatrate || []), ...(providerData.free || []), ...(providerData.ads || [])];
const unique = [];
const seen = new Set();
for (const p of allProviders) {
if (!seen.has(p.provider_id)) {
seen.add(p.provider_id);
unique.push(p);
}
}
return unique.length > 0 ? { unique, link: providerData.link } : null;
};

                                onFocus={() => setTimeout(() => window.scrollTo(0, 0), 50)}

                            />
                            <button
                                onClick={() => { handleSendPartyMessage(chatInput, replyingTo); setChatInput(''); setReplyingTo(null); }}
                                disabled={!chatInput.trim()}
                                className="w-9 h-9 shrink-0 rounded-xl bg-gradient-to-br from-[#a855f7] to-[#7c3aed] flex items-center justify-center text-white hover:opacity-90 disabled:opacity-30 disabled:from-white/10 disabled:to-white/10 transition-all outline-none shadow-md active:scale-95"
                            >
                                <Send className="w-4 h-4 ml-0.5" />
                            </button>
                        </div>
                        </>

                    </div>
                    </>

    if(!sm.poster_path) return null;
    return (
    <div key={sm.id} className="relative flex-none cursor-pointer rounded-2xl overflow-hidden shadow-xl border border-white/5 bg-[#151520] hover:scale-105 transition-transform w-[140px] md:w-[180px] h-[210px] md:h-[270px]" onClick={() => onSelectSimilar(sm)}>
    <img className="object-cover w-full h-full" src={`${IMAGE_BASE_URL}${sm.poster_path}`} loading="lazy" draggable="false" alt=""/>
    </div>
    )
    })}
    </div>
    </div>
    )}
    </div>
</div>

</div>
);
}
function SalonApp() {
const [lang, setLang] = useState(localStorage.getItem('levelmovie_lang') || 'fr');
const t = i18n[lang] || i18n['fr'];

const [fbUser, setFbUser] = useState(null);
const [user, setUser] = useState(null);
const [userName, setUserName] = useState('');
const [userEmail, setUserEmail] = useState('');
const [userPhoto, setUserPhoto] = useState(null);
const [accessKey, setAccessKey] = useState('');
const [authError, setAuthError] = useState('');
const [isLoadingAuth, setIsLoadingAuth] = useState(false);
const [showKey, setShowKey] = useState(false);
const [toasts, setToasts] = useState([]);

const [partyId, setPartyId] = useState(null);
const [partyData, setPartyData] = useState(null);
const [selectedMovie, setSelectedMovie] = useState(null);
const [joinError, setJoinError] = useState('');
const [isJoining, setIsJoining] = useState(false);
const [isMinimized, setIsMinimized] = useState(false);

const defaultUserName = userName || t.defaultUser;

const showToast = useCallback((msg, type = 'info') => {
if (type === 'info') return;
const id = Date.now() + Math.random();
setToasts(prev => [...prev, { id, msg, type }]);
setTimeout(() => setToasts(prev => prev.filter(x => x.id !== id)), 3000);
}, []);

// 1. Auth Firebase (anonyme si pas de session sauvegardée, sinon on réutilise la clé déjà validée)
useEffect(() => {
const initAuth = async () => {
    try { await signInAnonymously(auth); } catch(e) { console.error("Erreur Auth:", e); }
};
initAuth();
const unsubscribe = onAuthStateChanged(auth, setFbUser);
return () => unsubscribe();
}, []);

// 2. Session existante ? (même domaine que /movie, donc localStorage déjà partagé)
useEffect(() => {
const savedKey = localStorage.getItem('levelmovie_saved_key');
const savedUid = localStorage.getItem('levelmovie_user_uid');
const savedName = localStorage.getItem('levelmovie_user_name');
const savedEmail = localStorage.getItem('levelmovie_user_email');
const savedPhoto = localStorage.getItem('lm_photo');

if (savedKey && savedUid) {
    setUser({ uid: savedUid });
    if (savedName) setUserName(savedName);
    if (savedEmail) setUserEmail(savedEmail);
    if (savedPhoto) setUserPhoto(savedPhoto);
}
}, []);

// 3. Connexion par clé (uniquement si pas de session déjà présente) — même endpoint que /movie
const handleLogin = async () => {
const finalKey = accessKey.trim();
if (!finalKey) return;
setIsLoadingAuth(true);
setAuthError('');
try {
    if (!auth.currentUser) await signInAnonymously(auth);

    const res = await fetch('/api/validate-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: finalKey, appId: APP_ID })
    });
    const data = await res.json();

    if (res.ok && data.valid) {
        const uid = data.uid || finalKey;
        const email = data.email || "email@inconnu.com";
        const name = data.name || email.split('@')[0] || t.defaultUser;
        const photo = localStorage.getItem('lm_photo') || null;

        setUser({ uid });
        setUserName(name);
        setUserEmail(email);
        if (photo) setUserPhoto(photo);

        localStorage.setItem('levelmovie_saved_key', finalKey);
        localStorage.setItem('levelmovie_user_name', name);
        localStorage.setItem('levelmovie_user_email', email);
        localStorage.setItem('levelmovie_user_uid', uid);

        setIsLoadingAuth(false);
    } else {
        setAuthError(data.error || t.enterKey);
        setIsLoadingAuth(false);
    }
} catch (error) {
    setAuthError(lang === 'fr' ? "Connexion impossible. Vérifiez votre réseau ou votre clé." : "Connection failed. Check your key.");
    setIsLoadingAuth(false);
}
};

// 3bis. Connexion Google (pour un invité qui veut débloquer le chat/les actions du salon)
const handleGoogleLogin = async () => {
setAuthError('');
try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    const gUser = result.user;
    const uid = gUser.uid;
    const name = gUser.displayName || (gUser.email ? gUser.email.split('@')[0] : t.defaultUser);
    const email = gUser.email || "";
    const photo = gUser.photoURL || null;

    setUser({ uid });
    setUserName(name);
    setUserEmail(email);
    if (photo) setUserPhoto(photo);

    // Réutilise le même mécanisme de session que la clé LVL pour la persistance
    localStorage.setItem('levelmovie_saved_key', `google:${uid}`);
    localStorage.setItem('levelmovie_user_name', name);
    localStorage.setItem('levelmovie_user_email', email);
    localStorage.setItem('levelmovie_user_uid', uid);
    if (photo) localStorage.setItem('lm_photo', photo);
} catch (error) {
    if (error?.code !== 'auth/popup-closed-by-user' && error?.code !== 'auth/cancelled-popup-request') {
        setAuthError(lang === 'fr' ? "Connexion Google impossible. Réessayez." : "Google sign-in failed. Please try again.");
    }
}
};

// Mode invité : quiconque arrive avec un lien de salon valide entre directement dans la
// pièce en lecture seule (vidéo + chat visibles) sans avoir de compte. L'identité "invité"
// s'appuie sur l'uid Firebase anonyme, et n'est JAMAIS ajoutée à la liste des membres :
// elle sert uniquement à afficher l'interface, tant que la personne ne s'est pas connectée
// (Google ou clé LVL) directement depuis le champ de chat.
const isGuest = !user;
const guestUser = fbUser ? { uid: fbUser.uid, isGuest: true } : null;
const effectiveUser = user || guestUser;
const effectiveUserName = user ? defaultUserName : t.guestDefaultName;

// 4. Rejoindre automatiquement le salon indiqué dans l'URL, une fois authentifié (compte OU invité)
useEffect(() => {
if (!effectiveUser || !fbUser || !ROOM_CODE || partyId) return;

const autoJoin = async () => {
    setIsJoining(true);
    setJoinError('');
    try {
        const pRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', ROOM_CODE);
        const pSnap = await getDoc(pRef);

        if (!pSnap.exists() || pSnap.data().status === 'ended') {
            setJoinError(t.eventEnded);
            setIsJoining(false);
            return;
        }
        const d = pSnap.data();

        if (d.banned && d.banned.includes(effectiveUser.uid)) {
            setJoinError(t.youAreBanned);
            setIsJoining(false);
            return;
        }
        if (!isGuest && d.members && d.members.length >= 25) {
            setJoinError(t.roomFull);
            setIsJoining(false);
            return;
        }

        const res = await fetch(`${BASE_URL}/${d.mediaType}/${d.movieId}?api_key=${API_KEY}&language=${lang === 'fr' ? 'fr-FR' : 'en-US'}`);
        const movieData = await res.json();
        if (d.mediaType === 'tv') {
            movieData.resumeSeason = d.season || 1;
            movieData.resumeEpisode = d.episode || 1;
        }
        setSelectedMovie(movieData);
        setPartyId(ROOM_CODE);
        document.body.classList.add('party-mode');

        // Un invité ne devient jamais un membre officiel : il regarde/discute en spectateur
        // jusqu'à ce qu'il se connecte (Google ou clé LVL) depuis le champ de chat.
        if (!isGuest && !d.members.some(m => m.uid === effectiveUser.uid)) {
            await updateDoc(pRef, {
                members: arrayUnion({ uid: effectiveUser.uid, name: effectiveUserName, photo: userPhoto || "" }),
                messages: arrayUnion({ isSystem: true, action: 'JOIN', name: effectiveUserName, photo: userPhoto || "", uid: effectiveUser.uid, time: Date.now() })
            });
        }
        setIsJoining(false);
    } catch (e) {
        console.error("Erreur pour rejoindre le salon:", e);
        setJoinError(t.invalidPartyCode);
        setIsJoining(false);
    }
};
autoJoin();
}, [effectiveUser?.uid, isGuest, fbUser, partyId]);

// 5. Écoute temps réel du salon
useEffect(() => {
if (!partyId || !fbUser) { setPartyData(null); return; }

const unsubscribe = onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), (docSnap) => {
    if (docSnap.exists() && docSnap.data().status !== 'ended') {
        const data = docSnap.data();
        if (data.banned && data.banned.includes(effectiveUser?.uid)) {
            setJoinError(t.youAreBanned);
            setPartyId(null); setPartyData(null); setSelectedMovie(null);
            document.body.classList.remove('party-mode');
            return;
        }
        if (!isGuest && data.members && !data.members.some(m => m.uid === user?.uid)) {
            setPartyId(null); setPartyData(null); setSelectedMovie(null);
            document.body.classList.remove('party-mode');
            return;
        }
        setPartyData(data);
    } else {
        setJoinError(t.sessionEnded);
        setPartyId(null); setPartyData(null); setSelectedMovie(null);
        document.body.classList.remove('party-mode');
    }
}, () => {});

return () => unsubscribe();
}, [partyId, user, fbUser, isGuest]);

// 5bis. Un invité qui se connecte (Google ou clé) EN COURS DE SALON devient membre à part
// entière à cet instant précis, sans devoir recharger la page ni rejoindre à nouveau.
useEffect(() => {
if (!user || !fbUser || !partyId || !partyData) return;
if (partyData.members && !partyData.members.some(m => m.uid === user.uid)) {
    const pRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId);
    updateDoc(pRef, {
        members: arrayUnion({ uid: user.uid, name: defaultUserName, photo: userPhoto || "" }),
        messages: arrayUnion({ isSystem: true, action: 'JOIN', name: defaultUserName, photo: userPhoto || "", uid: user.uid, time: Date.now() })
    }).catch(() => {});
}
}, [user?.uid, partyId, !!partyData]);

// --- Fonctions de gestion du salon (identiques à /movie) ---
const handleSendPartyMessage = async (text, replyTo = null) => {
if (!partyId || !text.trim() || !user || !fbUser) return;
const muteInfo = partyData?.muted?.find(m => m.uid === user.uid);
if (muteInfo) { showToast(`${t.mutedByWarning}${muteInfo.by}`, "error"); return; }
const cleanText = censorText(text.trim());
try {
    const msg = { uid: user.uid, name: defaultUserName, photo: userPhoto || "", text: cleanText, time: Date.now() };
    if (replyTo) msg.replyTo = replyTo;
    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), { messages: arrayUnion(msg) });
} catch(e) {}
};

const sendSystemAction = async (actionType) => {
if (!partyId || !user || !fbUser) return;
try {
    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), {
        messages: arrayUnion({ isSystem: true, action: actionType, name: defaultUserName, photo: userPhoto || "", uid: user.uid, time: Date.now() })
    });
} catch(e) {}
};

const handlePartySyncAction = async (action, currentOffset = 0) => {
if (!partyId || !fbUser) return;
try {
    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), { status: action, syncTime: Date.now(), currentOffset: currentOffset });
} catch(e) {}
};

const handleLeaveParty = async (forceClose = false) => {
if (!partyId || !partyData || !fbUser) return;
try {
    if (forceClose || user.uid === partyData.hostUid) {
        if (!forceClose && partyData.mods && partyData.mods.length > 0) {
            const newHost = partyData.mods[0];
            const memberToRemove = partyData.members.find(m => m.uid === user.uid);
            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), {
                hostUid: newHost, mods: arrayRemove(newHost), members: arrayRemove(memberToRemove),
                messages: arrayUnion({ isSystem: true, action: 'LEAVE', name: defaultUserName, photo: userPhoto || "", uid: user.uid, time: Date.now() })
            });
        } else {
            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), { status: 'ended', dms: {} });
        }
    } else {
        const memberToRemove = partyData.members.find(m => m.uid === user.uid);
        if (memberToRemove) {
            let updates = {
                members: arrayRemove(memberToRemove),
                messages: arrayUnion({ isSystem: true, action: 'LEAVE', name: defaultUserName, photo: userPhoto || "", uid: user.uid, time: Date.now() })
            };
            if (partyData.mods?.includes(user.uid)) updates.mods = arrayRemove(user.uid);
            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'parties', partyId), updates);
        }
    }
    setPartyId(null);
    setPartyData(null);
    setSelectedMovie(null);
    document.body.classList.remove('party-mode');
} catch(e) {}
};

const addToHistory = () => {}; // pas d'historique dans le salon autonome

if (!ROOM_CODE) {
return (
    <div className="bg-main flex items-center justify-center min-h-screen p-6 text-center">
        <style>{globalStyles}</style>
        <div className="max-w-sm">
            <AlertOctagon className="w-12 h-12 text-red-500 mx-auto mb-4" />
            <h1 className="text-lg font-black uppercase tracking-widest mb-2">Lien invalide</h1>
            <p className="text-white/50 text-sm mb-6">Ce lien de salon n'est pas valide ou incomplet.</p>
            <a href="https://levelup-ecosystem.com/movie" className="inline-block bg-[#a855f7] text-white px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest no-underline">Aller sur LevelMovie</a>
        </div>
    </div>
);
}

// Remarque : il n'y a plus de mur de connexion ici. Un utilisateur qui arrive avec un
// lien de salon valide entre directement dedans en mode invité (vidéo + chat visibles),
// et se connecte s'il le souhaite (Google ou clé LVL) via le champ de chat, plus bas.

if (joinError) {
return (
    <div className="bg-main flex items-center justify-center min-h-screen p-6 text-center">
        <style>{globalStyles}</style>
        <div className="max-w-sm">
            <AlertTriangle className="w-12 h-12 text-red-500 mx-auto mb-4" />
            <h1 className="text-lg font-black uppercase tracking-widest mb-2">Salon inaccessible</h1>
            <p className="text-white/50 text-sm mb-6">{joinError}</p>
            <a href="https://levelup-ecosystem.com/movie" className="inline-block bg-[#a855f7] text-white px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest no-underline">Aller sur LevelMovie</a>
        </div>
    </div>
);
}

if (isJoining || !partyId || !selectedMovie) {
return (
    <div className="fixed inset-0 z-[9999] bg-[#060608] flex items-center justify-center flex-col">
        <style>{globalStyles}</style>
        <LevelMovieLogo className="w-16 h-16 text-[#a855f7] mb-6 animate-pulse" />
        <span className="text-[#a855f7] font-black uppercase tracking-widest text-xs animate-pulse">Connexion au salon...</span>
    </div>
);
}

return (
<div className="bg-main text-white min-h-screen">
<style>{globalStyles}</style>

<div className="fixed top-4 right-4 md:top-6 md:right-6 z-[9999] flex flex-col gap-3 pointer-events-none items-end">
{toasts.map(toast => (
<div key={toast.id} className={`flex items-center gap-4 p-4 rounded-2xl backdrop-blur-3xl border shadow-2xl transition-all duration-500 animate-in slide-in-from-right fade-in ${toast.type === 'error' ? 'border-red-500/30 bg-[#0a0a0f]/95 text-red-50' : 'border-green-500/30 bg-[#0a0a0f]/95 text-green-50'} min-w-[280px] pointer-events-auto`}>
{toast.type === 'error' ? <AlertTriangle className="w-5 h-5 text-red-400" /> : <CheckCircle className="w-5 h-5 text-green-400" />}
<span className="text-[12px] font-bold tracking-wide">{toast.msg}</span>
</div>
))}
</div>

<SalonRoom
movie={selectedMovie}
mode="play"
onClose={() => { window.location.href = 'https://levelup-ecosystem.com/movie'; }}
onSelectSimilar={() => {}}
t={t}
lang={lang === 'fr' ? 'fr-FR' : 'en-US'}
user={effectiveUser}
userPhoto={userPhoto}
defaultUserName={effectiveUserName}
watchlist={[]}
toggleWatchlist={() => {}}
showToast={showToast}
handleCreateParty={() => {}}
partyId={partyId}
partyData={partyData}
handleSendPartyMessage={handleSendPartyMessage}
sendSystemAction={sendSystemAction}
handlePartySyncAction={handlePartySyncAction}
handleLeaveParty={handleLeaveParty}
db={db}
APP_ID={APP_ID}
isPartyCategory={true}
addToHistory={addToHistory}
isMinimized={isMinimized}
isGuest={isGuest}
onGoogleLogin={handleGoogleLogin}
accessKey={accessKey}
setAccessKey={setAccessKey}
showKey={showKey}
setShowKey={setShowKey}
authError={authError}
isLoadingAuth={isLoadingAuth}
handleLogin={handleLogin}
setIsMinimized={setIsMinimized}
/>
</div>
);
}

const rootElement = document.getElementById('root');
const root = createRoot(rootElement);
root.render(<SalonApp />);
</script>
</body>
</html>
