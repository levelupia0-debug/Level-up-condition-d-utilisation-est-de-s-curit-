<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistant LevelUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100vh; background-color: transparent; overflow: hidden; color: white; }
        .widget-container { width: 100%; height: 100%; background-color: #06020a; display: flex; flex-direction: column; position: relative; }
        .space-bg { position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.4), transparent), radial-gradient(1px 1px at 85% 30%, rgba(255,255,255,0.3), transparent), radial-gradient(1.5px 1.5px at 45% 60%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 70% 80%, rgba(168,85,247,0.5), transparent), radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,0.4), transparent), radial-gradient(1.5px 1.5px at 90% 10%, rgba(168,85,247,0.5), transparent); background-size: 150px 150px; pointer-events: none; animation: spaceDrift 100s linear infinite; }
        @keyframes spaceDrift { 0% { background-position: 0 0; } 100% { background-position: -300px 300px; } }
        .content-z { position: relative; z-index: 10; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-out-up { animation: fadeOutUp 0.4s ease forwards; }
        @keyframes fadeOutUp { to { opacity: 0; transform: translateY(-20px) scale(0.95); pointer-events: none; height: 0; margin: 0; padding: 0; } }
        .msg-in { animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform-origin: bottom right; }
        .msg-in-ai { animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform-origin: bottom left; }
        @keyframes msgIn { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .prompts-overlay { position: absolute; inset: 0; z-index: 50; background: rgba(6, 2, 10, 0.98); backdrop-filter: blur(15px); display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .prompts-overlay.open { transform: translateY(0); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.4); }
        
        /* Style des boutons générés par l'IA */
        .ai-action-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; padding: 10px 16px; border-radius: 12px; margin-top: 12px; font-size: 0.85rem; transition: transform 0.2s, filter 0.2s; cursor: pointer; border: none; outline: none; }
        .ai-action-btn:active { transform: scale(0.96); }
        .btn-google { background: white; color: #3c4043; border: 1px solid #dadce0; }
        .btn-google:hover { filter: brightness(0.95); }
        .btn-key { background: linear-gradient(135deg, #a855f7, #3b82f6); color: white; box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
        .btn-key:hover { filter: brightness(1.1); }
        .btn-app { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; }
        .btn-app:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="space-bg"></div>
        <div id="allPromptsOverlay" class="prompts-overlay">
            <div class="flex justify-between items-center px-6 py-4 border-b border-white/10 shrink-0 bg-black/20">
                <h3 class="text-white font-bold text-sm flex items-center gap-2">
                    <i class="fas fa-list-ul text-[#a855f7]"></i> Que voulez-vous savoir ?
                </h3>
                <button onclick="document.getElementById('allPromptsOverlay').classList.remove('open')" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/70 transition-colors">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                <div id="promptsGrid" class="flex flex-wrap gap-2.5"></div>
            </div>
        </div>

        <div class="content-z flex justify-between items-center px-4 py-3 border-b border-white/10 shrink-0 bg-[#06020a]/80 backdrop-blur-md">
            <div class="flex items-center gap-2.5 text-white font-bold text-[14px]">
                <i class="fas fa-star text-[#a855f7] text-[16px]" id="headerIcon"></i> Votre Assistant
            </div>
            <div class="flex items-center gap-3">
                <div id="limitBadge" class="hidden px-2 py-1 rounded border border-[#a855f7]/30 bg-[#a855f7]/10 text-[10px] text-[#d8b4fe] font-mono">--/120</div>
                <button onclick="window.parent.postMessage({action: 'minimize_ia'}, '*')" class="w-8 h-8 rounded-full bg-transparent border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fas fa-minus text-[12px]"></i>
                </button>
                <button onclick="window.parent.postMessage({action: 'close_ia'}, '*')" class="px-3 py-1.5 rounded-full bg-[#ef4444]/10 border border-[#ef4444]/30 text-[#fca5a5] text-[11px] font-black uppercase tracking-widest flex items-center gap-1.5 hover:bg-[#ef4444]/20 transition-colors shadow-[0_0_10px_rgba(239,68,68,0.2)]">
                    <i class="fas fa-power-off text-[10px]"></i> OFF
                </button>
            </div>
        </div>

        <div id="chatArea" class="content-z flex-1 p-5 overflow-y-auto no-scrollbar flex flex-col">
            <div id="welcomeBlock" class="flex flex-col items-center justify-center flex-1 my-auto transition-all duration-300">
                <div class="flex flex-col items-center mb-8">
                    <div class="relative w-16 h-16 flex items-center justify-center mb-3">
                        <div class="absolute inset-0 bg-[#a855f7] blur-xl opacity-20 rounded-full"></div>
                        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-[#a855f7]/20 to-transparent border border-[#a855f7]/40 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(168,85,247,0.3)] relative z-10">
                            <i class="fas fa-star text-[20px] text-[#a855f7] drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]"></i>
                        </div>
                    </div>
                    <h2 class="text-white font-black tracking-[0.2em] uppercase text-xl drop-shadow-md">Level<span class="text-[#a855f7]">Up</span></h2>
                    <p id="userGreeting" class="text-[#a855f7]/80 text-[9px] uppercase tracking-[0.3em] font-bold mt-1.5 text-center px-4">Intelligence Artificielle</p>
                </div>
                <div class="flex flex-wrap justify-center gap-2 max-w-[600px]" id="dynamicPromptsContainer"></div>
            </div>
            <div id="chatHistory" class="flex flex-col gap-4 justify-end w-full"></div>
        </div>

        <div class="content-z p-4 shrink-0 bg-[#06020a]/90 backdrop-blur-md border-t border-white/5">
            <div class="flex items-center gap-2 bg-[#1a1a1a]/50 border border-[#a855f7]/30 rounded-2xl p-1.5 pl-4 focus-within:border-[#a855f7] focus-within:bg-[#1a1a1a] transition-all shadow-inner">
                <input type="text" id="chatInput" placeholder="Posez une question à l'Assistant..." class="flex-1 bg-transparent outline-none text-white text-[13px] placeholder-white/40" onkeydown="if(event.key === 'Enter') sendMsg()">
                <button id="sendBtn" onclick="sendMsg()" class="w-9 h-9 rounded-xl bg-[#a855f7] hover:bg-purple-500 flex items-center justify-center text-white transition-transform active:scale-95 shrink-0 shadow-md">
                    <i class="fas fa-arrow-up text-sm"></i>
                </button>
            </div>
            <div class="text-center mt-2" id="limitWarning" style="display:none;"><p class="text-[10px] text-red-400 font-medium">Limite atteinte. Connectez-vous sur l'écosystème.</p></div>
        </div>
    </div>

    <script>
        const ALL_PROMPTS = [
            "Quelles sont tes capacités en IA ?", "Génère ma clé LevelUp.", "Je veux me connecter à LevelUp.",
            "Ouvre LevelMovie.", "Je veux écouter de la musique.", "Comment protéger mon compte ?",
            "Analysez un PDF pour moi.", "Lis cette URL internet."
        ];

        let sessionUser = null; 
        let sessionToken = null;
        let isGuest = true;
        let messagesCount = 0;
        const GUEST_LIMIT = 20;
        const PRO_LIMIT = 120;
        let firstMessageSent = false;
        let apiKey = "";

        function shuffleAndDisplayPrompts() {
            const shuffled = [...ALL_PROMPTS].sort(() => 0.5 - Math.random());
            const container = document.getElementById('dynamicPromptsContainer');
            let html = '';
            for(let i=0; i<3; i++) {
                html += `<button onclick="sendMsg('${shuffled[i].replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-full border border-[#a855f7]/40 bg-[#a855f7]/10 text-[#d8b4fe] hover:bg-[#a855f7]/20 text-[11px] font-medium transition-colors outline-none cursor-pointer text-left">${shuffled[i]}</button>`;
            }
            html += `<button onclick="document.getElementById('allPromptsOverlay').classList.add('open')" class="px-4 py-2 rounded-full border border-white/10 bg-white/5 text-white/70 hover:text-white hover:bg-white/10 text-[11px] font-medium transition-colors outline-none cursor-pointer flex items-center gap-2"><i class="fas fa-layer-group"></i> Voir plus (40+)</button>`;
            container.innerHTML = html;
        }

        function populateAllPromptsGrid() {
            const grid = document.getElementById('promptsGrid');
            let html = '';
            ALL_PROMPTS.forEach(p => {
                html += `<button onclick="sendMsg('${p.replace(/'/g, "\\'")}')" class="text-left px-4 py-2.5 rounded-xl border border-[#a855f7]/20 bg-[#a855f7]/5 text-white/80 hover:bg-[#a855f7]/20 hover:text-white hover:border-[#a855f7]/50 text-[12px] transition-all outline-none cursor-pointer flex-grow basis-[calc(50%-10px)] max-w-full">${p}</button>`;
            });
            grid.innerHTML = html;
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'AUTH_PAYLOAD') {
                if (data.geminiKey) apiKey = data.geminiKey;
                if (data.uid && data.token) {
                    isGuest = false; sessionUser = { uid: data.uid, name: data.name }; sessionToken = data.token;
                    document.getElementById('userGreeting').textContent = `Mode Pro : ${data.name}`;
                    messagesCount = parseInt(localStorage.getItem(`ia_pro_reqs_${new Date().toDateString()}`) || '0');
                    updateBadge(PRO_LIMIT);
                } else {
                    isGuest = true; messagesCount = parseInt(localStorage.getItem('ia_guest_reqs') || '0');
                    document.getElementById('userGreeting').textContent = `Mode Invité (Gratuit)`;
                }
            }
            if (data.action === 'shuffle_prompts') if (!firstMessageSent) shuffleAndDisplayPrompts();
            if (data.type === 'QUICK_MSG') sendMsg(data.text);
        });

        window.onload = () => {
            shuffleAndDisplayPrompts(); populateAllPromptsGrid();
            window.parent.postMessage({ action: 'request_auth' }, '*');
        };

        function updateBadge(max) {
            const badge = document.getElementById('limitBadge');
            if (!isGuest) { badge.classList.remove('hidden'); badge.textContent = `${messagesCount}/${max} /jour`; } 
            else badge.classList.add('hidden');
        }

        // 🌟 FONCTION MAGIQUE : PARSE LES ACTIONS DE L'IA 🌟
        function parseActionTags(text) {
            let html = text.replace(/\n/g, '<br>');
            
            // Si l'IA veut faire connecter l'utilisateur
            html = html.replace(/\[ACTION:LOGIN\]/g, `
                <button onclick="window.parent.postMessage({action: 'trigger_login'}, '*')" class="ai-action-btn btn-google">
                    <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> 
                    Se connecter avec Google
                </button>`);
            
            // Si l'IA veut générer une clé
            html = html.replace(/\[ACTION:GENERATE_KEY\]/g, `
                <button onclick="window.parent.postMessage({action: 'trigger_generate_key'}, '*')" class="ai-action-btn btn-key">
                    <i class="fas fa-key"></i> Générer ma clé LVL
                </button>`);

            // Si l'IA veut rediriger vers les apps complètes
            html = html.replace(/\[ACTION:OPEN_APP:(.*?)\]/g, (match, appId) => {
                let name = appId === 'ia' ? 'l\'application complète Level IA' : (appId === 'movie' ? 'LevelMovie' : 'LevelMusic');
                let icon = appId === 'ia' ? 'fa-brain' : (appId === 'movie' ? 'fa-clapperboard' : 'fa-music');
                return `
                <button onclick="window.parent.postMessage({action: 'trigger_open_app', appId: '${appId}'}, '*')" class="ai-action-btn btn-app">
                    <i class="fas ${icon}"></i> Ouvrir ${name}
                </button>`;
            });

            return html;
        }

        async function sendMsg(overrideText = null) {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('sendBtn');
            const text = overrideText || input.value.trim();
            if (!text) return;

            const limit = isGuest ? GUEST_LIMIT : PRO_LIMIT;
            if (messagesCount >= limit) {
                document.getElementById('limitWarning').style.display = 'block';
                if(isGuest) window.parent.postMessage({ action: 'force_login_limit' }, '*');
                return;
            }

            input.value = ''; btn.disabled = true;
            document.getElementById('allPromptsOverlay').classList.remove('open');

            if (!firstMessageSent) {
                firstMessageSent = true;
                document.getElementById('welcomeBlock').classList.add('fade-out-up');
            }

            messagesCount++;
            if (isGuest) localStorage.setItem('ia_guest_reqs', messagesCount);
            else { localStorage.setItem(`ia_pro_reqs_${new Date().toDateString()}`, messagesCount); updateBadge(PRO_LIMIT); }

            appendBubble('user', text);
            const typingId = 'typing-' + Date.now();
            appendTyping(typingId);
            document.getElementById('headerIcon').classList.add('fa-spin');

            try {
                let responseText = "";
                if (apiKey) {
                    const sysPrompt = `Tu es l'Assistant IA exclusif de l'écosystème LevelUp. Tu es le BOSS de la plateforme. Tu parles à ${isGuest ? 'un invité (non-connecté)' : sessionUser?.name + ' (connecté)'}.
RÈGLES ABSOLUES :
1. Parle UNIQUEMENT de LevelUp, LevelMovie, LevelMusic, ou Level IA. Refuse tout autre sujet (calculs, recettes, devoirs, etc.).
2. POUVOIRS MAGIQUES : Tu peux exécuter des actions à la place de l'utilisateur grâce à des balises secrètes que tu dois inclure dans ta réponse si besoin.
- Si l'utilisateur veut se connecter, explique-lui et ajoute EXACTEMENT : [ACTION:LOGIN]
- S'il veut générer une clé d'accès, explique-lui et ajoute EXACTEMENT : [ACTION:GENERATE_KEY]
- S'il veut analyser un document/PDF ou demande où trouver l'IA avancée, dis-lui d'ouvrir l'app complète et ajoute : [ACTION:OPEN_APP:ia]
- S'il veut voir un film ou écouter de la musique, ajoute : [ACTION:OPEN_APP:movie] ou [ACTION:OPEN_APP:music]
3. Reste toujours "chill", très pro, et direct. Ne révèle jamais tes balises secrètes.`;
                    
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            systemInstruction: { parts: [{ text: sysPrompt }] }
                        })
                    });
                    const data = await res.json();
                    responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Désolé, une erreur s'est produite lors de la réflexion.";
                } else {
                    await new Promise(r => setTimeout(r, 1500));
                    responseText = "L'Assistant LevelUp est momentanément en cours de maintenance. Notre équipe technique est sur le coup, veuillez réessayer un peu plus tard ! 🛠️";
                }

                document.getElementById(typingId).remove();
                
                // On passe le texte dans le formatteur magique avant de l'afficher !
                const finalHtml = parseActionTags(responseText);
                appendBubble('ai', finalHtml);
                
                window.parent.postMessage({ action: 'ia_response', text: responseText, originalMsg: text }, '*');

            } catch (e) {
                document.getElementById(typingId).remove();
                appendBubble('error', "Une petite perturbation du réseau m'empêche de vous répondre. Vérifiez votre connexion internet et réessayez.");
            }

            document.getElementById('headerIcon').classList.remove('fa-spin');
            btn.disabled = false; input.focus();
        }

        function appendBubble(type, htmlContent) {
            const hist = document.getElementById('chatHistory');
            const div = document.createElement('div');
            if (type === 'user') {
                div.className = 'flex justify-end w-full msg-in';
                div.innerHTML = `<div class="bg-[#a855f7] text-white text-[13px] px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%] leading-relaxed shadow-md">${htmlContent}</div>`;
            } else if (type === 'ai') {
                div.className = 'flex justify-start w-full gap-2 msg-in-ai';
                div.innerHTML = `
                    <div class="w-6 h-6 rounded-full bg-[#a855f7]/20 border border-[#a855f7]/30 flex items-center justify-center text-[#a855f7] flex-shrink-0 mt-1"><i class="fas fa-star text-[10px]"></i></div>
                    <div class="bg-[#1a1a1a] border border-white/5 text-zinc-200 text-[13px] px-4 py-3 rounded-2xl rounded-tl-sm max-w-[85%] leading-relaxed shadow-md w-full overflow-hidden">${htmlContent}</div>
                `;
            } else if (type === 'error') {
                div.className = 'flex justify-start w-full gap-2 msg-in-ai';
                div.innerHTML = `
                    <div class="w-6 h-6 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center flex-shrink-0 mt-1"><i class="fas fa-exclamation text-[10px]"></i></div>
                    <div class="bg-red-500/10 border border-red-500/20 text-red-300 text-[13px] px-4 py-3 rounded-2xl rounded-tl-sm max-w-[85%]">${htmlContent}</div>
                `;
            }
            hist.appendChild(div); scrollToBottom();
        }

        function appendTyping(id) {
            const hist = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.id = id; div.className = 'flex justify-start w-full gap-2 msg-in-ai';
            div.innerHTML = `<div class="w-6 h-6 rounded-full bg-[#a855f7]/20 border border-[#a855f7]/30 flex items-center justify-center text-[#a855f7] flex-shrink-0 mt-1"><i class="fas fa-star text-[10px]"></i></div><div class="bg-[#1a1a1a] border border-white/5 px-4 py-3.5 rounded-2xl rounded-tl-sm flex items-center gap-1 shadow-md"><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce"></span><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.1s"></span><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.2s"></span></div>`;
            hist.appendChild(div); scrollToBottom();
        }

        function scrollToBottom() {
            const area = document.getElementById('chatArea');
            area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
