<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Assistant LevelUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* CORRECTION MOBILE NATIVE : position fixe et 100% au lieu de dvh */
        html, body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100%; width: 100%; background-color: transparent; overflow: hidden; color: white; overscroll-behavior: none; position: fixed; inset: 0; }
        .widget-container { position: absolute; inset: 0; background-color: #06020a; display: flex; flex-direction: column; overflow: hidden; }
        .space-bg { position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.4), transparent), radial-gradient(1px 1px at 85% 30%, rgba(255,255,255,0.3), transparent), radial-gradient(1.5px 1.5px at 45% 60%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 70% 80%, rgba(168,85,247,0.5), transparent), radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,0.4), transparent), radial-gradient(1.5px 1.5px at 90% 10%, rgba(168,85,247,0.5), transparent); background-size: 150px 150px; pointer-events: none; animation: spaceDrift 100s linear infinite; }
        @keyframes spaceDrift { 0% { background-position: 0 0; } 100% { background-position: -300px 300px; } }
        .content-z { position: relative; z-index: 10; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-out-up { animation: fadeOutUp 0.4s ease forwards; }
        @keyframes fadeOutUp { to { opacity: 0; transform: translateY(-20px) scale(0.95); pointer-events: none; height: 0; margin: 0; padding: 0; } }
        .msg-in { animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform-origin: bottom right; }
        .msg-in-ai { animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform-origin: bottom left; }
        @keyframes msgIn { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .prompts-overlay { position: absolute; inset: 0; z-index: 50; background: rgba(6, 2, 10, 0.98); backdrop-filter: blur(15px); display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .prompts-overlay.open { transform: translateY(0); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.4); }
        
        /* Boutons Magiques */
        .ai-action-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; padding: 10px 16px; border-radius: 12px; margin-top: 12px; font-size: 0.85rem; transition: transform 0.2s, filter 0.2s; cursor: pointer; border: none; outline: none; text-align: center; }
        .ai-action-btn:active { transform: scale(0.96); }
        .btn-google { background: white; color: #3c4043; border: 1px solid #dadce0; }
        .btn-google:hover { filter: brightness(0.95); }
        .btn-key { background: linear-gradient(135deg, #a855f7, #3b82f6); color: white; box-shadow: 0 4px 15px rgba(168,85,247,0.4); }
        .btn-key:hover { filter: brightness(1.1); }
        .btn-app { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; }
        .btn-app:hover { background: rgba(255,255,255,0.15); }
        .btn-nav { background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.4); color: #d8b4fe; }
        .btn-nav:hover { background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.6); }

        /* ── MINI-MODE (RÉDUIT) ── */
        body.mini-mode #appHeader { display: none !important; }
        body.mini-mode #chatArea { display: none !important; }
        body.mini-mode .space-bg { display: none !important; }
        body.mini-mode .widget-container { justify-content: center; background-color: rgba(6, 2, 10, 0.98) !important; backdrop-filter: blur(12px); border-radius: 20px; }
        /* CORRECTION : height: 100% pour qu'il reste dans la barre de 75px */
        body.mini-mode #appInputBar { border-top: none; background: transparent !important; height: 100%; display: flex; align-items: center; padding: 0 16px; margin: 0; }
        
        /* État "Verrouillé" pour les invités */
        body.guest-mode .locked-overlay { display: flex; }
        body.guest-mode #appInputBar { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
    </style>
</head>
<body class="guest-mode">
    <div class="widget-container">
        <div class="space-bg"></div>
        <div id="allPromptsOverlay" class="prompts-overlay">
            <div class="flex justify-between items-center px-6 pb-4 border-b border-white/10 shrink-0 bg-black/20" style="padding-top: max(16px, env(safe-area-inset-top));">
                <h3 class="text-white font-bold text-sm flex items-center gap-2">
                    <i class="fas fa-list-ul text-[#a855f7]"></i> Que voulez-vous savoir ?
                </h3>
                <button onclick="document.getElementById('allPromptsOverlay').classList.remove('open')" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/70 transition-colors">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                <div id="promptsGrid" class="flex flex-wrap gap-2.5"></div>
            </div>
        </div>

        <div class="content-z flex justify-between items-center px-4 border-b border-white/10 shrink-0 bg-[#06020a]/80 backdrop-blur-md" id="appHeader" style="padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: 12px;">
            <div class="flex items-center gap-2.5 text-white font-bold text-[14px]">
                <i class="fas fa-star text-[#a855f7] text-[16px]" id="headerIcon"></i> Votre Assistant
            </div>
            <div class="flex items-center gap-3">
                <div id="limitBadge" class="hidden px-2 py-1 rounded border border-[#a855f7]/30 bg-[#a855f7]/10 text-[10px] text-[#d8b4fe] font-mono">--/130</div>
                <button onclick="minimizeIA()" class="w-8 h-8 rounded-full bg-transparent border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-white/5 transition-colors">
                    <i class="fas fa-minus text-[12px]"></i>
                </button>
                <button onclick="closeIA()" class="px-3 py-1.5 rounded-full bg-[#ef4444]/10 border border-[#ef4444]/30 text-[#fca5a5] text-[11px] font-black uppercase tracking-widest flex items-center gap-1.5 hover:bg-[#ef4444]/20 transition-colors shadow-[0_0_10px_rgba(239,68,68,0.2)]">
                    <i class="fas fa-power-off text-[10px]"></i> OFF
                </button>
            </div>
        </div>

        <div id="chatArea" class="content-z flex-1 p-5 overflow-y-auto no-scrollbar flex flex-col relative">
            
            <!-- Message Verrouillage (Seulement affiché en mode Invité) -->
            <div class="locked-overlay absolute inset-0 z-20 hidden flex-col items-center justify-center bg-[#06020a]/80 backdrop-blur-sm p-6 text-center transition-all duration-300">
                <div class="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center mb-4">
                    <i class="fas fa-lock text-red-400 text-2xl"></i>
                </div>
                <h3 class="text-white font-bold text-lg mb-2">Accès Réservé</h3>
                <p class="text-sm text-gray-400 mb-6 max-w-xs">Seuls les utilisateurs authentifiés de LevelUp peuvent interagir avec l'Assistant IA.</p>
                <button onclick="triggerLogin()" class="bg-white text-black px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-gray-200 transition-colors">
                    <i class="fas fa-user-circle"></i> Se connecter
                </button>
            </div>

            <div id="welcomeBlock" class="flex flex-col items-center justify-center flex-1 my-auto transition-all duration-300">
                <div class="flex flex-col items-center mb-8">
                    <div class="relative w-16 h-16 flex items-center justify-center mb-3">
                        <div class="absolute inset-0 bg-[#a855f7] blur-xl opacity-20 rounded-full"></div>
                        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-[#a855f7]/20 to-transparent border border-[#a855f7]/40 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(168,85,247,0.3)] relative z-10">
                            <i class="fas fa-star text-[20px] text-[#a855f7] drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]"></i>
                        </div>
                    </div>
                    <h2 class="text-white font-black tracking-[0.2em] uppercase text-xl drop-shadow-md">Level<span class="text-[#a855f7]">Up</span></h2>
                    <p id="userGreeting" class="text-[#a855f7]/80 text-[9px] uppercase tracking-[0.3em] font-bold mt-1.5 text-center px-4">Lecture Seule</p>
                </div>
                <div class="flex flex-wrap justify-center gap-2 max-w-[600px]" id="dynamicPromptsContainer"></div>
            </div>
            <div id="chatHistory" class="flex flex-col gap-4 justify-end w-full pb-4"></div>
        </div>

        <div class="content-z p-4 shrink-0 bg-[#06020a]/90 backdrop-blur-md border-t border-white/5" id="appInputBar">
            <div class="flex items-center gap-2 bg-[#1a1a1a]/50 border border-[#a855f7]/30 rounded-2xl p-1.5 pl-4 focus-within:border-[#a855f7] focus-within:bg-[#1a1a1a] transition-all shadow-inner w-full">
                <input type="text" id="chatInput" placeholder="Posez une question à l'Assistant..." class="flex-1 bg-transparent outline-none text-white text-[13px] placeholder-white/40 disabled:opacity-50" onkeydown="if(event.key === 'Enter') sendMsg()">
                <button id="sendBtn" onclick="sendMsg()" class="w-9 h-9 rounded-xl bg-[#a855f7] hover:bg-purple-500 disabled:bg-gray-600 disabled:opacity-50 flex items-center justify-center text-white transition-transform active:scale-95 shrink-0 shadow-md">
                    <i class="fas fa-arrow-up text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- PLUS AUCUN SCRIPT FIREBASE ICI ! L'IFRAME EST "DUMB" ET SÉCURISÉE -->

    <script>
        const ALL_PROMPTS = [
            "Quelles sont tes capacités en IA ?", "Génère ma clé LevelUp.", "Ouvre LevelMovie.", 
            "Je veux écouter de la musique.", "Comment protéger mon compte ?", "Analysez un PDF pour moi.", 
            "Est-ce qu'il y a le film Inception sur LevelMovie ?", "Y a-t-il la série Breaking Bad ?", 
            "Mets une playlist pour réviser", "Je veux voir mes statistiques", "Comment devenir membre Pro ?", 
            "Donne-moi une recommandation de film d'action", "Joue de la musique relaxante", 
            "Montre-moi les paramètres de mon compte", "Comment changer mon mot de passe ?", 
            "Qu'est-ce que l'écosystème LevelUp ?", "Mets du rap sur LevelMusic", "Crée une image pour moi", 
            "Comment contacter le support ?", "Quels sont les avantages du mode Pro ?", 
            "Lance l'application Level IA complète", "Affiche mon historique de visionnage", 
            "Comment utiliser l'Assistant IA à 100% ?", "Ouvre mon tableau de bord"
        ];

        // VARIABLES DE SÉCURITÉ (ÉPHÉMÈRES)
        let ephemeralSessionToken = null; 
        let userProfile = null;
        let messagesCount = 0;
        const PRO_LIMIT = 130; // Nouvelle limite de 130 requêtes par jour.
        
        let firstMessageSent = false;
        let currentTypingId = null; 
        let isWaitingForAI = false; 

        function minimizeIA() {
            window.parent.postMessage({action: 'minimize_ia'}, '*');
        }

        function closeIA() {
            // DESTRUCTION IMMÉDIATE DU JETON ET DU CHAT LORS DE LA FERMETURE
            ephemeralSessionToken = null;
            document.body.classList.add('guest-mode');
            window.parent.postMessage({action: 'close_ia'}, '*');
        }

        function triggerLogin() {
            window.parent.postMessage({action: 'trigger_login'}, '*');
        }

        function shuffleAndDisplayPrompts() {
            const shuffled = [...ALL_PROMPTS].sort(() => 0.5 - Math.random());
            const container = document.getElementById('dynamicPromptsContainer');
            let html = '';
            for(let i=0; i<3; i++) {
                html += `<button onclick="sendMsg('${shuffled[i].replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-full border border-[#a855f7]/40 bg-[#a855f7]/10 text-[#d8b4fe] hover:bg-[#a855f7]/20 text-[11px] font-medium transition-colors outline-none cursor-pointer text-left">${shuffled[i]}</button>`;
            }
            html += `<button onclick="document.getElementById('allPromptsOverlay').classList.add('open')" class="px-4 py-2 rounded-full border border-white/10 bg-white/5 text-white/70 hover:text-white hover:bg-white/10 text-[11px] font-medium transition-colors outline-none cursor-pointer flex items-center gap-2"><i class="fas fa-layer-group"></i> Voir plus (40+)</button>`;
            container.innerHTML = html;
        }

        function populateAllPromptsGrid() {
            const grid = document.getElementById('promptsGrid');
            let html = '';
            ALL_PROMPTS.forEach(p => {
                html += `<button onclick="sendMsg('${p.replace(/'/g, "\\'")}')" class="text-left px-4 py-2.5 rounded-xl border border-[#a855f7]/20 bg-[#a855f7]/5 text-white/80 hover:bg-[#a855f7]/20 hover:text-white hover:border-[#a855f7]/50 text-[12px] transition-all outline-none cursor-pointer flex-grow basis-[calc(50%-10px)] max-w-full">${p}</button>`;
            });
            grid.innerHTML = html;
        }

        // 🌟 L'ÉCOUTEUR DE SÉCURITÉ 🌟
        window.addEventListener('message', (event) => {
            const data = event.data;
            
            // L'Écosystème vient de générer un jeton de session pour nous
            if (data.action === 'START_SESSION') {
                if (data.token) {
                    ephemeralSessionToken = data.token; // Jeton stocké en RAM uniquement !
                    userProfile = { name: data.name };
                    
                    // Déverrouillage de l'Iframe
                    document.body.classList.remove('guest-mode');
                    document.getElementById('userGreeting').textContent = `Connecté : ${data.name}`;
                    
                    // Gestion du compteur stocké (côté Iframe juste pour l'UI)
                    messagesCount = parseInt(localStorage.getItem(`ia_reqs_${new Date().toDateString()}`) || '0');
                    updateBadge();
                } else {
                    // Si l'écosystème ne donne pas de token (utilisateur déconnecté)
                    ephemeralSessionToken = null;
                    document.body.classList.add('guest-mode');
                    document.getElementById('userGreeting').textContent = `Mode Invité (Lecture Seule)`;
                    updateBadge(0); 
                }
            }

            // L'Écosystème a fermé brutalement ou la session expire
            if (data.action === 'END_SESSION') {
                ephemeralSessionToken = null;
                document.body.classList.add('guest-mode');
            }
            
            if (data.action === 'shuffle_prompts') if (!firstMessageSent) shuffleAndDisplayPrompts();
            if (data.type === 'QUICK_MSG') sendMsg(data.text);
            
            /* GESTION DU MODE RÉDUIT */
            if (data.type === 'SET_VIEW') {
                if (data.view === 'mini') {
                    document.body.classList.add('mini-mode');
                    window.parent.postMessage({action: 'enable_parent_scroll'}, '*');
                } else {
                    document.body.classList.remove('mini-mode');
                    window.parent.postMessage({action: 'disable_parent_scroll'}, '*'); 
                    setTimeout(scrollToBottom, 150);
                }
            }

            /* RÉPONSE DE L'API GEMINI VIA L'ÉCOSYSTÈME */
            if (data.action === 'ia_api_response') {
                isWaitingForAI = false;
                const inputEl = document.getElementById('chatInput');
                inputEl.disabled = false;
                inputEl.placeholder = "Posez une question à l'Assistant...";
                document.getElementById('sendBtn').disabled = false;
                
                if (currentTypingId) {
                    const el = document.getElementById(currentTypingId);
                    if (el) el.remove();
                    currentTypingId = null;
                }
                document.getElementById('headerIcon').classList.remove('fa-spin');
                inputEl.focus();

                if (data.error) {
                    appendBubble('error', data.text);
                } else {
                    const finalHtml = parseActionTags(data.text);
                    appendBubble('ai', finalHtml);
                }
            }
        });

        window.onload = () => {
            shuffleAndDisplayPrompts(); populateAllPromptsGrid();
            // Au démarrage, l'Iframe demande à l'écosystème d'ouvrir une session
            window.parent.postMessage({ action: 'request_session' }, '*');
        };

        function updateBadge() {
            const badge = document.getElementById('limitBadge');
            if (ephemeralSessionToken) { 
                badge.classList.remove('hidden'); 
                badge.textContent = `${messagesCount}/${PRO_LIMIT}`; 
            } else {
                badge.classList.add('hidden');
            }
        }

        // PARSEUR MAGIQUE DES ACTIONS DE L'IA
        function parseActionTags(text) {
            let html = text.replace(/\n/g, '<br>');
            
            html = html.replace(/\[ACTION:LOGIN\]/g, `<button onclick="triggerLogin()" class="ai-action-btn btn-google mt-3"><i class="fas fa-user-circle"></i> Se connecter</button>`);
            html = html.replace(/\[ACTION:GENERATE_KEY\]/g, `<button onclick="window.parent.postMessage({action: 'trigger_generate_key'}, '*')" class="ai-action-btn btn-key mt-3"><i class="fas fa-key"></i> Générer ma clé LVL</button>`);
            html = html.replace(/\[ACTION:OPEN_DASHBOARD\]/g, `<button onclick="window.parent.postMessage({action: 'trigger_open_dashboard'}, '*')" class="ai-action-btn btn-nav mt-3"><i class="fas fa-chart-line"></i> Ouvrir mon Tableau de Bord</button>`);
            html = html.replace(/\[ACTION:OPEN_TERMS\]/g, `<button onclick="window.parent.postMessage({action: 'trigger_open_terms'}, '*')" class="ai-action-btn btn-nav mt-3"><i class="fas fa-file-contract"></i> Lire les Conditions</button>`);
            html = html.replace(/\[ACTION:FAVORITE:(.*?)\]/g, (match, itemName) => {
                return `<button onclick="window.parent.postMessage({action: 'trigger_favorite', item: '${itemName.replace(/'/g, "\\'")}'}, '*')" class="ai-action-btn btn-nav mt-3"><i class="fas fa-heart text-red-500"></i> Ajouter ${itemName} aux favoris</button>`;
            });
            html = html.replace(/\[ACTION:OPEN_APP:(.*?)\]/g, (match, appId) => {
                let name = appId === 'ia' ? 'Level IA Premium' : (appId === 'movie' ? 'LevelMovie' : 'LevelMusic');
                let icon = appId === 'ia' ? 'fa-brain' : (appId === 'movie' ? 'fa-clapperboard' : 'fa-music');
                return `<button onclick="window.parent.postMessage({action: 'trigger_open_app', appId: '${appId}'}, '*')" class="ai-action-btn btn-app mt-3"><i class="fas ${icon}"></i> Ouvrir ${name}</button>`;
            });

            return html;
        }

        async function sendMsg(overrideText = null) {
            // BLOQUAGE DE SÉCURITÉ : Si pas de Jeton Éphémère, on bloque l'action
            if (!ephemeralSessionToken) {
                triggerLogin();
                return;
            }

            if (isWaitingForAI) return;

            const input = document.getElementById('chatInput');
            const btn = document.getElementById('sendBtn');
            const text = overrideText || input.value.trim();
            if (!text) return;

            /* Auto-agrandissement immédiat */
            if (document.body.classList.contains('mini-mode')) {
                document.body.classList.remove('mini-mode');
                window.parent.postMessage({action: 'expand_ia'}, '*');
                window.parent.postMessage({action: 'disable_parent_scroll'}, '*');
            }

            // GESTION DE LA LIMITE DE 130 MESSAGES
            if (messagesCount >= PRO_LIMIT) {
                appendBubble('user', text);
                setTimeout(() => {
                    appendBubble('ai', `Vous avez atteint votre limite maximale de **${PRO_LIMIT} requêtes pour aujourd'hui**. 🛑<br><br>Votre quota sera réinitialisé demain à minuit. Merci d'utiliser LevelUp Ecosystem !`);
                }, 500);
                input.value = '';
                return;
            }

            isWaitingForAI = true;
            input.value = ''; 
            input.disabled = true;
            input.placeholder = "L'IA réfléchit...";
            btn.disabled = true;

            document.getElementById('allPromptsOverlay').classList.remove('open');

            if (!firstMessageSent) {
                firstMessageSent = true;
                document.getElementById('welcomeBlock').classList.add('fade-out-up');
            }

            // Incrémentation et Sauvegarde locale de la limite du jour
            messagesCount++;
            localStorage.setItem(`ia_reqs_${new Date().toDateString()}`, messagesCount); 
            updateBadge();

            appendBubble('user', text);
            currentTypingId = 'typing-' + Date.now();
            appendTyping(currentTypingId);
            document.getElementById('headerIcon').classList.add('fa-spin');

            // 🚀 ENVOI À L'ÉCOSYSTÈME AVEC LE JETON DE SÉCURITÉ 🚀
            window.parent.postMessage({
                action: 'process_ia_prompt',
                text: text,
                sessionToken: ephemeralSessionToken // C'est la clé magique pour que le parent accepte !
            }, '*');
        }

        function appendBubble(type, htmlContent) {
            const hist = document.getElementById('chatHistory');
            const div = document.createElement('div');
            if (type === 'user') {
                div.className = 'flex justify-end w-full msg-in';
                div.innerHTML = `<div class="bg-[#a855f7] text-white text-[13px] px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%] leading-relaxed shadow-md">${htmlContent}</div>`;
            } else if (type === 'ai') {
                div.className = 'flex justify-start w-full gap-2 msg-in-ai';
                div.innerHTML = `
                    <div class="w-6 h-6 rounded-full bg-[#a855f7]/20 border border-[#a855f7]/30 flex items-center justify-center text-[#a855f7] flex-shrink-0 mt-1"><i class="fas fa-star text-[10px]"></i></div>
                    <div class="bg-[#1a1a1a] border border-white/5 text-zinc-200 text-[13px] px-4 py-3 rounded-2xl rounded-tl-sm max-w-[85%] leading-relaxed shadow-md w-full overflow-hidden">${htmlContent}</div>
                `;
            } else if (type === 'error') {
                div.className = 'flex justify-start w-full gap-2 msg-in-ai';
                div.innerHTML = `
                    <div class="w-6 h-6 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center flex-shrink-0 mt-1"><i class="fas fa-exclamation text-[10px]"></i></div>
                    <div class="bg-red-500/10 border border-red-500/20 text-red-300 text-[13px] px-4 py-3 rounded-2xl rounded-tl-sm max-w-[85%]">${htmlContent}</div>
                `;
            }
            hist.appendChild(div); scrollToBottom();
        }

        function appendTyping(id) {
            const hist = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.id = id; div.className = 'flex justify-start w-full gap-2 msg-in-ai';
            div.innerHTML = `<div class="w-6 h-6 rounded-full bg-[#a855f7]/20 border border-[#a855f7]/30 flex items-center justify-center text-[#a855f7] flex-shrink-0 mt-1"><i class="fas fa-star text-[10px]"></i></div><div class="bg-[#1a1a1a] border border-white/5 px-4 py-3.5 rounded-2xl rounded-tl-sm flex items-center gap-1 shadow-md"><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce"></span><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.1s"></span><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.2s"></span></div>`;
            hist.appendChild(div); scrollToBottom();
        }

        function scrollToBottom() {
            const area = document.getElementById('chatArea');
            area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
